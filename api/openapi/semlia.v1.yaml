          description: Complete production detail, not a second release authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionRelease"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/production-releases/{releaseId}/rollback:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ReleaseId"
    post:
      operationId: rollbackProductionRelease
      summary: Create a latest-only release restoring the exact before manifest including absence
      tags:
        - Governance
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackProductionRequest"
      responses:
        "200":
          description: Authorized replay of the committed release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCommandResult"
        "201":
          description: All members committed as one immutable release
          headers:
            Location:
              schema:
                type: string
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    MachineBearer:
      type: http
      scheme: bearer
      description: Verifier-only machine credential. Workspace, principal and consumer binding are server-derived. Cookie plus bearer is rejected.
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-semlia_session
      description: Opaque server-side session cookie. Development uses semlia_session_dev.
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WorkspaceId"
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SemanticAssetId"
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AssetRevisionId"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RunId"
    AuditExportId:
      name: exportId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/EventId"
    AuthorizationRoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AuthorizationRoleId"
    AuthorizationRoleBindingId:
      name: bindingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AuthorizationRoleBindingId"
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SourceConnectionId"
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SemanticCandidateId"
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SourceSnapshotId"
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProductionOperationId"
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GovernanceProposalId"
    ReviewBatchId:
      name: batchId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GovernanceReviewBatchId"
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GovernanceReleaseId"
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GovernanceModelProviderId"
    SettingId:
      name: settingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GovernanceModelSettingId"
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MembershipId"
    ConsumerId:
      name: consumerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConsumerId"
    ConsumerBindingId:
      name: bindingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConsumerBindingId"
    SemanticQueryId:
      name: queryId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SemanticQueryId"
    ResolvedSemanticPlanId:
      name: planId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResolvedSemanticPlanId"
    AttentionItemId:
      name: attentionItemId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AttentionItemId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Workspace-scoped command replay key.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    CSRF:
      name: X-Semlia-CSRF
      in: header
      required: true
      description: Session-bound CSRF verifier required with an allowlisted Origin on unsafe requests.
      schema:
        type: string
        minLength: 32
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        $ref: "#/components/schemas/Cursor"
  headers:
    TraceId:
      description: W3C-compatible trace identifier for support and correlation.
      required: true
      schema:
        $ref: "#/components/schemas/TraceId"
    CSRF:
      description: Session-bound CSRF verifier. Never persisted in plaintext.
      required: true
      schema:
        type: string
        minLength: 32
  responses:
    Error:
      description: The request failed.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
        Retry-After:
          description: Suggested retry delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: The request is invalid.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: A valid active server-side session is required.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The workspace-scoped resource was not found.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current registry state.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The acting principal lacks the required capability.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: The request is well-formed but violates a governance gate.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ClientCredentialId:
      type: string
      pattern: '^ccd_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
    ClientCredentialSummary:
      type: object
      additionalProperties: false
      required: [id, workspaceId, consumerId, bindingId, principalId, name, tokenPrefix, allowedActions, scopeType, scopeId, issuedBy, issuedAt, expiresAt]
      properties:
        id: { type: string, pattern: '^ccd_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$' }
        workspaceId: { $ref: '#/components/schemas/WorkspaceId' }
        consumerId: { $ref: '#/components/schemas/ConsumerId' }
        bindingId: { $ref: '#/components/schemas/ConsumerBindingId' }
        principalId: { type: string }
        name: { type: string }
        tokenPrefix: { type: string }
        allowedActions: { type: array, items: { type: string, enum: [asset.read, semantic.resolve, semantic.execute] } }
        scopeType: { type: string, enum: [workspace, asset, release] }
        scopeId: { type: string }
        issuedBy: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        rotatedFromId: { type: string }
        lastUsedAt: { type: string, format: date-time }
    IssueClientCredential:
      type: object
      additionalProperties: false
      required: [consumerId, bindingId, principalId, name, allowedActions, scopeType, scopeId, expiresAt]
      properties:
        consumerId: { $ref: '#/components/schemas/ConsumerId' }
        bindingId: { $ref: '#/components/schemas/ConsumerBindingId' }
        principalId: { type: string }
        name: { type: string, minLength: 1, maxLength: 160 }
        allowedActions: { type: array, minItems: 1, maxItems: 3, uniqueItems: true, items: { type: string, enum: [asset.read, semantic.resolve, semantic.execute] } }
        scopeType: { type: string, enum: [workspace, asset, release] }
        scopeId: { type: string }
        expiresAt: { type: string, format: date-time }
    IssuedCredential:
      type: object
      additionalProperties: false
      required: [credential, token]
      properties:
        credential: { $ref: '#/components/schemas/ClientCredentialSummary' }
        token: { type: string, description: Returned exactly once; never store in browser storage. Rotation revokes the prior credential atomically with zero grace. }
    CreateMachinePrincipal:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
    MachinePrincipal:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
    WebhookSubscription:
      type: object
      additionalProperties: false
      required: [id, workspaceId, name, endpoint, enabled, eventTypes, version, signingVersion, secretSuffix, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { $ref: '#/components/schemas/WorkspaceId' }
        name: { type: string }
        endpoint: { type: string, format: uri }
        enabled: { type: boolean }
        eventTypes: { type: array, items: { type: string, enum: [release.published, catalog.asset.changed] } }
        version: { type: integer }
        signingVersion: { type: integer }
        secretSuffix: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SaveWebhookSubscription:
      type: object
      additionalProperties: false
      required: [name, endpoint, enabled, eventTypes]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        endpoint: { type: string, format: uri, maxLength: 2048 }
        enabled: { type: boolean }
        eventTypes: { type: array, minItems: 1, maxItems: 2, items: { type: string, enum: [release.published, catalog.asset.changed] } }
        expectedVersion: { type: integer, minimum: 0 }
    WebhookRotation:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    IssuedWebhookSubscription:
      type: object
      additionalProperties: false
      required: [subscription, signingSecret]
      properties:
        subscription: { $ref: '#/components/schemas/WebhookSubscription' }
        signingSecret: { type: string, description: One-time create or rotate secret. Empty on ordinary updates. Pending deliveries from older subscription versions are cancelled before transport; in-flight attempts may finish with their captured version. }
    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, workspaceId, subscriptionId, subscriptionVersion, signingVersion, eventId, eventType, state, attempt, maxAttempts, httpStatus, payloadDigest, traceId, createdAt, updatedAt, nextAttemptAt, runtimeRunId]
      properties:
        id: { type: string }
        workspaceId: { $ref: '#/components/schemas/WorkspaceId' }
        subscriptionId: { type: string }
        subscriptionVersion: { type: integer }
        signingVersion: { type: integer }
        eventId: { type: string }
        eventType: { type: string }
        state: { type: string, enum: [queued, running, succeeded, cancelled, dead_letter] }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        httpStatus: { type: integer }
        errorCode: { type: string }
        payloadDigest: { type: string }
        traceId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        nextAttemptAt: { type: string, format: date-time }
        runtimeRunId: { type: string }
    EmbeddingIndexVersion:
      type: object
      additionalProperties: false
      required: [id, workspaceId, releaseId, model, dimension, corpusDigest, chunkCount, vectorCount, state, errorCode, runtimeRunId, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/RunId' }
        workspaceId: { $ref: '#/components/schemas/WorkspaceId' }
        releaseId: { $ref: '#/components/schemas/GovernanceReleaseId' }
        model: { type: string }
        dimension: { type: integer, minimum: 1, maximum: 4096 }
        corpusDigest: { type: string }
        chunkCount: { type: integer, minimum: 1, maximum: 5000 }
        vectorCount: { type: integer, minimum: 0 }
        state: { type: string, enum: [building, active, retired, failed, cancelled] }
        errorCode: { type: string }
        runtimeRunId: { $ref: '#/components/schemas/RunId' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmbeddingIndexStatus:
      type: object
      additionalProperties: false
      required: [configured, reason, active, latest]
