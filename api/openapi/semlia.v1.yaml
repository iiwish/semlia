        reason:
          type: string
          maxLength: 4096
        agentRunId:
          $ref: "#/components/schemas/GovernanceAgentRunId"
        createdBy:
          type: string
          minLength: 1
          maxLength: 256
        submittedAt:
          $ref: "#/components/schemas/Timestamp"
        decidedAt:
          $ref: "#/components/schemas/Timestamp"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        changeSet:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceChangeSetItemRecord"
    GovernanceProposalPage:
      type: object
      additionalProperties: false
      required:
        - items
