        part of the vocabulary.
      enum:
        - expert
        - batch
    GovernancePolicyDecision:
      type: object
      additionalProperties: false
      required:
        - ruleVersion
        - inputsDigest
        - riskLevel
        - routing
        - matchedRuleId
        - reasonCode
        - explanation
        - matchedInputFields
        - createdAt
      properties:
        ruleVersion:
          type: string
          description: Version of the rule table the decision was computed with.
          pattern: "^[0-9]+\\.[0-9]+$"
        inputsDigest:
          description: sha256 content digest of the canonical decision inputs the rule table consumed.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        riskLevel:
          $ref: "#/components/schemas/GovernanceRiskLevel"
        routing:
          $ref: "#/components/schemas/GovernanceRoutingChannel"
        matchedRuleId:
          type: string
          description: Identifier of the matched seeded rule row, or the fail-safe default policy.
          minLength: 1
          maxLength: 128
        reasonCode:
          type: string
          description: Stable machine-readable reason the decision is explainable by.
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        explanation:
          type: string
          description: Human-readable explanation carried by the matched rule.
          maxLength: 512
        matchedInputFields:
          type: array
          description: Decision input categories the matched rule conditions reference.
          items:
            type: string
            description: Closed DecisionInputs field name.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
