        - {name: actorId, in: query, schema: {type: string, maxLength: 128}}
        - {name: eventType, in: query, schema: {type: string, maxLength: 128}}
        - {name: objectType, in: query, schema: {type: string, maxLength: 64}}
        - {name: objectId, in: query, schema: {type: string, maxLength: 128}}
        - {name: traceId, in: query, schema: {$ref: "#/components/schemas/TraceId"}}
        - {name: from, in: query, schema: {$ref: "#/components/schemas/Timestamp"}}
        - {name: to, in: query, schema: {$ref: "#/components/schemas/Timestamp"}}
      responses:
        "200":
          description: Cursor-paged redacted audit events.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsAuditEventPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/workspaces/{workspaceId}/operations/audit-exports:
    post:
      operationId: createOperationsAuditExport
      summary: Create a bounded redacted audit export
      description: Requires audit.read and applies the exact same filters and projection as audit listing.
      tags: [Operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateOperationsAuditExportRequest"}
      responses:
        "201":
          description: Export metadata and short-lived artifact identity.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsAuditExport"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/workspaces/{workspaceId}/operations/audit-exports/{exportId}/content:
    get:
      operationId: getOperationsAuditExportContent
      summary: Download a persisted redacted audit export
      description: Requires audit.read. The response bytes are the immutable export snapshot identified by contentDigest.
      tags: [Operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/AuditExportId"
      responses:
        "200":
          description: Exact persisted JSON export bytes.
          headers:
            ETag:
              schema: {type: string}
            X-Content-SHA256:
              schema: {type: string, pattern: "^[0-9a-f]{64}$"}
