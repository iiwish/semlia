          },
          "refreshFrequency": {
            "type": "string"
          },
          "sensitivity": {
            "type": "string"
          },
          "baseObjectRef": {
            "$ref": "#/components/schemas/KnowledgeReference"
          },
          "publicAttributeRefs": {
            "type": "array",
            "maxItems": 256,
            "items": {
              "$ref": "#/components/schemas/KnowledgeReference"
            }
          },
          "metricRefs": {
            "type": "array",
            "maxItems": 256,
            "items": {
              "$ref": "#/components/schemas/KnowledgeReference"
            }
          },
          "compatibleTermRefs": {
