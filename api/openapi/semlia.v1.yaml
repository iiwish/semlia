          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/reviews:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OperationId"
