          },
          "right": {
            "$ref": "#/components/schemas/KnowledgeExpression"
          }
        }
      }
    KnowledgeParameter:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "type",
          "required"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "type": {
