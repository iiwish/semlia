openapi: 3.0.3
info:
  title: Semlia Control API
  version: 0.4.0
  description: Versioned control-plane contract shared by Semlia services and clients.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
x-semlia-contract-version: 4
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
    description: Process and dependency status.
  - name: Catalog
    description: Workspace-scoped semantic assets, immutable revisions and provenance.
  - name: Governance
    description: Workspace-scoped governed proposals over semantic assets and governance objects.
  - name: Discovery
    description: Source discovery run state and findings.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the process is alive
      tags:
        - System
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required dependencies are ready
      tags:
        - System
      responses:
        "200":
          description: Required dependencies are ready.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      summary: Read public build and contract information
      tags:
        - System
      responses:
        "200":
          description: Public service information.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List available workspaces
      tags:
        - Catalog
      responses:
        "200":
          description: Workspaces ordered for catalog selection, with populated workspaces first.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createWorkspace
      summary: Create a workspace
      tags:
        - Catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: The created workspace.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/catalog/assets:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listCatalogAssets
      summary: Search and paginate semantic assets
      tags:
        - Catalog
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: search
          in: query
          description: Lexical query matched against semantic address and current revision content.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: assetType
          in: query
          schema:
            $ref: "#/components/schemas/SemanticAssetType"
        - name: lifecycleState
          in: query
          schema:
            $ref: "#/components/schemas/AssetLifecycleState"
      responses:
        "200":
          description: A deterministic catalog page.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCatalogAsset
      summary: Create an asset and its initial immutable revision
      tags:
        - Catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogAssetRequest"
      responses:
        "201":
          description: The created asset detail.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogAssetDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/catalog/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getCatalogAsset
      summary: Read an asset and its current revision
      tags:
        - Catalog
      responses:
        "200":
          description: Current asset detail and provenance.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogAssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/catalog/assets/{assetId}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: listAssetRevisions
      summary: List immutable asset revisions newest first
      tags:
        - Catalog
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Immutable revision history.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetRevisionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAssetRevision
      summary: Append and select a new immutable asset revision
      tags:
        - Catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRevisionRequest"
      responses:
        "201":
          description: The appended immutable revision.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/catalog/assets/{assetId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssetId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      operationId: getAssetRevision
      summary: Read one immutable asset revision
      tags:
        - Catalog
      responses:
        "200":
          description: Immutable revision content and evidence.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetRevision"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/catalog/assets/{assetId}/relations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: listAssetRelations
      summary: Read bounded incoming and outgoing typed relations
      tags:
        - Catalog
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - incoming
              - outgoing
              - both
            default: both
        - name: plane
          in: query
          schema:
            $ref: "#/components/schemas/RelationPlane"
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 1
      responses:
        "200":
          description: A bounded relation projection.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetRelationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/proposals:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listGovernanceProposals
      summary: List workspace proposals newest first
      tags:
        - Governance
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A deterministic governance proposals page.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProposalPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createGovernanceProposal
      summary: Open a governed draft proposal with a structured change-set
      description: >-
        Creates a draft proposal against a semantic asset or one of the four
        governance object types. Agent-attributed payloads are validated
        against the versioned semlia.proposal-input/v1 schema before any
        domain write; change-sets without a substantive diff are rejected.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGovernanceProposalRequest"
      responses:
        "201":
          description: The created draft proposal with its change-set.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProposalDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/proposals/{proposalId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProposalId"
    get:
      operationId: getGovernanceProposal
      summary: Read one proposal and its change-set
      tags:
        - Governance
      responses:
        "200":
          description: Proposal state, attribution and structured change-set.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProposalDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/proposals/{proposalId}/submit:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProposalId"
    post:
      operationId: submitGovernanceProposal
      summary: Submit a draft proposal for governance
      description: >-
        Walks draft -> proposed, freezing the change-set. Proposals whose
        change-set normalizes to no substantive diff never enter the human
        queue and stay drafts.
      tags:
        - Governance
      responses:
        "200":
          description: The submitted proposal in the proposed state.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProposalDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/discovery-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getDiscoveryRun
      summary: Read discovery run status and ordered findings
      tags:
        - Discovery
      responses:
        "200":
          description: Discovery run state.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryRun"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WorkspaceId"
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SemanticAssetId"
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AssetRevisionId"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RunId"
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GovernanceProposalId"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        $ref: "#/components/schemas/Cursor"
  headers:
    TraceId:
      description: W3C-compatible trace identifier for support and correlation.
      required: true
      schema:
        $ref: "#/components/schemas/TraceId"
  responses:
    Error:
      description: The request failed.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
        Retry-After:
          description: Suggested retry delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: The request is invalid.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The workspace-scoped resource was not found.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current registry state.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The acting principal lacks the required capability.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: The request is well-formed but violates a governance gate.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ApiVersion:
      type: string
      description: Major version used in public API paths and payloads.
      pattern: "^v[1-9][0-9]*$"
      example: v1
    SchemaVersion:
      type: string
      description: Semantic version of the public contract bundle.
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
      example: 0.1.0
    ResourceId:
      type: string
      format: typeid
      description: Stable TypeID containing a registered lowercase resource prefix and UUIDv7 value.
      pattern: "^[a-z](?:[a-z_]{0,61}[a-z])?_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: ast_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.ID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    Workspace:
      type: object
      required:
        - id
        - slug
        - displayName
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/WorkspaceId"
        slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - slug
        - displayName
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    WorkspaceId:
      type: string
      format: typeid
      pattern: "^wsp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: wsp_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.WorkspaceID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    SemanticAssetId:
      type: string
      format: typeid
      pattern: "^ast_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: ast_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.AssetID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    AssetRevisionId:
      type: string
      format: typeid
      pattern: "^rev_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: rev_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.RevisionID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    SemanticRelationId:
      type: string
      format: typeid
      pattern: "^rel_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: rel_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.RelationID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    OntologyRevisionId:
      type: string
      format: typeid
      pattern: "^ont_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: ont_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.OntologyID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    EvidenceArtifactId:
      type: string
      format: typeid
      pattern: "^evd_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: evd_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.EvidenceID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    RunId:
      type: string
      format: typeid
      pattern: "^run_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: run_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.RunID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    EventId:
      type: string
      format: typeid
      pattern: "^evt_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: evt_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.EventID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    SourceConnectionId:
      type: string
      format: typeid
      pattern: "^src_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      x-go-type: identity.SourceConnectionID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    SourceRevisionId:
      type: string
      format: typeid
      pattern: "^srv_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      x-go-type: identity.SourceRevisionID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    PhysicalDatasetId:
      type: string
      format: typeid
      pattern: "^pds_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      x-go-type: identity.PhysicalDatasetID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    PhysicalDatasetRevisionId:
      type: string
      format: typeid
      pattern: "^pdr_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      x-go-type: identity.PhysicalDatasetRevisionID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    PhysicalFieldId:
      type: string
      format: typeid
      pattern: "^pfd_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      x-go-type: identity.PhysicalFieldID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    PhysicalFieldRevisionId:
      type: string
      format: typeid
      pattern: "^pfr_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      x-go-type: identity.PhysicalFieldRevisionID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    CodeArtifactId:
      type: string
      format: typeid
      pattern: "^cod_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      x-go-type: identity.CodeArtifactID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    LineageEdgeId:
      type: string
      format: typeid
      pattern: "^lin_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      x-go-type: identity.LineageEdgeID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    SemanticAddress:
      type: string
      description: Workspace-scoped human-readable namespace and stable key.
      pattern: '^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$'
      example: commerce.net_revenue
    SemanticAssetType:
      type: string
      enum:
        - concept
        - entity
        - semantic_model
        - dimension
        - measure
        - metric
        - segment
    RelationPredicate:
      type: string
      enum:
        - measures
        - describes
        - depends_on
        - derived_from
        - filters_by
        - synonym_of
        - contains
        - broader_than
        - narrower_than
        - equivalent_to
        - disjoint_with
    RelationAssertionState:
      type: string
      enum:
        - asserted
        - inferred
        - candidate
        - deprecated
    RelationPlane:
      type: string
      enum:
        - taxonomy
        - semantic
        - dependency
    AssetLifecycleState:
      type: string
      enum:
        - draft
        - active
        - deprecated
        - archived
    Timestamp:
      type: string
      format: date-time
      pattern: "Z$"
      description: RFC 3339 timestamp normalized to UTC at public boundaries.
      example: "2026-08-08T08:00:00Z"
    TraceId:
      type: string
      description: Lowercase 16-byte W3C trace identifier.
      pattern: "^[0-9a-f]{32}$"
      example: 4bf92f3577b34da6a3ce929d0e0e4736
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque pagination cursor that clients must not interpret.
    PageInfo:
      type: object
      additionalProperties: false
      required:
        - limit
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
        nextCursor:
          $ref: "#/components/schemas/Cursor"
    ErrorCode:
      type: string
      description: Stable machine-readable error identifier.
      pattern: "^[A-Z][A-Z0-9_]{2,63}$"
      example: DEPENDENCY_UNAVAILABLE
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - traceId
        - details
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
          maxLength: 1024
        traceId:
          $ref: "#/components/schemas/TraceId"
        details:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
    EventType:
      type: string
      description: Namespaced event type using lowercase dot-separated segments.
      pattern: "^[a-z][a-z0-9]*(?:\\.[a-z][a-z0-9]*)+$"
      example: system.readiness.changed
    EventEnvelope:
      type: object
      additionalProperties: false
      required:
        - specVersion
        - id
        - type
        - source
        - time
        - traceId
        - data
      properties:
        specVersion:
          type: string
          enum:
            - semlia.events/v1
        id:
          $ref: "#/components/schemas/EventId"
        type:
          $ref: "#/components/schemas/EventType"
        source:
          type: string
          format: uri
          example: urn:semlia:control-plane
        subject:
          $ref: "#/components/schemas/ResourceId"
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        time:
          $ref: "#/components/schemas/Timestamp"
        traceId:
          $ref: "#/components/schemas/TraceId"
        data:
          type: object
          additionalProperties: true
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - traceId
      properties:
        status:
          type: string
          enum:
            - live
            - ready
        traceId:
          $ref: "#/components/schemas/TraceId"
    SystemInfo:
      type: object
      additionalProperties: false
      required:
        - service
        - apiVersion
        - schemaVersion
        - buildVersion
        - traceId
      properties:
        service:
          type: string
          enum:
            - semlia
        apiVersion:
          $ref: "#/components/schemas/ApiVersion"
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        buildVersion:
          type: string
          minLength: 1
          maxLength: 128
        traceId:
          $ref: "#/components/schemas/TraceId"
    EvidenceArtifact:
      type: object
      additionalProperties: false
      required:
        - id
        - evidenceType
        - locator
        - contentDigest
        - metadata
        - role
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/EvidenceArtifactId"
        evidenceType:
          type: string
          enum:
            - declared
            - constrained
            - derived
            - observed
            - inferred
        sourceRevisionId:
          $ref: "#/components/schemas/SourceRevisionId"
        locator:
          type: string
          minLength: 1
          maxLength: 2048
        contentDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        metadata:
          type: object
          additionalProperties: true
        role:
          type: string
          enum:
            - supports
            - constrains
            - observes
            - conflicts
        fieldPath:
          type: string
        note:
          type: string
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    AssetRevision:
      type: object
      additionalProperties: false
      required:
        - id
        - assetId
        - sequence
        - schemaVersion
        - contentDigest
        - content
        - createdBy
        - createdAt
        - evidence
      properties:
        id:
          $ref: "#/components/schemas/AssetRevisionId"
        assetId:
          $ref: "#/components/schemas/SemanticAssetId"
        sequence:
          type: integer
          format: int64
          minimum: 1
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        contentDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        content:
          type: object
          additionalProperties: true
        createdBy:
          type: string
          minLength: 1
          maxLength: 256
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceArtifact"
    CatalogAssetSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - address
        - assetType
        - lifecycleState
        - title
        - summary
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/SemanticAssetId"
        address:
          $ref: "#/components/schemas/SemanticAddress"
        assetType:
          $ref: "#/components/schemas/SemanticAssetType"
        lifecycleState:
          $ref: "#/components/schemas/AssetLifecycleState"
        currentRevisionId:
          $ref: "#/components/schemas/AssetRevisionId"
        title:
          type: string
          maxLength: 256
        summary:
          type: string
          maxLength: 2048
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    CatalogAssetDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - address
        - assetType
        - lifecycleState
        - title
        - summary
        - updatedAt
        - createdAt
        - relationCount
      properties:
        id:
          $ref: "#/components/schemas/SemanticAssetId"
        address:
          $ref: "#/components/schemas/SemanticAddress"
        assetType:
          $ref: "#/components/schemas/SemanticAssetType"
        lifecycleState:
          $ref: "#/components/schemas/AssetLifecycleState"
        currentRevisionId:
          $ref: "#/components/schemas/AssetRevisionId"
        title:
          type: string
          maxLength: 256
        summary:
          type: string
          maxLength: 2048
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        currentRevision:
          $ref: "#/components/schemas/AssetRevision"
        relationCount:
          type: integer
          minimum: 0
    CatalogPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogAssetSummary"
        page:
          $ref: "#/components/schemas/PageInfo"
    AssetRevisionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssetRevision"
        page:
          $ref: "#/components/schemas/PageInfo"
    AssetRelation:
      type: object
      additionalProperties: false
      required:
        - id
        - depth
        - direction
        - predicate
        - plane
        - assertionState
        - subjectAssetId
        - objectAssetId
        - counterpart
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/SemanticRelationId"
        depth:
          type: integer
          minimum: 1
          maximum: 3
        direction:
          type: string
          enum:
            - incoming
            - outgoing
        predicate:
          $ref: "#/components/schemas/RelationPredicate"
        plane:
          $ref: "#/components/schemas/RelationPlane"
        assertionState:
          $ref: "#/components/schemas/RelationAssertionState"
        subjectAssetId:
          $ref: "#/components/schemas/SemanticAssetId"
        objectAssetId:
          $ref: "#/components/schemas/SemanticAssetId"
        counterpart:
          $ref: "#/components/schemas/CatalogAssetSummary"
        evidenceArtifactId:
          $ref: "#/components/schemas/EvidenceArtifactId"
        sourceRevisionId:
          $ref: "#/components/schemas/SourceRevisionId"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    AssetRelationPage:
      type: object
      additionalProperties: false
      required:
        - items
        - maxDepth
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssetRelation"
        maxDepth:
          type: integer
          minimum: 1
          maximum: 3
    DiscoveryFinding:
      type: object
      additionalProperties: false
      required:
        - sequence
        - code
        - severity
        - details
      properties:
        sequence:
          type: integer
          minimum: 1
        code:
          $ref: "#/components/schemas/ErrorCode"
        severity:
          type: string
          enum:
            - info
            - warning
            - error
        locator:
          type: string
        details:
          type: object
          additionalProperties: true
    DiscoveryRun:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceConnectionId
        - adapterVersion
        - status
        - stats
        - findings
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/RunId"
        sourceConnectionId:
          $ref: "#/components/schemas/SourceConnectionId"
        sourceRevisionId:
          $ref: "#/components/schemas/SourceRevisionId"
        adapterVersion:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - cancelled
        errorCode:
          $ref: "#/components/schemas/ErrorCode"
        stats:
          type: object
          additionalProperties: true
        findings:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryFinding"
        startedAt:
          $ref: "#/components/schemas/Timestamp"
        completedAt:
          $ref: "#/components/schemas/Timestamp"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    CreateCatalogAssetRequest:
      type: object
      additionalProperties: false
      required:
        - address
        - assetType
        - schemaVersion
        - content
        - createdBy
      properties:
        address:
          $ref: "#/components/schemas/SemanticAddress"
        assetType:
          $ref: "#/components/schemas/SemanticAssetType"
        lifecycleState:
          $ref: "#/components/schemas/AssetLifecycleState"
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        content:
          type: object
          additionalProperties: true
        createdBy:
          type: string
          minLength: 1
          maxLength: 256
        evidenceIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            $ref: "#/components/schemas/EvidenceArtifactId"
    CreateAssetRevisionRequest:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - content
        - createdBy
      properties:
        schemaVersion:
          $ref: "#/components/schemas/SchemaVersion"
        content:
          type: object
          additionalProperties: true
        createdBy:
          type: string
          minLength: 1
          maxLength: 256
        evidenceIds:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            $ref: "#/components/schemas/EvidenceArtifactId"
    GovernanceProposalId:
      type: string
      format: typeid
      pattern: "^prp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: prp_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.ProposalID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    GovernanceAgentRunId:
      type: string
      format: typeid
      pattern: "^agr_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: agr_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.AgentRunID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    GovernanceChangeSetItemId:
      type: string
      format: typeid
      pattern: "^chg_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: chg_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.ProposalChangeID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    GovernanceTargetObjectType:
      type: string
      description: Objects a governed proposal can target.
      enum:
        - semantic_asset
        - physical_binding
        - model_grain
        - entity_key
        - join_contract
    GovernanceTargetObjectId:
      type: string
      format: typeid
      description: Target TypeID; the prefix must match targetObjectType.
      pattern: "^(ast|phb|mgn|eky|jct)_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: ast_01arz3ndektsv4rrffq69g5fav
    GovernanceProposalState:
      type: string
      description: SSOT §7.5 workflow state of a proposal.
      enum:
        - draft
        - proposed
        - validating
        - in_review
        - released
        - rejected
    GovernanceChangeOp:
      type: string
      enum:
        - add
        - update
        - remove
    GovernanceChangeDigest:
      type: string
      description: Recomputable sha256 content digest of the paired value.
      pattern: "^sha256:[0-9a-f]{64}$"
    GovernanceChangeSetItem:
      type: object
      additionalProperties: false
      required:
        - fieldPath
        - op
      properties:
        fieldPath:
          type: string
          minLength: 1
          maxLength: 512
        op:
          $ref: "#/components/schemas/GovernanceChangeOp"
        beforeDigest:
          $ref: "#/components/schemas/GovernanceChangeDigest"
        afterDigest:
          $ref: "#/components/schemas/GovernanceChangeDigest"
        beforeValue:
          description: JSON value at fieldPath before the change; required for update and remove.
          x-go-type: json.RawMessage
        afterValue:
          description: JSON value at fieldPath after the change; required for add and update.
          x-go-type: json.RawMessage
    GovernanceChangeSetItemRecord:
      type: object
      additionalProperties: false
      required:
        - id
        - fieldPath
        - op
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/GovernanceChangeSetItemId"
        fieldPath:
          type: string
          minLength: 1
          maxLength: 512
        op:
          $ref: "#/components/schemas/GovernanceChangeOp"
        beforeDigest:
          $ref: "#/components/schemas/GovernanceChangeDigest"
        afterDigest:
          $ref: "#/components/schemas/GovernanceChangeDigest"
        beforeValue:
          x-go-type: json.RawMessage
        afterValue:
          x-go-type: json.RawMessage
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    GovernanceProposalAgentAttribution:
      type: object
      description: >-
        SSOT §8.6 attribution of an AI-proposed payload to a persisted agent
        run in the same workspace. The run must already exist and its model,
        config revision and input hash must match the persisted record.
      additionalProperties: false
      required:
        - agentRunId
        - model
        - configRevision
        - inputHash
      properties:
        agentRunId:
          $ref: "#/components/schemas/GovernanceAgentRunId"
        model:
          type: string
          minLength: 1
          maxLength: 128
        configRevision:
          type: string
          minLength: 1
          maxLength: 128
        inputHash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: sha256 digest of the canonical agent input; never raw prompts.
    CreateGovernanceProposalRequest:
      type: object
      additionalProperties: false
      required:
        - targetObjectType
        - targetObjectId
        - title
        - changeSet
      properties:
        targetObjectType:
          $ref: "#/components/schemas/GovernanceTargetObjectType"
        targetObjectId:
          $ref: "#/components/schemas/GovernanceTargetObjectId"
        baseRevisionId:
          description: Required for semantic_asset targets; the released baseline the diff applies to.
          allOf:
