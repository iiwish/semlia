      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/OperationsRuntimeRunKind"}}
        - {name: state, in: query, schema: {$ref: "#/components/schemas/OperationsRuntimeRunState"}}
        - {name: sourceType, in: query, schema: {type: string, maxLength: 64}}
        - {name: sourceId, in: query, schema: {type: string, maxLength: 128}}
        - {name: traceId, in: query, schema: {$ref: "#/components/schemas/TraceId"}}
      responses:
        "200":
          description: Cursor-paged runtime runs.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsRuntimeRunPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/workspaces/{workspaceId}/operations/runs/{runId}:
    get:
      operationId: getOperationsRuntimeRun
      summary: Inspect a normalized runtime run and its bounded event stream
      description: Requires runtime.read.
      tags: [Operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Runtime detail.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsRuntimeRunDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/workspaces/{workspaceId}/operations/runs/{runId}:retry:
    post:
      operationId: retryOperationsRuntimeRun
      summary: Retry a runtime run when the owning domain supports safe retry
      description: Requires runtime.manage. Beta 0.2.0 rejects kinds without an owning retry contract.
      tags: [Operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "202": {description: Retry accepted by the owning domain.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/workspaces/{workspaceId}/operations/runs/{runId}:cancel:
    post:
      operationId: cancelOperationsRuntimeRun
      summary: Cancel a runtime run when the owning domain supports safe cancellation
      description: Requires runtime.manage. Beta 0.2.0 rejects kinds without an owning cancellation contract.
      tags: [Operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "202": {description: Cancellation accepted by the owning domain.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/workspaces/{workspaceId}/runtime-policy:
    get:
      operationId: getRuntimePolicy
      summary: Read workspace future-run defaults and safe deployment status
      description: Requires runtime.read. Deployment-owned settings are status-only.
      tags: [Operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Runtime policy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsRuntimePolicy"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateRuntimePolicy
      summary: Update bounded future-run defaults
      description: Requires runtime.manage. The request cannot change deployment-owned trust configuration.
      tags: [Operations]
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateOperationsRuntimeSettingsRequest"}
      responses:
        "200":
          description: Updated runtime policy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsRuntimePolicy"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/workspaces/{workspaceId}/production-operations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listProductionOperations
      summary: Recover authorized operations without browser state
      tags:
        - Governance
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: sourceId
          in: query
          schema:
            $ref: "#/components/schemas/ResourceId"
        - name: candidateId
          in: query
          schema:
            $ref: "#/components/schemas/ResourceId"
        - name: createdBy
          in: query
          schema:
            $ref: "#/components/schemas/ResourceId"
      responses:
        "200":
          description: Scope-filtered summaries, not all-workspace counts or full target content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOperationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProductionOperation
      summary: Atomically reserve identities and create linked draft proposals
      tags:
        - Governance
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductionRequest"
      responses:
        "200":
          description: Committed result, including replay or a no_change operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionCommandResult"
        "201":
          description: Newly committed operation; Location points to the operation GET
          headers:
            Location:
              schema:
                type: string
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OperationId"
    get:
      operationId: getProductionOperation
      summary: Read server-authoritative input, targets, links and derived progress
      tags:
        - Governance
      parameters:
        - name: version
          in: query
          description: Exact immutable version; omitted selects current, never rewrites history
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Authorized operation version with exact governance references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: replaceProductionDraft
      summary: Replace the entire draft with a CAS-protected new immutable version
      tags:
        - Governance
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceProductionRequest"
      responses:
        "200":
          description: Committed result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/submit:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: submitProductionOperation
      summary: Freeze all members, submit existing proposals and enqueue initial validation atomically
      tags:
        - Governance
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProductionRequest"
      responses:
        "200":
          description: Replayed committed command or completed result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionCommandResult"
        "202":
          description: Durable validation job references committed; poll the operation
          headers:
            Location:
              schema:
                type: string
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
