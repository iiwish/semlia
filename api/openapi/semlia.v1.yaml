          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"
        status:
          $ref: "#/components/schemas/GovernanceValidationStatus"
        startedAt:
          $ref: "#/components/schemas/Timestamp"
        finishedAt:
          $ref: "#/components/schemas/Timestamp"
        results:
          type: array
