          },
          "predicate": {
            "$ref": "#/components/schemas/KnowledgeExpression"
          },
          "parameters": {
            "type": "array",
            "maxItems": 256,
            "items": {
              "$ref": "#/components/schemas/KnowledgeParameter"
            }
          },
          "stage": {
