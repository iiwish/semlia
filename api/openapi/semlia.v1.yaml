          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/production-releases/{releaseId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ReleaseId"
    get:
      operationId: getProductionRelease
