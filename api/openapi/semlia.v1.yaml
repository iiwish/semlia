      parameters:
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/ArtifactKind"}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/ArtifactStatus"}}
        - {name: sourceId, in: query, schema: {$ref: "#/components/schemas/SourceConnectionId"}}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A cursor-paged, authorized artifact metadata page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ArtifactPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: stageIngestionArtifact
      summary: Safely validate and stage one bounded upload
      tags: [Ingestion]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRF"
        - name: X-Artifact-Kind
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/PublicArtifactKind"
        - name: X-File-Name
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 255}
        - name: X-Source-Id
          in: header
          description: Existing source receiving this staged version. Omit when creating a source.
          schema: {$ref: "#/components/schemas/SourceConnectionId"}
        - name: X-Expected-Source-Version
          in: header
          description: Required optimistic source version when X-Source-Id is present.
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary, maxLength: 52428800}
          text/markdown:
            schema: {type: string, format: binary, maxLength: 10485760}
          application/json:
            schema: {type: string, format: binary, maxLength: 52428800}
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: {type: string, format: binary, maxLength: 52428800}
      responses:
        "201":
          description: Durable staged artifact metadata; raw bytes are never returned.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IngestionArtifact"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413":
          description: The upload or parsed representation exceeds a fixed ingestion limit.
          content:
