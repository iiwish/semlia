    get:
      operationId: listGovernanceValidationRuns
      summary: List the deterministic validation runs of one proposal
      description: >-
        Every executed validator run with its stable validator id and version,
        terminal status and recorded results, including the input digest each
        result was computed over (SSOT NFR-003). Failures are recorded as
        failed runs; they never reject the proposal automatically.
      tags:
