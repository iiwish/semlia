          pattern: "^sha256:[0-9a-f]{64}$"
        details:
          description: Bounded structured context of the finding.
          x-go-type: json.RawMessage
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    GovernanceValidationRun:
