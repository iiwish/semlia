          maxLength: 256
        submittedAt:
          $ref: "#/components/schemas/Timestamp"
        decidedAt:
          $ref: "#/components/schemas/Timestamp"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    GovernanceProposalDetail:
      type: object
