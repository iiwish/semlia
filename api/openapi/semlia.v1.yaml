        sequence:
          type: integer
          format: int64
          minimum: 1
        state:
          $ref: "#/components/schemas/GovernanceReleaseState"
        manifestDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        rolledBackToReleaseId:
          $ref: "#/components/schemas/GovernanceReleaseId"
        originProposalId:
          $ref: "#/components/schemas/GovernanceProposalId"
        publishedBy:
          type: string
          minLength: 1
          maxLength: 256
        publishedAt:
