    SemanticAssetType:
      type: string
      enum:
        - concept
        - entity
        - semantic_model
        - dimension
        - measure
        - metric
        - segment
    RelationPredicate:
      type: string
      enum:
        - measures
        - describes
        - depends_on
        - derived_from
        - filters_by
        - synonym_of
        - contains
        - broader_than
        - narrower_than
        - equivalent_to
        - disjoint_with
    RelationAssertionState:
      type: string
      enum:
        - asserted
        - inferred
        - candidate
        - deprecated
    RelationPlane:
      type: string
      enum:
        - taxonomy
        - semantic
        - dependency
    AssetLifecycleState:
      type: string
      enum:
        - draft
        - active
        - deprecated
        - archived
    Timestamp:
      type: string
      format: date-time
      pattern: "Z$"
      description: RFC 3339 timestamp normalized to UTC at public boundaries.
      example: "2026-08-08T08:00:00Z"
    TraceId:
      type: string
      description: Lowercase 16-byte W3C trace identifier.
      pattern: "^[0-9a-f]{32}$"
      example: 4bf92f3577b34da6a3ce929d0e0e4736
    Cursor:
