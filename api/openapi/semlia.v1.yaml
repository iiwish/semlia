          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/business-rule-confirmations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OperationId'
    post:
      operationId: recordProductionBusinessRule
      summary: Confirm or revoke business definitions as an authorized human contributor
      tags: [Governance]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionBusinessRuleRequest' }
      responses:
        '201':
          description: Immutable event committed; existing validation must be rerun
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionBusinessRuleEvent' }
        '200':
          description: Authorized replay of the original event, not a fresh confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionBusinessRuleEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      operationId: listProductionBusinessRules
      summary: Read latest confirmation events and current validity for an exact version
      tags: [Governance]
      parameters:
        - name: version
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Version' }
      responses:
        '200':
          description: Latest event per target, ordered by target key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 64
                    items: { $ref: '#/components/schemas/ProductionBusinessRuleWitness' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/generation:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OperationId'
    post:
      operationId: generateProductionSuggestions
      summary: Queue an authorized model run against a pinned draft
      tags: [Governance]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateProductionRequest' }
      responses:
        '200':
          description: Authorized replay without another model call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationResult' }
        '202':
          description: Durable run queued; Location is its recovery URL
          headers:
            Location:
              schema: { type: string, maxLength: 2048 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/generation/{runId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OperationId'
      - name: runId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/GovernanceAgentRunId' }
    get:
      operationId: getProductionGeneration
      summary: Recover exact generation provenance without resending
      tags: [Governance]
      responses:
        '200':
          description: Stored status and schema-gated output; unknown vendor cost is null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/publish:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: publishProductionOperation
      summary: Publish all proposals and complete manifest in one transaction
