    GovernanceReviewDecision:
      type: string
      description: Human review command of the expert and batch confirmation commands.
      enum:
        - approve
        - reject
    GovernanceReviewRecordedDecision:
      type: string
      description: Outcome recorded on an immutable review fact (SSOT §8.4).
      enum:
        - approved
        - rejected
        - changes_requested
    GovernanceReviewChannel:
      type: string
      description: Review channel that produced the fact (SSOT §8.4).
      enum:
        - automatic
        - batch
        - expert
    GovernanceReviewCommandRequest:
      type: object
      additionalProperties: false
      required:
        - decision
        - reason
      properties:
        decision:
          $ref: "#/components/schemas/GovernanceReviewDecision"
        reason:
          type: string
          minLength: 1
          maxLength: 4096
          description: Human-readable justification recorded verbatim on the review facts.
    GovernanceReview:
      type: object
      additionalProperties: false
      description: One immutable §8.4 review fact; never updated or deleted.
      required:
        - id
        - proposalId
        - reviewerPrincipalId
        - channel
        - decision
        - note
        - createdAt
      properties:
        id:
          type: string
          format: typeid
          pattern: "^rvw_[0-7][0-9a-hjkmnp-tv-z]{25}$"
          example: rvw_01arz3ndektsv4rrffq69g5fav
          x-go-type: identity.ReviewID
          x-go-type-import:
            path: github.com/iiwish/semlia/pkg/identity
            name: identity
        proposalId:
          $ref: "#/components/schemas/GovernanceProposalId"
        reviewerPrincipalId:
          $ref: "#/components/schemas/GovernanceReviewerPrincipalId"
        channel:
          $ref: "#/components/schemas/GovernanceReviewChannel"
        decision:
          $ref: "#/components/schemas/GovernanceReviewRecordedDecision"
        note:
          type: string
          maxLength: 4096
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    GovernanceDiffCategory:
      type: string
      description: Closed §8.3 structured-diff category; the grouping-rule component.
      enum:
        - computation
        - access
        - contract
        - relations
        - definition
    GovernanceReviewGroupingRule:
      type: object
      additionalProperties: false
      description: >-
        The persisted §8.4 grouping criteria: every member of the batch shares
        the target object type, the dominant structured-diff category and the
        matched policy rule of its creation-time decision.
      required:
        - targetObjectType
        - diffCategory
        - matchedRuleId
      properties:
        targetObjectType:
          $ref: "#/components/schemas/GovernanceTargetObjectType"
        diffCategory:
          $ref: "#/components/schemas/GovernanceDiffCategory"
        matchedRuleId:
          type: string
          minLength: 1
          maxLength: 128
    GovernanceReviewAddedReason:
      type: object
      additionalProperties: false
      description: >-
        The frozen creation-time decision snapshot that made the proposal
        batch-eligible; the per-member half of the batch audit record.
      required:
        - matchedRuleId
        - riskLevel
        - reasonCode
        - ruleVersion
        - inputsDigest
      properties:
        matchedRuleId:
          type: string
          minLength: 1
          maxLength: 128
        riskLevel:
          $ref: "#/components/schemas/GovernanceRiskLevel"
        reasonCode:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        ruleVersion:
          type: string
          pattern: "^[0-9]+\\.[0-9]+$"
        inputsDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
    GovernanceReviewBatchStatus:
      type: string
      description: One-way batch state; decided batches are frozen.
      enum:
        - open
        - confirmed
        - rejected
    GovernanceReviewBatchMember:
      type: object
      additionalProperties: false
      description: One frozen member snapshot; the outcome columns fill at confirm time.
      required:
        - proposalId
        - addedReason
        - sample
        - splitOut
        - createdAt
      properties:
        proposalId:
          $ref: "#/components/schemas/GovernanceProposalId"
        addedReason:
          $ref: "#/components/schemas/GovernanceReviewAddedReason"
        sample:
          type: boolean
          description: Part of the deterministic representative sample of the confirmed membership.
        splitOut:
          type: boolean
          description: >-
            Auto-split at confirm time (escalation, lost decision or left
            in_review); a split member never received the batch decision.
        splitReason:
          type: string
          maxLength: 512
          description: Stable machine-readable reason the member was excluded.
        decision:
          $ref: "#/components/schemas/GovernanceReviewRecordedDecision"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    GovernanceReviewBatch:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - groupingRule
        - policyVersion
        - memberCount
        - createdBy
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/GovernanceReviewBatchId"
        status:
          $ref: "#/components/schemas/GovernanceReviewBatchStatus"
        groupingRule:
          $ref: "#/components/schemas/GovernanceReviewGroupingRule"
        policyVersion:
          type: string
          description: Policy (rule table) version current at assembly time.
          pattern: "^[0-9]+\\.[0-9]+$"
        memberCount:
          type: integer
          minimum: 1
          maximum: 1000
        createdBy:
          type: string
          minLength: 1
          maxLength: 256
        decidedBy:
          type: string
          minLength: 1
          maxLength: 256
          description: Reviewer of record, set together with decidedAt at confirm time.
        decidedAt:
          $ref: "#/components/schemas/Timestamp"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    GovernanceReviewBatchDetail:
      type: object
      additionalProperties: false
      description: >-
        The full §8.4 audit record of one batch. maxRiskProposalId is the
        member with the highest recorded creation-time risk rank, ties resolved
        to the earliest member by assembly sequence.
      required:
        - id
        - status
        - groupingRule
        - policyVersion
        - memberCount
        - createdBy
        - createdAt
        - members
        - samples
        - exclusions
      properties:
        id:
          $ref: "#/components/schemas/GovernanceReviewBatchId"
        status:
          $ref: "#/components/schemas/GovernanceReviewBatchStatus"
        groupingRule:
          $ref: "#/components/schemas/GovernanceReviewGroupingRule"
        policyVersion:
          type: string
          pattern: "^[0-9]+\\.[0-9]+$"
        memberCount:
          type: integer
          minimum: 1
          maximum: 1000
        createdBy:
          type: string
          minLength: 1
          maxLength: 256
        decidedBy:
          type: string
          minLength: 1
          maxLength: 256
        decidedAt:
          $ref: "#/components/schemas/Timestamp"
        maxRiskProposalId:
          $ref: "#/components/schemas/GovernanceProposalId"
        members:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceReviewBatchMember"
        samples:
          type: array
          description: The representative sample members, in assembly order.
          items:
            $ref: "#/components/schemas/GovernanceReviewBatchMember"
        exclusions:
          type: array
          description: Members split out at confirm time, each with a reason.
          items:
            $ref: "#/components/schemas/GovernanceReviewBatchMember"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    GovernanceReviewBatchPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceReviewBatch"
        page:
          $ref: "#/components/schemas/PageInfo"
