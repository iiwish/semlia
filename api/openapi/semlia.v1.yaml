openapi: 3.0.3
info:
  title: Semlia Control API
  version: 0.4.0
  description: Versioned control-plane contract shared by Semlia services and clients.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
x-semlia-contract-version: 4
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
    description: Process and dependency status.
  - name: Catalog
    description: Workspace-scoped semantic assets, immutable revisions and provenance.
  - name: Governance
    description: Workspace-scoped governed proposals over semantic assets and governance objects.
  - name: Discovery
    description: Source discovery run state and findings.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the process is alive
      tags:
        - System
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required dependencies are ready
      tags:
        - System
      responses:
        "200":
          description: Required dependencies are ready.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      summary: Read public build and contract information
      tags:
        - System
      responses:
        "200":
          description: Public service information.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List available workspaces
      tags:
        - Catalog
      responses:
        "200":
          description: Workspaces ordered for catalog selection, with populated workspaces first.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createWorkspace
      summary: Create a workspace
      tags:
        - Catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: The created workspace.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/catalog/assets:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listCatalogAssets
      summary: Search and paginate semantic assets
      tags:
        - Catalog
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: search
          in: query
          description: Lexical query matched against semantic address and current revision content.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: assetType
          in: query
          schema:
            $ref: "#/components/schemas/SemanticAssetType"
        - name: lifecycleState
          in: query
          schema:
            $ref: "#/components/schemas/AssetLifecycleState"
      responses:
        "200":
          description: A deterministic catalog page.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCatalogAsset
      summary: Create an asset and its initial immutable revision
      tags:
        - Catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogAssetRequest"
      responses:
        "201":
          description: The created asset detail.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogAssetDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/catalog/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: getCatalogAsset
      summary: Read an asset and its current revision
      tags:
        - Catalog
      responses:
        "200":
          description: Current asset detail and provenance.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogAssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/catalog/assets/{assetId}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: listAssetRevisions
      summary: List immutable asset revisions newest first
      tags:
        - Catalog
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Immutable revision history.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetRevisionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createAssetRevision
      summary: Append and select a new immutable asset revision
      tags:
        - Catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRevisionRequest"
      responses:
        "201":
          description: The appended immutable revision.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/catalog/assets/{assetId}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssetId"
      - $ref: "#/components/parameters/RevisionId"
    get:
      operationId: getAssetRevision
      summary: Read one immutable asset revision
      tags:
        - Catalog
      responses:
        "200":
          description: Immutable revision content and evidence.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetRevision"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/catalog/assets/{assetId}/relations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssetId"
    get:
      operationId: listAssetRelations
      summary: Read bounded incoming and outgoing typed relations
      tags:
        - Catalog
      parameters:
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - incoming
              - outgoing
              - both
            default: both
        - name: plane
          in: query
          schema:
            $ref: "#/components/schemas/RelationPlane"
        - name: depth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 1
      responses:
        "200":
          description: A bounded relation projection.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetRelationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/proposals:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listGovernanceProposals
      summary: List workspace proposals newest first
      tags:
        - Governance
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A deterministic governance proposals page.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProposalPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createGovernanceProposal
      summary: Open a governed draft proposal with a structured change-set
      description: >-
        Creates a draft proposal against a semantic asset or one of the four
        governance object types. Agent-attributed payloads are validated
        against the versioned semlia.proposal-input/v1 schema before any
        domain write; change-sets without a substantive diff are rejected.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGovernanceProposalRequest"
      responses:
        "201":
          description: The created draft proposal with its change-set.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProposalDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/proposals/{proposalId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProposalId"
    get:
      operationId: getGovernanceProposal
      summary: Read one proposal and its change-set
      tags:
        - Governance
      responses:
        "200":
          description: Proposal state, attribution and structured change-set.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProposalDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/proposals/{proposalId}/submit:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProposalId"
    post:
      operationId: submitGovernanceProposal
      summary: Submit a draft proposal for governance
      description: >-
        Walks draft -> proposed, freezing the change-set. Proposals whose
        change-set normalizes to no substantive diff never enter the human
        queue and stay drafts.
      tags:
        - Governance
      responses:
        "200":
          description: The submitted proposal in the proposed state.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceProposalDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/proposals/{proposalId}/validation-runs:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProposalId"
    get:
      operationId: listGovernanceValidationRuns
      summary: List the deterministic validation runs of one proposal
      description: >-
        Every executed validator run with its stable validator id and version,
        terminal status and recorded results, including the input digest each
        result was computed over (SSOT NFR-003). Failures are recorded as
        failed runs; they never reject the proposal automatically.
      tags:
        - Governance
      responses:
        "200":
          description: The validation runs and results of the proposal.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceValidationRunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/proposals/{proposalId}/policy-decision:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProposalId"
    get:
      operationId: getGovernancePolicyDecision
      summary: Read the recomputable policy decision of one proposal
      description: >-
        The latest versioned rule-table decision for the proposal (SSOT §8.2):
        the rule version, the canonical inputs digest, the explainable risk
        level and expert|batch routing, the matched rule with its explanation
        and the input categories that drove it. No decision exists before
        validation completes; no opaque score is exposed (SSOT §8.3).
      tags:
        - Governance
      responses:
        "200":
          description: The latest policy decision of the proposal.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernancePolicyDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/proposals/{proposalId}/reviews:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProposalId"
    post:
      operationId: createGovernanceProposalReview
      summary: Record an expert review decision for one proposal
      description: >-
        The expert channel of the §8.4 three-channel model. Requires the
        proposal.review capability server-side. Approve records an immutable
        review while the proposal stays in_review (approvals gate the later
        release cut); reject records the review and transitions the proposal
        to rejected with decided_at. The proposal author cannot review their
        own proposal (FR-007): the denial names the conflict, the affected
        scope, the policy source and the permitted recovery actions, and is
        audited.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceReviewCommandRequest"
      responses:
        "201":
          description: The recorded immutable review fact.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/review-batches:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listGovernanceReviewBatches
      summary: List the open review batches of the workspace
      description: >-
        The undecided §8.4 batch confirmation queue, newest first with an
        opaque keyset cursor. Requires the proposal.review capability; batch
        assembly is a review-preparation command.
      tags:
        - Governance
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A deterministic page of open review batches.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceReviewBatchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createGovernanceReviewBatches
      summary: Assemble the eligible proposals into review batches
      description: >-
        Clusters every in_review proposal whose latest policy decision routes
        to the batch channel and that is not already an active member of an
        open batch, deterministically by (target object type, dominant diff
        category, matched rule). Each cluster becomes one open batch whose
        grouping rule, policy version, member snapshots with added reasons and
        representative samples persist immediately — the §8.4 audit record is
        the data. High-risk proposals are never eligible.
      tags:
        - Governance
      responses:
        "200":
          description: The created open batches, one per cluster; empty when nothing is eligible.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceReviewBatchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/review-batches/{batchId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ReviewBatchId"
    get:
      operationId: getGovernanceReviewBatch
      summary: Read one review batch with its full audit record
      description: >-
        The batch with its membership, the representative samples, the
        exclusions with reasons and the max-risk member, plus the audit fields
        (grouping rule, policy version, creator, reviewer and decided_at once
        confirmed).
      tags:
        - Governance
      responses:
        "200":
          description: The review batch audit record.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceReviewBatchDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/review-batches/{batchId}/confirm:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ReviewBatchId"
    post:
      operationId: confirmGovernanceReviewBatch
      summary: Confirm one open review batch with a single decision
      description: >-
        Requires the proposal.review capability. Before anything persists,
        every member's CURRENT policy decision is re-checked: members that are
        no longer in_review, lost their decision or escalated (high risk or no
        longer batch-routed) are split out automatically with a reason and
        never mixed into the batch decision. The decision applies to the
        remaining members as immutable reviews (rejection also transitions each
        member to rejected) and freezes the batch audit record: grouping rule,
        final membership, samples, exclusions with reasons, reviewer and policy
        version. A reviewer who authored a member is refused with the
        conflicting members named (FR-007). Double confirmation is refused.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceReviewCommandRequest"
      responses:
        "200":
          description: The decided batch with its final audit record.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceReviewBatchDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/releases:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listGovernanceReleases
      summary: List workspace releases newest first
      description: >-
        The immutable release history of the workspace, newest first with an
        opaque keyset cursor. Requires the asset.read capability.
      tags:
        - Governance
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A deterministic page of workspace releases.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceReleasePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: publishGovernanceRelease
      summary: Publish an approved proposal as an immutable release
      description: >-
        Cuts an immutable release from an in_review proposal. Gates, in order:
        the proposal must be in_review, carry no blocker findings, and hold at
        least one approving review; the publisher needs the human-only
        release.publish capability (agents are refused with
        SEPARATION_OF_DUTY); the publisher cannot be the proposal author and
        cannot be the sole approving reviewer (two-person release control,
        D-006). Inside one transaction the change-set is applied — a new
        semantic-asset revision with a current-revision switch, or a governed
        object version bump — the manifest pins the resulting revision or
        version, the proposal walks to released, and the audit facts plus the
        release.published outbox event commit atomically. Every refusal is
        returned with a stable code and audited.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishGovernanceReleaseRequest"
      responses:
        "201":
          description: The cut release with its manifest.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceReleaseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/releases/{releaseId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ReleaseId"
    get:
      operationId: getGovernanceRelease
      summary: Read one immutable release with its manifest
      description: >-
        The release aggregate: sequence, manifest digest, rollback reference
        and originating proposal when present, plus the manifest entries
        pinning the exact asset revisions and governed-object versions the
        release produced.
      tags:
        - Governance
      responses:
        "200":
          description: The release detail with its manifest.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceReleaseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/releases/{releaseId}/rollback:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ReleaseId"
    post:
      operationId: rollbackGovernanceRelease
      summary: Roll a release back as a new immutable release
      description: >-
        Never mutates the target release (P-003): the rollback cuts a NEW
        release referencing the target whose manifest restores the prior
        state — asset targets switch the current-revision pointer back to the
        prior pinned revision, governed-object targets apply the inverse
        change-set as a new version bump — inside one transaction with audit
        and outbox events. Requires the human-only release.rollback
        capability; a release can be rolled back at most once and only while
        it is the latest release. The command takes no request body.
      tags:
        - Governance
      responses:
        "201":
          description: The new rollback release with its manifest.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceReleaseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/model-providers:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listGovernanceModelProviders
      summary: List workspace model providers with their model settings
      description: >-
        The persisted model-configuration surface. Providers and their model
        settings never expose credential material: only the credential
        environment-variable name and its revision digest are returned.
        Requires the workspace.read capability.
      tags:
        - Governance
      responses:
        "200":
          description: Model providers ordered oldest first, each with its model settings.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceModelProviderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createGovernanceModelProvider
      summary: Add a model provider to the workspace
      description: >-
        Persists one provider entry. The optional write-only credential is
        reduced to its salted sha256 revision digest and the credential
        environment-variable name is persisted; neither the secret nor any
        credential field is stored or echoed (SSOT §12 S-002). Requires the
        workspace.manage capability.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGovernanceModelProviderRequest"
      responses:
        "201":
          description: The created provider detail with its (empty) model settings.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceModelProviderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/model-providers/{providerId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ProviderId"
    get:
      operationId: getGovernanceModelProvider
      summary: Read one model provider with its model settings
      tags:
        - Governance
      responses:
        "200":
          description: The provider detail with its model settings.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceModelProviderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateGovernanceModelProvider
      summary: Update one model provider
      description: >-
        Edits the display name, base URL and enabled flag. Supplying the
        write-only credential rotates the credential revision digest; secrets
        are never persisted or echoed. Requires the workspace.manage
        capability.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGovernanceModelProviderRequest"
      responses:
        "200":
          description: The updated provider detail.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceModelProviderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/model-settings:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listGovernanceModelSettings
      summary: List workspace model settings
      tags:
        - Governance
      responses:
        "200":
          description: Model settings ordered by provider and creation.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceModelSettingPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createGovernanceModelSetting
      summary: Add a model entry to a provider
      description: >-
        Persists one llm or embedding model entry. The first enabled model of
        a (workspace, kind) becomes its default. Requires the workspace.manage
        capability.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGovernanceModelSettingRequest"
      responses:
        "201":
          description: The created model setting.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceModelSetting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/model-settings/{settingId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SettingId"
    get:
      operationId: getGovernanceModelSetting
      summary: Read one model setting
      tags:
        - Governance
      responses:
        "200":
          description: The model setting.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceModelSetting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateGovernanceModelSetting
      summary: Update one model setting
      description: >-
        Edits the model identifier, capability, token limit, embedding
        dimension and enabled flag. The kind is fixed at creation. Disabling
        the default model does not clear its default flag; the default must
        be moved explicitly. Requires the workspace.manage capability.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGovernanceModelSettingRequest"
      responses:
        "200":
          description: The updated model setting.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceModelSetting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/model-settings/{settingId}/set-default:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/SettingId"
    post:
      operationId: setDefaultGovernanceModelSetting
      summary: Move the (workspace, kind) default to one enabled model setting
      description: >-
        The previous default of the same kind is cleared inside one
        transaction, so exactly one default per (workspace, kind) remains.
        Requires the workspace.manage capability.
      tags:
        - Governance
      responses:
        "200":
          description: The model setting now holding the default.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceModelSetting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/governance/agent-runs/generate-proposal:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: generateGovernanceProposal
      summary: Generate a governed proposal through the configured model
      description: >-
        Runs one live LLM generation with full SSOT §8.6 recording: the
        agent run records the model, configuration revision, input hash,
        model step, output digest, cost and duration with a terminal final
        state. The model output passes the semlia.proposal-input/v1 schema
        gate before the agent-attributed proposal is created through the
        governed authoring path — it enters the normal validation and review
        pipeline, never publication. One request is one agent run is at most
        one proposal; there are no implicit retries. Provider failures
        degrade to a recorded failed run and create no proposal. Requires
        the asset.propose capability for the calling principal.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceGenerateProposalRequest"
      responses:
        "201":
          description: The finished agent run and the generated agent-attributed proposal.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceGeneratedProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/discovery-runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getDiscoveryRun
      summary: Read discovery run status and ordered findings
      tags:
        - Discovery
      responses:
        "200":
          description: Discovery run state.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryRun"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WorkspaceId"
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SemanticAssetId"
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AssetRevisionId"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RunId"
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GovernanceProposalId"
    ReviewBatchId:
      name: batchId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GovernanceReviewBatchId"
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GovernanceReleaseId"
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GovernanceModelProviderId"
    SettingId:
      name: settingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/GovernanceModelSettingId"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        $ref: "#/components/schemas/Cursor"
  headers:
    TraceId:
      description: W3C-compatible trace identifier for support and correlation.
      required: true
      schema:
        $ref: "#/components/schemas/TraceId"
  responses:
    Error:
      description: The request failed.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
        Retry-After:
          description: Suggested retry delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: The request is invalid.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The workspace-scoped resource was not found.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current registry state.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The acting principal lacks the required capability.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: The request is well-formed but violates a governance gate.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ApiVersion:
      type: string
      description: Major version used in public API paths and payloads.
      pattern: "^v[1-9][0-9]*$"
      example: v1
    SchemaVersion:
      type: string
      description: Semantic version of the public contract bundle.
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
      example: 0.1.0
    ResourceId:
      type: string
      format: typeid
      description: Stable TypeID containing a registered lowercase resource prefix and UUIDv7 value.
      pattern: "^[a-z](?:[a-z_]{0,61}[a-z])?_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: ast_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.ID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    Workspace:
      type: object
      required:
        - id
        - slug
        - displayName
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/WorkspaceId"
        slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - slug
        - displayName
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    WorkspaceId:
      type: string
      format: typeid
      pattern: "^wsp_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: wsp_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.WorkspaceID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
