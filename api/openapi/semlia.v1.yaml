          "semanticRef",
          "dataRef"
        ],
        "properties": {
          "semanticRef": {
            "$ref": "#/components/schemas/KnowledgeReference"
          },
          "dataRef": {
            "$ref": "#/components/schemas/KnowledgeReference"
          }
        }
      }
    BindingContent:
      type: object
      additionalProperties: false
      required: [asset, dataset]
      properties:
        asset: { $ref: '#/components/schemas/SemanticReference' }
        dataset: { $ref: '#/components/schemas/PhysicalReference' }
        field: { $ref: '#/components/schemas/PhysicalReference' }
        transform: { type: string, minLength: 1, maxLength: 4096 }
    FieldReferences:
      type: array
      minItems: 1
      maxItems: 64
      uniqueItems: true
      items: { $ref: '#/components/schemas/PhysicalReference' }
    GrainContent:
      type: object
      additionalProperties: false
      required: [asset, expression, fields]
      properties:
        asset: { $ref: '#/components/schemas/SemanticReference' }
        expression: { type: string, minLength: 1, maxLength: 4096 }
        fields: { $ref: '#/components/schemas/FieldReferences' }
    EntityKeyContent:
      type: object
      additionalProperties: false
      required: [asset, fields, uniqueness]
      properties:
        asset: { $ref: '#/components/schemas/SemanticReference' }
