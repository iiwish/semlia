      additionalProperties: false
      required: [selector, operator, value]
      properties:
        selector:
          $ref: "#/components/schemas/SemanticSelector"
        operator:
          type: string
          enum: [eq, neq, gt, gte, lt, lte, in, not_in, contains]
        value: {}
    SemanticTimeRange:
      type: object
      additionalProperties: false
      required: [selector, from, to]
      properties:
        selector:
          $ref: "#/components/schemas/SemanticSelector"
        from:
          $ref: "#/components/schemas/Timestamp"
        to:
          $ref: "#/components/schemas/Timestamp"
        granularity:
          type: string
          enum: [day, week, month, quarter, year]
    SemanticOrder:
      type: object
      additionalProperties: false
      required: [selector, direction]
      properties:
        selector:
          $ref: "#/components/schemas/SemanticSelector"
        direction:
          type: string
          enum: [asc, desc]
    ResolutionContext:
      type: object
      description: current has no reference; explicit requires releaseId; binding requires bindingId.
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [current, explicit, binding]
        releaseId:
          $ref: "#/components/schemas/GovernanceReleaseId"
        bindingId:
          $ref: "#/components/schemas/ConsumerBindingId"
    SemanticQuery:
      type: object
      additionalProperties: false
      required: [schemaVersion, intent, context]
      properties:
        modelId: { $ref: "#/components/schemas/SemanticAssetId" }
        schemaVersion:
          type: string
          enum: [1.0.0]
        intent:
          type: string
          enum: [describe, aggregate, breakdown, compare]
        measures:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/SemanticSelector"
        dimensions:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/SemanticSelector"
        filters:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/SemanticFilter"
        timeRange:
          $ref: "#/components/schemas/SemanticTimeRange"
        order:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/SemanticOrder"
        limit:
          type: integer
          minimum: 0
          maximum: 10000
        context:
          $ref: "#/components/schemas/ResolutionContext"
    ResolveSemanticQueryRequest:
      type: object
      additionalProperties: false
      required: [query, channel, idempotencyKey]
      properties:
        query:
          $ref: "#/components/schemas/SemanticQuery"
        channel:
          type: string
          enum: [api, ask, agent, system, cli, sdk, mcp]
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 160
    ResolvedSemanticAsset:
      type: object
      additionalProperties: false
      required: [assetId, revisionId, address, assetType]
      properties:
        assetId:
          $ref: "#/components/schemas/SemanticAssetId"
        revisionId:
          $ref: "#/components/schemas/AssetRevisionId"
        address:
          $ref: "#/components/schemas/SemanticAddress"
        assetType:
          $ref: "#/components/schemas/SemanticAssetType"
    ResolvedSemanticObject:
      type: object
      additionalProperties: false
      required: [objectType, objectId, version]
      properties:
        objectType:
          type: string
          enum: [physical_binding, model_grain, entity_key, join_contract]
        objectId:
          $ref: "#/components/schemas/GovernanceTargetObjectId"
        version:
          type: integer
          minimum: 1
    ResolvedSemanticPlan:
      type: object
      description: The plan digest is an opaque server-owned fingerprint including private immutable execution provenance; clients do not recompute it.
      additionalProperties: false
      required: [id, queryId, releaseId, resolverVersion, intent, assets, objects, executionStatus, planDigest, createdAt]
      properties:
        model: { $ref: "#/components/schemas/ResolvedSemanticAsset" }
        id:
          $ref: "#/components/schemas/ResolvedSemanticPlanId"
        queryId:
          $ref: "#/components/schemas/SemanticQueryId"
        releaseId:
          $ref: "#/components/schemas/GovernanceReleaseId"
        resolverVersion:
          type: string
          minLength: 1
          maxLength: 80
        intent:
          type: string
          enum: [describe, aggregate, breakdown, compare]
        assets:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedSemanticAsset"
        objects:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedSemanticObject"
        measures:
          type: array
          items:
            $ref: "#/components/schemas/SemanticSelector"
        filters:
          type: array
          items:
            $ref: "#/components/schemas/SemanticFilter"
        grouping:
          type: array
          items:
            $ref: "#/components/schemas/SemanticSelector"
        timeRange:
          $ref: "#/components/schemas/SemanticTimeRange"
        order:
          type: array
          items:
            $ref: "#/components/schemas/SemanticOrder"
        limit:
          type: integer
          minimum: 0
          maximum: 10000
        executionStatus:
          type: string
          enum: [not_configured, ready, requires_execution_validation]
        planDigest:
          $ref: "#/components/schemas/GovernanceChangeDigest"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    QueryExecutionRequest:
      type: object
      additionalProperties: false
      required: [planId, planDigest, idempotencyKey]
      properties:
        planId: { $ref: "#/components/schemas/ResolvedSemanticPlanId" }
        planDigest: { $ref: "#/components/schemas/GovernanceChangeDigest" }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        channel: { type: string, enum: [api, sdk, cli, web] }
    QueryExecutionRun:
      type: object
      additionalProperties: false
      required: [id, workspaceId, queryId, planId, planDigest, principalId, channel, sourceId, sourceRevisionId, adapterVersion, policyVersion, timeoutMs, maxRows, maxBytes, cancelRequested, state, rowCount, byteCount, startedAt, traceId]
      properties:
        id: { $ref: "#/components/schemas/RunId" }
        workspaceId: { $ref: "#/components/schemas/WorkspaceId" }
        queryId: { $ref: "#/components/schemas/SemanticQueryId" }
        planId: { $ref: "#/components/schemas/ResolvedSemanticPlanId" }
        planDigest: { $ref: "#/components/schemas/GovernanceChangeDigest" }
        principalId: { $ref: "#/components/schemas/PrincipalId" }
        consumerId: { $ref: "#/components/schemas/ConsumerId" }
        credentialId: { $ref: "#/components/schemas/ClientCredentialId" }
        channel: { type: string, enum: [api, mcp, sdk, cli, web] }
        sourceId: { $ref: "#/components/schemas/SourceConnectionId" }
        sourceRevisionId: { $ref: "#/components/schemas/SourceRevisionId" }
        adapterVersion: { type: string }
        policyVersion: { type: integer, minimum: 1 }
        timeoutMs: { type: integer, minimum: 1, maximum: 30000 }
        maxRows: { type: integer, minimum: 1, maximum: 10000 }
        maxBytes: { type: integer, minimum: 1, maximum: 8388608 }
        cancelRequested: { type: boolean }
        state: { type: string, enum: [running, succeeded, failed, cancelled, unknown] }
        errorCode: { type: string }
        rowCount: { type: integer, minimum: 0 }
        byteCount: { type: integer, minimum: 0 }
        resultDigest: { $ref: "#/components/schemas/GovernanceChangeDigest" }
        startedAt: { $ref: "#/components/schemas/Timestamp" }
        finishedAt: { $ref: "#/components/schemas/Timestamp" }
        traceId: { type: string }
    QueryExecutionResult:
      type: object
      additionalProperties: false
      required: [run, availability, replay]
      properties:
        sql: { type: string, description: Ephemeral authorized compiler output; not retained for replay. }
        parameters: { type: array, items: {} }
        dataTime: { $ref: "#/components/schemas/Timestamp" }
        run: { $ref: "#/components/schemas/QueryExecutionRun" }
        availability: { type: string, enum: [ephemeral, metadata_only, unavailable] }
        replay: { type: boolean }
        columns: { type: array, items: { type: string } }
        rows:
          type: array
          description: Ephemeral cells; numeric and integer values use exact decimal strings to avoid client precision loss. Never retained for replay.
          items:
            type: array
            items: {}
    SemanticRefusal:
      type: object
      additionalProperties: false
      required: [code, candidateIds, clarification, details]
      properties:
        code:
          type: string
          enum: [NO_RELEASE, BINDING_INACTIVE, BINDING_EXPIRED, CONSUMER_INACTIVE, UNAUTHORIZED_CONSUMER, STALE_RELEASE_BINDING, NO_MATCH, AMBIGUOUS_MATCH, UNAUTHORIZED_ASSET, MISSING_PHYSICAL_BINDING, MISSING_JOIN_PATH, INCOMPATIBLE_GRAIN, INVALID_QUERY, INVALID_FILTER, INVALID_TIME_RANGE, INVALID_ORDERING, INVALID_LIMIT, INVALID_PLAN]
        candidateIds:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/SemanticAssetId"
        clarification:
          type: string
          minLength: 1
          maxLength: 1000
        details:
          type: object
          additionalProperties: true
    QueryValidationResult:
      type: object
      additionalProperties: false
      required: [severity, code, message, details]
      properties:
        severity:
          type: string
          enum: [info, warning, blocker]
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        message:
          type: string
          minLength: 1
          maxLength: 1000
        details:
          type: object
          additionalProperties: true
    QueryValidation:
      type: object
      additionalProperties: false
      required: [id, queryId, validator, validatorVersion, inputDigest, status, results, createdAt, completedAt]
      properties:
        id:
          $ref: "#/components/schemas/QueryValidationRunId"
        queryId:
          $ref: "#/components/schemas/SemanticQueryId"
        planId:
          $ref: "#/components/schemas/ResolvedSemanticPlanId"
        validator:
          type: string
        validatorVersion:
          type: string
        inputDigest:
          $ref: "#/components/schemas/GovernanceChangeDigest"
        status:
          type: string
          enum: [passed, failed]
        results:
          type: array
          items:
            $ref: "#/components/schemas/QueryValidationResult"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        completedAt:
          $ref: "#/components/schemas/Timestamp"
    SemanticResolution:
      type: object
      additionalProperties: false
      required: [id, schemaVersion, resolverVersion, requestDigest, outcome, channel, validation, createdAt]
      properties:
        definitions:
          type: array
          items: { $ref: '#/components/schemas/ReleasedDefinition' }
        id:
          $ref: "#/components/schemas/SemanticQueryId"
        schemaVersion:
          type: string
          enum: [1.0.0]
        resolverVersion:
          type: string
        requestDigest:
          $ref: "#/components/schemas/GovernanceChangeDigest"
        outcome:
          type: string
          enum: [resolved, refused]
        channel:
          type: string
          enum: [api, ask, agent, system, cli, sdk, mcp]
        releaseId:
          $ref: "#/components/schemas/GovernanceReleaseId"
        consumerId:
          $ref: "#/components/schemas/ConsumerId"
        bindingId:
          $ref: "#/components/schemas/ConsumerBindingId"
        plan:
          $ref: "#/components/schemas/ResolvedSemanticPlan"
        refusal:
          $ref: "#/components/schemas/SemanticRefusal"
        validation:
          $ref: "#/components/schemas/QueryValidation"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    ProductionOperationId:
      type: string
      format: typeid
      pattern: "^prodop_[0-7][0-9a-hjkmnp-tv-z]{25}$"
      example: prodop_01arz3ndektsv4rrffq69g5fav
      x-go-type: identity.ProductionOperationID
      x-go-type-import:
        path: github.com/iiwish/semlia/pkg/identity
        name: identity
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      minLength: 71
      maxLength: 71
    Version:
      type: integer
      minimum: 1
      maximum: 2147483647
    LocalKey:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,63}$'
      maxLength: 64
    TargetKind:
      type: string
      enum: [semantic_asset, physical_binding, model_grain, entity_key, join_contract]
    ObjectKind:
      type: string
      enum: [physical_binding, model_grain, entity_key, join_contract]
    SnapshotSelection:
      type: object
      additionalProperties: false
      required: [sourceId, snapshotId, digest, coverageKeys]
      properties:
        sourceId: { $ref: '#/components/schemas/ResourceId' }
        snapshotId: { $ref: '#/components/schemas/ResourceId' }
        digest: { $ref: '#/components/schemas/Digest' }
        coverageKeys:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 256 }
    CandidateSelection:
      type: object
      additionalProperties: false
      required: [candidateId, digest, snapshotId, targetKeys, primaryTargetKey]
      properties:
        candidateId: { $ref: '#/components/schemas/ResourceId' }
        digest: { $ref: '#/components/schemas/Digest' }
        snapshotId: { $ref: '#/components/schemas/ResourceId' }
        targetKeys: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { $ref: '#/components/schemas/LocalKey' } }
        primaryTargetKey: { $ref: '#/components/schemas/LocalKey' }
    EvidenceSelection:
      type: object
      additionalProperties: false
      required: [evidenceId, digest]
      properties:
        evidenceId: { $ref: '#/components/schemas/ResourceId' }
        digest: { $ref: '#/components/schemas/Digest' }
        snapshotId: { $ref: '#/components/schemas/ResourceId' }
    ProductionInput:
      type: object
      additionalProperties: false
      required: [snapshots, candidates, evidence, dependencies]
      properties:
        snapshots: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/SnapshotSelection' } }
        candidates: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/CandidateSelection' } }
        evidence: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/EvidenceSelection' } }
        dependencies: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/PublishedReference' } }
    PhysicalReference:
      type: object
      additionalProperties: false
      required: [snapshotId, kind, objectId, revisionId]
      properties:
        snapshotId: { $ref: '#/components/schemas/ResourceId' }
        kind: { type: string, enum: [dataset, field] }
        objectId: { $ref: '#/components/schemas/ResourceId' }
        revisionId: { $ref: '#/components/schemas/ResourceId' }
    PublishedReference:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, targetId, releaseId, revisionId]
          properties:
            kind: { type: string, enum: [semantic_asset] }
            targetId: { $ref: '#/components/schemas/ResourceId' }
            releaseId: { $ref: '#/components/schemas/ResourceId' }
            revisionId: { $ref: '#/components/schemas/ResourceId' }
        - type: object
          additionalProperties: false
          required: [kind, targetId, releaseId, objectVersion, contentDigest]
          properties:
            kind: { $ref: '#/components/schemas/ObjectKind' }
            targetId: { $ref: '#/components/schemas/ResourceId' }
            releaseId: { $ref: '#/components/schemas/ResourceId' }
            objectVersion: { $ref: '#/components/schemas/Version' }
            contentDigest: { $ref: '#/components/schemas/Digest' }
    SemanticReference:
      oneOf:
        - type: object
          additionalProperties: false
          required: [localKey]
          properties:
            localKey: { $ref: '#/components/schemas/LocalKey' }
        - $ref: '#/components/schemas/PublishedReference'
    AssetContent:
      type: object
      additionalProperties: false
      required: [address, assetType, displayName, definition, scope, ownerPrincipalId]
      properties:
        address: { type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$', maxLength: 512 }
        assetType: { $ref: '#/components/schemas/SemanticAssetType' }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        definition: { type: string, minLength: 1, maxLength: 16384, nullable: true }
        scope: { type: string, minLength: 1, maxLength: 4096, nullable: true }
        ownerPrincipalId: { $ref: '#/components/schemas/ResourceId' }
        spec: { $ref: '#/components/schemas/KnowledgeSpec' }
