        code:
          type: string
          description: Stable machine-readable finding code.
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        message:
          type: string
          maxLength: 2048
        inputDigest:
          description: sha256 content digest of the canonical run inputs this result was computed over.
