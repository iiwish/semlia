      }
    KnowledgeReference:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "assetId",
          "revisionId",
          "releaseId"
        ],
        "properties": {
          "assetId": {
            "$ref": "#/components/schemas/ResourceId"
          },
          "revisionId": {
            "$ref": "#/components/schemas/ResourceId"
          },
          "releaseId": {
            "$ref": "#/components/schemas/ResourceId"
          },
          "memberId": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9_]{0,63}$"
          }
        }
      }
    KnowledgeMember:
      {
        "type": "object",
