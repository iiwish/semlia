      type: object
      additionalProperties: false
      required: [input, targets]
      properties:
        input: { $ref: '#/components/schemas/ProductionInput' }
        targets: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/ProductionTarget' } }
        supersedesOperationId: { $ref: '#/components/schemas/ResourceId' }
    ReplaceProductionRequest:
      type: object
