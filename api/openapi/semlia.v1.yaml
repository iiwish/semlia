        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishProductionRequest"
      responses:
        "200":
          description: Authorized replay of the committed release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCommandResult"
        "201":
          description: All members committed as one immutable release
          headers:
            Location:
              schema:
                type: string
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
