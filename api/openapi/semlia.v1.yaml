openapi: 3.0.3
info:
  title: Semlia Control API
  version: 0.9.0
  description: Versioned control-plane contract shared by Semlia services and clients.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
x-semlia-contract-version: 9
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
    description: Process and dependency status.
  - name: Identity
    description: OIDC sign-in, opaque sessions and workspace membership administration.
  - name: Authorization
    description: Persisted role, scoped assignment and effective-access administration.
  - name: Catalog
    description: Workspace-scoped semantic assets, immutable revisions and provenance.
  - name: Governance
    description: Workspace-scoped governed proposals over semantic assets and governance objects.
  - name: Discovery
    description: Source discovery run state and findings.
  - name: Distribution
    description: Release-pinned semantic consumers, bindings, queries, plans and refusals.
  - name: Operations
    description: Redacted audit evidence, durable runtime inspection and bounded future-run policy.
  - name: Workbench
    description: Persisted, authorized attention items and operator-owned workflow state.
  - name: Ingestion
    description: Durable artifact staging, immutable source sets and scheduled discovery.
security:
  - SessionCookie: []
paths:
  /api/v1/workspaces/{workspaceId}/client-credentials:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listClientCredentials
      responses:
        '200':
          description: Authoritative server response
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ClientCredentialSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Machine credential or workspace rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retry }
    post:
      operationId: issueClientCredential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueClientCredential' }
      responses:
        '201':
          description: Authoritative server response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Machine credential or workspace rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retry }
  /api/v1/workspaces/{workspaceId}/client-credentials/{credentialId}/revoke:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { in: path, name: credentialId, required: true, schema: { type: string } }
    post:
      operationId: revokeClientCredential
      responses:
        '204':
          description: Authoritative server response
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Machine credential or workspace rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retry }
  /api/v1/workspaces/{workspaceId}/client-credentials/{credentialId}/rotate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { in: path, name: credentialId, required: true, schema: { type: string } }
    post:
      operationId: rotateClientCredential
      responses:
        '201':
          description: Authoritative server response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Machine credential or workspace rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retry }
  /api/v1/workspaces/{workspaceId}/machine-principals:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createMachinePrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMachinePrincipal' }
      responses:
        '201':
          description: Authoritative server response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachinePrincipal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Machine credential or workspace rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retry }
  /api/v1/workspaces/{workspaceId}/webhooks:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWebhookSubscriptions
      responses:
        '200':
          description: Authoritative server response
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WebhookSubscription' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Machine credential or workspace rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retry }
    post:
      operationId: createWebhookSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveWebhookSubscription' }
      responses:
        '201':
          description: Authoritative server response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedWebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Machine credential or workspace rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retry }
  /api/v1/workspaces/{workspaceId}/webhooks/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { in: path, name: subscriptionId, required: true, schema: { type: string } }
    patch:
      operationId: updateWebhookSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveWebhookSubscription' }
      responses:
        '200':
          description: Authoritative server response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedWebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Machine credential or workspace rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retry }
  /api/v1/workspaces/{workspaceId}/webhooks/{subscriptionId}/rotate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { in: path, name: subscriptionId, required: true, schema: { type: string } }
    post:
      operationId: rotateWebhookSigningSecret
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookRotation' }
      responses:
        '200':
          description: Authoritative server response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedWebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Machine credential or workspace rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retry }
  /api/v1/workspaces/{workspaceId}/webhook-deliveries:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWebhookDeliveries
      responses:
        '200':
          description: Authoritative server response
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Machine credential or workspace rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retry }
  /api/v1/workspaces/{workspaceId}/webhook-deliveries/{deliveryId}/replay:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { in: path, name: deliveryId, required: true, schema: { type: string } }
    post:
      operationId: replayWebhookDelivery
      description: Requires runtime.manage. Requeues a dead-letter delivery once with eight additional attempts, preserving event identity, payload and subscription version. Disabled or changed subscriptions cannot replay historical deliveries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedAttempt]
              properties:
                expectedAttempt: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Persisted delivery queued for replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/semantic-describe:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: describeSemantics
      security: [{ SessionCookie: [] }, { MachineBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveSemanticQueryRequest' }
      responses:
        '200':
          description: Authoritative server response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticResolution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429':
          description: Machine credential or workspace rate limit exceeded
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds before retry }
  /api/v1/workspaces/{workspaceId}/semantic-search:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: searchReleasedSemantics
      security: [{ SessionCookie: [] }, { MachineBearer: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 240 } }
      responses:
        '200':
          description: Authorized released definitions
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ReleasedDefinition' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workspaces/{workspaceId}/mcp:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: callMCP
      security: [{ MachineBearer: [] }]
      description: Stateless Streamable HTTP with semantic_resolve, semantic_describe, semantic_search, semantic_plan, semantic_query and semlia://contract. No execution tools.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: MCP JSON-RPC response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '202': { description: MCP notification accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/workspaces/{workspaceId}/embedding-index:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getEmbeddingIndexStatus
      responses:
        '200':
          description: Persistent embedding capability, the machine-readable reason a rebuild is blocked, and generations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingIndexStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: startEmbeddingRebuild
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '202':
          description: Durable rebuild queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingIndexVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            The rebuild cannot start yet. EMBEDDING_NO_PUBLISHED_RELEASE means the
            workspace has no published release to index; VERSION_CONFLICT means the
            request collided with current state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/workspaces/{workspaceId}/embedding-index/{indexId}/cancel:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - in: path
        name: indexId
        required: true
        schema: { $ref: '#/components/schemas/RunId' }
    post:
      operationId: cancelEmbeddingRebuild
      responses:
        '204': { description: Rebuild cancelled without changing the active index }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/workspaces/{workspaceId}/embedding-search:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: searchEmbeddingIndex
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          description: Currently authorized released candidates with explicit retrieval mode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingSearchResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /health/live:
    get:
      security: []
      operationId: getLiveness
      summary: Check whether the process is alive
      tags:
        - System
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      security: []
      operationId: getReadiness
      summary: Check whether required dependencies are ready
      tags:
        - System
      responses:
        "200":
          description: Required dependencies are ready.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/system/info:
    get:
      security: []
      operationId: getSystemInfo
      summary: Read public build and contract information
      tags:
        - System
      responses:
        "200":
          description: Public service information.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    get:
      security: []
      operationId: beginOIDCLogin
      summary: Start an OIDC Authorization Code plus PKCE sign-in
      tags:
        - Identity
      parameters:
        - name: returnTo
          in: query
          schema:
            type: string
            pattern: "^/([^/].*)?$"
            maxLength: 1024
      responses:
        "302":
          description: Redirect to the configured OIDC authorization endpoint.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/callback:
    get:
      security: []
      operationId: completeOIDCLogin
      summary: Complete an OIDC Authorization Code plus PKCE sign-in
      tags:
        - Identity
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Set the opaque session cookie and redirect into the application.
          headers:
            Location:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/methods:
    get:
      operationId: getAuthMethods
      summary: Read configured authentication methods
      tags: [Identity]
      security: []
      responses:
        "200":
          description: Authentication providers available in this deployment.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [password, oidc]
                properties:
                  password:
                    type: boolean
                  oidc:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /api/v1/auth/password/login:
    post:
      operationId: passwordLogin
      summary: Establish a local account session
      description: Requires an exact configured Origin and JSON content type. Login names are not verified email identities. Rate limits are shared across processes.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 320
                password:
                  type: string
                  maxLength: 1024
                  writeOnly: true
      responses:
        "204":
          description: Opaque HttpOnly session cookie issued. Read the session endpoint for CSRF and membership information.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Authentication attempts are temporarily limited.
          headers:
            Retry-After:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/v1/session/password:
    post:
      operationId: changePassword
      summary: Change the current local password and revoke all account sessions
      tags: [Identity]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  maxLength: 1024
                  writeOnly: true
                newPassword:
                  type: string
                  minLength: 6
                  maxLength: 1024
                  writeOnly: true
      responses:
        "204":
          description: Password changed and all account sessions revoked.
        default:
          $ref: "#/components/responses/Error"
  /api/v1/session:
    get:
      operationId: getSession
      summary: Read the authenticated account and active workspace memberships
      tags:
        - Identity
      responses:
        "200":
          description: Current session. The CSRF verifier is returned only in the X-Semlia-CSRF response header.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
            X-Semlia-CSRF:
              $ref: "#/components/headers/CSRF"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSession
      summary: Revoke the current opaque session
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Session revoked and cookie expired.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createPasswordMember
      summary: Create a local account with an authorized workspace role
      tags: [Identity]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, displayName, password, roleId]
              properties:
                username:
                  type: string
                  maxLength: 320
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 256
                password:
                  type: string
                  minLength: 6
                  maxLength: 1024
                  writeOnly: true
                roleId:
                  type: string
      responses:
        "201":
          description: Local account admitted to the workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAccount"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listWorkspaceMembers
      summary: List workspace account memberships
      tags:
        - Identity
      responses:
        "200":
          description: Workspace memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembershipPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/members/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/MembershipId"
    patch:
      operationId: updateWorkspaceMembership
      summary: Activate, suspend or revoke a workspace membership
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkspaceMembershipRequest"
      responses:
        "200":
          description: Updated membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceInvitations
      summary: List workspace invitations
      tags:
        - Identity
      responses:
        "200":
          description: Workspace invitations without acceptance token material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createWorkspaceInvitation
      summary: Invite one OIDC identity by subject or verified email
      tags:
        - Identity
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceInvitationRequest"
      responses:
        "201":
          description: Created invitation without acceptance token material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List available workspaces
      tags:
        - Catalog
      responses:
        "200":
          description: Workspaces ordered for catalog selection, with populated workspaces first.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
