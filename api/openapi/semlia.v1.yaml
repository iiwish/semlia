  /api/v1/workspaces/{workspaceId}/governance/agent-runs/generate-proposal:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: generateGovernanceProposal
      summary: Generate a governed proposal through the configured model
      description: >-
        Runs one live LLM generation with full SSOT §8.6 recording: the
        agent run records the model, configuration revision, input hash,
        model step, output digest, cost and duration with a terminal final
        state. The model output passes the semlia.proposal-input/v1 schema
        gate before the agent-attributed proposal is created through the
        governed authoring path — it enters the normal validation and review
        pipeline, never publication. One request is one agent run is at most
        one proposal; there are no implicit retries. Provider failures
        degrade to a recorded failed run and create no proposal. Requires
        the asset.propose capability for the calling principal.
      tags:
        - Governance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceGenerateProposalRequest"
      responses:
        "201":
          description: The finished agent run and the generated agent-attributed proposal.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceGeneratedProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
