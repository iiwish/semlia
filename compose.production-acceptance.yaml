services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${SEMLIA_ACCEPTANCE_OWNER:?required}
      POSTGRES_USER: ${SEMLIA_ACCEPTANCE_OWNER:?required}
      POSTGRES_PASSWORD: ${SEMLIA_ACCEPTANCE_PASSWORD:?required}
    ports:
      - "127.0.0.1:${SEMLIA_ACCEPTANCE_DB_PORT:?required}:5432"
    labels:
      io.semlia.acceptance.owner: ${SEMLIA_ACCEPTANCE_OWNER:?required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 3s
      retries: 40
volumes:
  postgres-data:
    labels:
      io.semlia.acceptance.owner: ${SEMLIA_ACCEPTANCE_OWNER:?required}
networks:
  default:
    labels:
      io.semlia.acceptance.owner: ${SEMLIA_ACCEPTANCE_OWNER:?required}
