version: "2"
sql:
  - engine: postgresql
    schema:
      - ../migrations/000001_m0_foundation.up.sql
      - ../migrations/000002_foundation_uuidv7.up.sql
      - ../migrations/000003_semantic_registry_foundation.up.sql
      - ../migrations/000004_usage_events.up.sql
      - ../migrations/000005_m2_authorization_foundation.up.sql
      - ../migrations/000006_m2_governed_authoring.up.sql
      - ../migrations/000007_m2_governance_objects.up.sql
      - ../migrations/000008_m2_policy_rules.up.sql
      - ../migrations/000009_m2_review_batches.up.sql
      - ../migrations/000010_m2_release_publishing.up.sql
      - ../migrations/000011_m2_model_config.up.sql
    queries:
      - queries
    gen:
      go:
        package: dbgen
        out: ../internal/adapters/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: false
        emit_empty_slices: true
