version: "2"
sql:
  - engine: postgresql
    schema:
      - ../migrations/000001_m0_foundation.up.sql
      - ../migrations/000002_foundation_uuidv7.up.sql
      - ../migrations/000003_semantic_registry_foundation.up.sql
    queries:
      - queries
    gen:
      go:
        package: dbgen
        out: ../internal/adapters/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: false
        emit_empty_slices: true
