environment:
  database: New T002 database tests use local testcontainers PostgreSQL 18-alpine. The required existing TestPostgres17MigrationLifecycle may create its own postgres:17-alpine container unchanged for compatibility evidence. Confirm each TestMain owns its containers; cleanup only containers created by these tests.
  prohibited: No make check/dev/default Compose, deploy, existing DB migration, paid/live models, Git commit/push/reset, dependency changes or front-end build.
  dirty_worktree: checkout.json hashes plus ignored baseline copies identify existing tracked/untracked content. Ordinary git diff is not the task delta.
  storage_pressure: Final database verification uses serial package execution with -p=1 due host ENOSPC. Keep identical tests and original failure logs; do not prune shared Docker resources to bypass capacity checks.
evidence:
  output: Exact changed files, actual diff versus baseline copy, original RED/GREEN/commands stdout stderr exit statuses, UTC start/end, scope, unverified cases and remaining risks.
  file_policy: Manual code and Markdown edits use apply_patch; generated raw logs/diffs/checks may use structured file APIs. Never overwrite prior attempt logs.
stop_conditions:
  - Do not delegate further. Do not change task to Accepted.
  - If necessary file is outside allowlist or current contract cannot be implemented without a product/security decision, message PM with precise requirement and stop that write.
  - Do not revert user or parallel-agent changes. Unexpected unrelated edits stay untouched; conflicts are reported.
  - Failing safety tests or missing runtime evidence are not passes. Do not relax bounds, FK/CAS/authorization or assertion semantics to make tests green.
