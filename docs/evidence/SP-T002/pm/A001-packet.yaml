scope_rules:
  - Allowed list is a maximum, not a requirement to edit every file. Existing work is the baseline; never revert it.
  - Generated Go/sqlc/SDK files may only change through existing generators; do not hand edit generated files.
  - Adapter edits only propagate proven coverage and existing code content; no new source kinds or external behavior.
  - Readiness/schema inventory edits assert exact newly required schema and retain real old-stage migration assertions. Do not weaken tests to pass.
  - Only add the four source snapshot GET routes plus additive nullable discovery-run snapshotId. No production-operation routes yet.
implementation_obligations:
  - Implement data-model section 2 and source API semantics exactly, including all nine tables, workspace/identity/revision FKs, immutable constraints and append-only codrev/linrev.
  - Every observed dataset/field including reused revisions is a member; field parent identity/revision must match this snapshot. Historical names and locators never read from current rows.
  - Code bytes are content-addressed and protected from cleanup while snapshots depend on them; verify byte availability, not only hash storage. Lineage endpoints and code reference precise revisions.
  - Cover declared selectors and per-unit completeness explicitly. Partial/failed never imply deletion or globally advance effective complete state. Complete units may advance per-unit head; failed attempts invalidate freshness of their required unit.
  - Handle first scan, unchanged replay, repeated runs, rename, deletion, shrink scope, partial/failed, concurrent/out-of-order runs and source config changes deterministically with source locks/CAS.
  - Historical migration must not fabricate names/members/scope from current state; preserve unverifiable quality. No blanket mark of legacy records as verified.
  - All four reads reauthorize source scope and workspace; wrong relation is 404, known denied scope 403. Machine allowlist remains unchanged.
  - Cursor binds kind/resource/workspace/filters/upper watermark and last key; limit 1..200, default 50, byte-budget bounded pages and immutable historical data.
  - Expand-first migration is atomic, schema readiness rejects mismatched databases, empty rollback is tested and rollback with unrepresentable authoritative history rejects without data loss.
  - No application-level approval, asset creation, generation, publishing, frontend rewrite or new dependencies.
tdd:
  red: Add focused runtime tests first and preserve actual failing output for unchanged members, historical names, partial/failed coverage, concurrent/replay, cross-workspace authorization, retention and migration safety.
  green: Implement minimum schema/domain/persistence/service/HTTP/SDK changes against current repository patterns; all DB assertions use actual isolated PostgreSQL.
  refactor: Only simplify touched discovery helpers. Preserve transaction ownership and existing contracts; no nested self-committing repository calls.
