<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="数据语义中台系统设计全景：输入三类资料，加工成五类知识，用知识约束取数，返回有依据的答案，并比较 Text-to-SQL 方案的业务依据组织与治理方式。">
<title>数据语义中台 · 系统全景</title>
<style>
:root{--ink:#20252b;--muted:#646c76;--line:#dce0e5;--canvas:#f3f4f6;--soft:#f7f8fa;--blue:#355bd6;--green:#08755f;--rust:#b34d36;--teal:#16758b;--plum:#79569b}
*{box-sizing:border-box;letter-spacing:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.3;cursor:default}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
h1,h2,h3,h4,p,figure,dl,dd{margin:0}h1,h2,h3,h4,strong{font-weight:650}
svg{flex-shrink:0}svg.icon{display:block;width:20px;height:20px}button svg{pointer-events:none}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.toolbar{height:64px;position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-size:15px;white-space:nowrap}.brand>svg{color:var(--green);width:22px;height:22px}.brand span{font-size:13px;color:var(--muted);padding-left:16px;margin-left:4px;border-left:1px solid var(--line)}
.tools,.zoom-tools{display:flex;align-items:center;gap:4px}.tools{gap:12px}
.icon-button{border:0;background:transparent;width:36px;height:36px;display:grid;place-items:center;border-radius:6px;transition:background 120ms,color 120ms}.icon-button:hover{background:#edf0f4}.icon-button:active{background:#e1e6ed}
.zoom-tools{gap:3px}.zoom-value{font:12px/36px ui-monospace,SFMono-Regular,monospace;width:52px;height:36px;padding:0;text-align:center;color:var(--muted);border:0;border-radius:6px;background:transparent}.zoom-value:hover{background:#edf0f4}#fullscreen{border-left:1px solid var(--line);border-radius:0;padding-left:12px;width:48px}
#viewport{height:calc(100% - 64px);overflow:hidden;overscroll-behavior:none;position:relative;cursor:grab;touch-action:none;outline-offset:-4px}
#viewport.is-dragging{cursor:grabbing;user-select:none}#viewport.is-dragging *{cursor:grabbing!important}#viewport button{cursor:pointer}
#canvas-space{position:absolute;inset:0;overflow:clip}
#sheet{position:absolute;left:0;top:0;width:1800px;transform-origin:0 0;will-change:transform}
#map{width:1800px;position:relative;padding:24px 72px 48px 116px}
.map-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:58px;padding-left:0;gap:36px}
.map-kicker{display:flex;align-items:center;gap:10px;font:16px/24px ui-monospace,SFMono-Regular,monospace;color:var(--green);margin-bottom:16px}.map-kicker::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--green)}
.map-header h1{font-size:44px;line-height:1.3;font-weight:650}.map-header h1 span{font-size:25px;color:var(--muted);font-weight:400;margin-left:22px}
.map-thesis{font-size:21px;color:#989faa;margin-top:18px;line-height:1.6;display:flex;align-items:center;gap:15px}.map-thesis strong{color:var(--muted);font-weight:400}
.design-status{font-size:17px;color:var(--muted);padding-top:10px;text-align:right;line-height:1.8;white-space:nowrap}.design-status span{display:inline-block;background:#e6e9ee;color:#58616d;font-size:15px;padding:2px 10px;border-radius:4px;margin-bottom:8px}
.stage{position:relative;display:grid;gap:20px 24px;margin-top:52px}
.stage-heading{position:relative;grid-column:1/-1;display:flex;align-items:center;gap:18px;font-size:28px;line-height:40px;margin-bottom:4px;min-height:40px}
.stage-heading b{position:absolute;left:-82px;top:0;font:18px/40px ui-monospace,SFMono-Regular,monospace;color:#566171;width:44px;text-align:center;background:#e6e9ee;border:1px solid #d8dde4;border-radius:8px}
.stage-heading small{font-size:18px;font-weight:400;color:var(--muted)}
.stage-heading .head-right{margin-left:auto;font-size:17px;color:var(--muted);display:flex;align-items:center;gap:8px}.head-right svg{width:19px;height:19px;color:var(--green)}.head-right strong{color:var(--ink);font-weight:500}
.node,.knowledge,.material,.feedback-chip{position:relative;min-width:0;background:#fff;border:1.5px solid var(--line);border-radius:8px;box-shadow:0 3px 6px #232d3d03,0 1px 2px #232d3d03}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wire{fill:none;stroke:#a5aeb9;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.wire.publish{stroke:#469382;marker-end:url(#arrow-green)}.wire.feedback{stroke:#96a3b0;stroke-width:1.5;stroke-dasharray:6 7;marker-end:url(#arrow-feedback)}.wire.spine{stroke:#c4cbd4;stroke-width:1.5;marker-end:url(#arrow-spine)}
.wire-label{position:absolute;font-size:16px;color:var(--green);background:var(--canvas);padding:0 10px;line-height:24px;white-space:nowrap}
.stage--input{grid-template-columns:repeat(3,1fr) 1.45fr;margin-top:0;row-gap:18px}
.material{height:116px;display:grid;grid-template-columns:50px 1fr;grid-template-rows:1fr 1fr;column-gap:16px;padding:24px;align-content:center}
.material svg{grid-row:1/3;width:34px;height:34px;align-self:center;justify-self:center;color:#667284}
.material strong{font-size:23px;align-self:end;line-height:30px}.material small{font-size:18px;color:var(--muted);align-self:start;margin-top:4px}
.lineage-note{grid-column:1/-1;grid-row:3;font-size:16px;color:var(--muted);line-height:24px}
.feedback-chip{grid-column:4;grid-row:2;height:116px;background:#eceff3;border-color:#d5dce4;display:flex;align-items:center;gap:18px;padding:24px}
.feedback-chip svg{width:30px;height:30px;color:#718097}.feedback-chip strong{font-size:23px;line-height:30px;display:block}.feedback-chip small{font-size:17px;line-height:1.5;color:var(--muted);display:block;margin-top:4px}
.stage--process{grid-template-columns:repeat(4,1fr);column-gap:32px}
.process-node{min-height:154px;padding:24px 26px}
.process-node h3{font-size:25px;display:flex;align-items:center;gap:12px;line-height:32px}.process-node h3 svg{color:#647387;width:25px;height:25px}
.process-node p{font-size:20px;line-height:1.6;color:var(--muted);margin-top:10px;padding-left:37px}
.publish-node{background:#e9f4ef;border-color:#a8d2c3}.publish-node h3,.publish-node h3 svg{color:var(--green)}
.stage--knowledge{grid-template-columns:.95fr .95fr .95fr 1.15fr 1.15fr;padding-top:0;row-gap:24px;margin-top:60px}
.stage--knowledge .stage-heading{margin-bottom:20px}
.knowledge{height:440px;padding:24px 22px 20px;--accent:var(--blue);border-top:3px solid var(--accent)}
.knowledge.object{--accent:var(--blue)}.knowledge.rule{--accent:var(--green)}.knowledge.metric{--accent:var(--rust)}.knowledge.asset{--accent:var(--teal)}.knowledge.model{--accent:var(--plum)}
.knowledge h3{font-size:24px;line-height:32px;color:var(--accent);padding-right:26px}
.knowledge .detail-button{position:absolute;top:23px;right:14px}
.detail-button{width:30px;height:30px;display:grid;place-items:center;background:transparent;border:0;border-radius:4px;color:#9099a5;transition:background 120ms,color 120ms}.detail-button:hover{background:#edf0f4;color:var(--blue)}.detail-button svg{width:18px;height:18px}
.knowledge:has(.detail-button:hover),.knowledge:focus-within{border-color:var(--accent);box-shadow:0 6px 18px #232d3d0a}
.qtag{display:block;font-size:16px;line-height:24px;color:var(--muted);margin-top:6px}
.knowledge-content{padding-top:22px}
.object-pair{display:flex;justify-content:space-between;gap:14px}.object-pair>div{flex:1;min-width:0}
.object-pair h4{font-size:22px;display:flex;gap:6px;align-items:center;margin-bottom:12px}.object-pair h4 svg{width:20px;height:20px;color:var(--blue)}
.object-pair p{font-size:18px;line-height:1.7}.object-pair .minor{font-size:16px;color:var(--muted);margin-top:7px}
.rule-name,.metric-name,.model-name{font-size:23px;line-height:30px}
.rule-expression{margin-top:10px;font-size:20px;line-height:1.55}.rule-expression strong{color:var(--green)}.rule-other{margin-top:14px;font-size:17px;color:var(--muted);line-height:1.5}
.fraction{display:flex;flex-direction:column;align-items:center;font-size:20px;line-height:1.6;margin:10px 0 14px;color:var(--rust)}.fraction span:first-child{border-bottom:1.5px solid #cd9a8d;width:100%;text-align:center;padding-bottom:4px}.fraction span:last-child{padding-top:4px}.metric-time{font-size:17px;color:var(--muted);text-align:center;line-height:1.6}
.asset-names{font-size:20px;line-height:1.5}.asset-field{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:17px;margin-top:7px}.asset-field code{font-size:16px;color:var(--teal)}.asset-scope{font-size:16px;color:var(--muted);margin-top:12px;line-height:1.5}
.knowledge-label{font-size:16px;line-height:24px;color:var(--accent);font-weight:600;margin-top:16px}.asset-facts{font-size:18px;line-height:1.5;margin-top:4px}.asset-facts small{display:block;font-size:16px;color:var(--muted)}.model-config{display:grid;grid-template-columns:42px 1fr;gap:8px 12px;margin-top:8px;font-size:17px;line-height:1.5}.model-config dt{color:var(--muted)}.model-note{font-size:16px;line-height:1.5;margin-top:14px;color:var(--muted)}
.model-pair{display:flex;align-items:center;justify-content:space-between;font-size:20px;margin:16px 0 14px;color:var(--plum)}.model-pair svg{width:22px;height:22px}.model-members{font-size:18px;line-height:1.6}.model-members small{display:block;font-size:16px;color:var(--muted);margin-top:5px}
.bank-meta{grid-column:1/-1;font-size:16px;color:var(--muted);line-height:24px;justify-self:start;margin-top:-8px}
.stage--usage{grid-template-columns:354px 1fr 350px;column-gap:32px;margin-top:72px}
.question-node,.plan-node,.sql-node{min-height:260px;padding:24px}
.query-label{font-size:17px;color:var(--muted);display:flex;align-items:center;gap:8px}.query-label svg{width:20px;height:20px}
.q-rows{margin-top:20px;display:flex;flex-direction:column;gap:18px}.q-row{display:flex;align-items:flex-start;gap:6px;font-size:24px;line-height:30px;font-weight:550;white-space:nowrap}.q-seg{display:flex;flex-direction:column;align-items:center;gap:7px}.q-seg em{font-style:normal}
.q-tag{font-size:14px;line-height:20px;font-weight:400;padding:1px 6px;border-radius:3px}.q-tag.object{color:var(--blue);background:#edf0fc}.q-tag.rule{color:var(--green);background:#e9f4ef}.q-tag.metric{color:var(--rust);background:#faeee9}.q-tag.param{color:var(--muted);background:var(--soft)}
.word-object{color:var(--blue)}.word-rule{color:var(--green)}.word-metric{color:var(--rust)}.q-time-note{margin-top:18px;font-size:16px;color:var(--muted)}
.plan-intro{font-size:18px;line-height:1.6;color:var(--muted);margin-top:12px;max-width:690px}
.plan-node h3,.sql-node h3{font-size:24px;line-height:32px}.plan-node .detail-button{position:absolute;right:18px;top:24px}.plan-routes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:20px}
.route{border-top:2px solid var(--rc);padding-top:12px}.route b{display:block;font-size:18px;line-height:26px;color:var(--rc)}.route p{font-size:17px;line-height:1.6;margin-top:8px}.route.r1{--rc:var(--green)}.route.r2{--rc:var(--blue)}.route.r3{--rc:var(--rust)}.plan-note{margin-top:18px;font-size:16px;line-height:1.6;color:var(--muted)}
.sql-symbols{font-size:19px;line-height:1.9;margin-top:14px}.sql-symbols code{display:inline-block;width:86px;font-size:17px;color:var(--teal)}.execution-source{font-size:17px;line-height:26px;color:var(--green);margin-top:17px;display:flex;align-items:center;gap:9px}.execution-source svg{width:20px;height:20px}
.stage--output{grid-template-columns:530px 1fr;column-gap:32px;margin-top:48px}
.answer-node{padding:25px 30px;background:#e5f2eb;border-color:#a8cebb;display:grid;grid-template-columns:200px 1fr;align-items:center;gap:8px 20px}
.answer-label{font-size:17px;color:var(--green);line-height:24px;grid-column:1/-1}
.answer-value{display:flex;gap:10px;align-items:baseline;line-height:1}.answer-value strong{font-size:58px;line-height:1.15;color:var(--green);font-weight:600}.answer-value span{font-size:22px;color:var(--green);white-space:nowrap}.answer-basis{font-size:17px;color:#4b6b5f;line-height:1.7}
.evidence{padding:18px 0;align-self:center;display:flex;flex-direction:column}.evidence-chips{display:flex;flex-wrap:wrap;gap:12px 24px;order:1}
.evidence-chips span{display:flex;align-items:center;gap:8px;font-size:17px;line-height:26px;white-space:nowrap}.evidence-chips svg{width:18px;height:18px;color:var(--green)}
.evidence-tagline{margin-bottom:20px;font-size:24px;line-height:34px;color:var(--ink)}.evidence-tagline strong{color:var(--green)}
.stage--compare{margin-top:64px}
.compare-grid{grid-column:1/-1;width:100%;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;table-layout:fixed;border-collapse:separate;border-spacing:0}
.compare-grid th,.compare-grid td{padding:14px 20px;font-size:19px;line-height:28px;border-top:1px solid #e9ecf0;text-align:left;vertical-align:top}.compare-grid thead th{border-top:0;background:#e9edf2;font-weight:650}.compare-grid tbody th{font-weight:550}.compare-grid .compare-ours{background:#f0f7f3}.compare-grid thead .compare-ours{background:#deeee5;color:#156c55}
.compare-intro,.compare-thesis{grid-column:1/-1;font-size:21px;line-height:32px;color:var(--muted)}.compare-thesis strong{color:var(--ink);font-weight:550}
.compare-notes{grid-column:1/-1;font-size:17px;line-height:28px;color:var(--muted);display:grid;gap:6px}.compare-notes strong{color:var(--ink);font-weight:550}.compare-sources{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 20px;margin-top:4px;font-size:16px}.compare-sources a{color:var(--teal);text-decoration:underline;text-underline-offset:3px}.compare-sources a:hover{color:var(--green)}
.feedback-strip{display:flex;align-items:center;gap:20px;font-size:18px;margin-top:42px;padding:20px 0;line-height:28px}
.feedback-strip h3{font-size:21px;display:flex;align-items:center;gap:10px}.feedback-strip h3 svg{width:23px;height:23px;color:#63778a}.feedback-strip p{display:flex;align-items:center;gap:10px}.feedback-strip svg{width:18px;height:18px}.feedback-personal{color:var(--blue)}.feedback-shared{color:var(--green)}.feedback-divider{height:22px;border-left:1px solid #cbd2dc}
.map-disclaimer{display:flex;justify-content:space-between;font-size:16px;line-height:26px;color:var(--muted);margin-top:12px}
dialog{border:1px solid var(--line);border-radius:8px;width:780px;max-width:calc(100vw - 64px);max-height:calc(100vh - 64px);padding:32px;color:var(--ink);background:#fff;box-shadow:0 24px 80px #20252b30;overflow:auto}
dialog::backdrop{background:#20252b55}
.dialog-heading{display:flex;align-items:center;justify-content:space-between;gap:20px}.dialog-heading h2{font-size:25px;line-height:1.4}.dialog-heading button{flex-shrink:0}
.dialog-intro{font-size:16px;line-height:1.8;color:var(--muted);margin:20px 0}
.definition-table{width:100%;border-collapse:collapse;font-size:16px;line-height:1.7;margin:16px 0}.definition-table th,.definition-table td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line)}.definition-table th{font-weight:550;color:var(--muted)}.definition-table tr>:first-child{width:26%}.definition-table code{font-size:14px;overflow-wrap:anywhere}.definition-table thead th{background:var(--soft);font-weight:650;color:var(--ink)}
.detail-note{font-size:14px;line-height:1.8;color:var(--muted);border-left:3px solid #a8cdbb;padding-left:16px;margin-top:24px}
.detail-step{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.7}.detail-step b{color:var(--green)}.detail-step p{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:14px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 16px;box-shadow:0 4px 18px #20252b15;display:none}#status.visible{display:block}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
@media print{html,body{height:auto;overflow:visible;background:#fff}.toolbar,#status,dialog,.detail-button{display:none!important}#viewport,#canvas-space{position:static;height:auto;overflow:visible}#sheet{position:static;transform:none!important}#map{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>

<section class="stage stage--compare" aria-labelledby="compare-heading">
<h2 id="compare-heading" class="stage-heading"><b>06</b>与常见 Text-to-SQL 方案的关系<small>业务依据如何组织与治理</small></h2>
<p class="compare-intro">本平台同样包含 Text-to-SQL：理解问题、准备上下文、生成与校验 SQL，再执行取数。比较的重点是业务知识如何持续管理。</p>

<colgroup><col style="width:160px"><col><col><col></colgroup>
<thead><tr><th scope="col">对比点</th><th scope="col">上下文增强型 Text-to-SQL</th><th scope="col">语义层增强型 Text-to-SQL</th><th class="compare-ours" scope="col">本平台 · 目标设计</th></tr></thead>
<tbody>
<tr><th scope="row">业务依据</th><td>表与字段说明、业务规则、样例值和相似 SQL</td><td>显式指标、维度、关系、语义模型及验证样例</td><td class="compare-ours">五类知识明确归属，保留责任人、证据与发布版本</td></tr>
<tr><th scope="row">跨资产关联</th><td>依据表结构、关联提示与 SQL 示例生成连接</td><td>依据语义模型中的关系和约束组织连接</td><td class="compare-ours">关联归分析模型定义并验证；缺少适用模型先建模</td></tr>
<tr><th scope="row">知识维护</th><td>维护说明、规则、提示词与示例 SQL</td><td>维护语义模型、指标定义与已验证查询</td><td class="compare-ours">候选 → 确认 → 验证 → 审核 → 发布，反馈进入治理流程</td></tr>
<tr><th scope="row">查询校验</th><td>解析、试运行、错误反馈修正；可加入歧义澄清</td><td>结合语义约束与 SQL 校验，具体能力因产品而异</td><td class="compare-ours">核对口径、关联粒度、版本、权限与预算；依据不足不执行</td></tr>
<tr><th scope="row">结果追溯</th><td>可提供 SQL、查询结果与执行记录</td><td>可补充语义模型、指标及验证样例依据</td><td class="compare-ours">关联所用知识版本、SQL、参数、数据时间与执行证据</td></tr>
<tr><th scope="row">建设投入</th><td>整理元数据、规则与样例，持续评测和修正</td><td>建设语义模型，持续维护定义与验证集</td><td class="compare-ours">投入业务梳理、责任分工、审核发布与持续维护</td></tr>
</tbody>
</table>
<p class="compare-thesis">不仅生成查询，还将业务定义、数据映射与分析模型作为<strong>可审核、可发布、可追溯的知识资产</strong>持续管理。</p>

<template id="detail-object"><p class="dialog-intro">业务对象确定“在描述谁、每条记录代表什么”。它保存业务属性，不复制所有候选表名。</p><table class="definition-table"><tbody><tr><th scope="row">对象与标识</th><td>客户 <code>customer</code>，订单 <code>order</code>，分别具有稳定 ID。</td></tr><tr><th scope="row">身份与粒度</th><td>客户：统一客户身份，一位客户。订单：订单身份，一笔订单。</td></tr><tr><th scope="row">客户属性</th><td>统一客户 ID、当前区域、全历史首次有效支付日期。</td></tr><tr><th scope="row">订单属性</th><td>订单 ID、统一客户 ID、实付金额、支付时间。</td></tr><tr><th scope="row">使用方式</th><td>“华东”引用客户的区域属性。“老客户”引用客户的首次有效支付属性。通过数据资产中的字段映射定位这些属性的数据实现。</td></tr></tbody></table><p class="detail-note">业务属性有自己的成员 ID；真实表名、字段名与业务属性的映射归数据资产管理。同名客户 ID 不代表同一身份体系。</p></template>
<template id="detail-rule"><p class="dialog-intro">业务口径保存可验证的判定条件，回答“哪些记录符合业务定义”。</p><table class="definition-table"><tbody><tr><th scope="row">名称 / 适用对象</th><td>老客户 / 客户。</td></tr><tr><th scope="row">结构化判定</th><td>引用“客户.首次有效支付日期”，运算符为小于，右侧参数为“统计期起点”。</td></tr><tr><th scope="row">参数与范围</th><td>统计期起点由本次问题传入；业务域、适用场景与有效期须明确。</td></tr><tr><th scope="row">缺失处理</th><td>未知首次有效支付日期不自动纳入。首次日期是同一有效订单口径下的全历史属性。</td></tr><tr><th scope="row">其他口径</th><td>有效订单另行保存状态、退款及排除条件，须经业务确认，不能由模型猜测。</td></tr></tbody></table><p class="detail-note">口径引用业务成员，不保存多张候选客户表的列表。定义与实现均需确认后发布，本图中的判定仅用于案例说明。</p></template>
<template id="detail-metric"><p class="dialog-intro">指标保存聚合与公式，回答“怎么算”。本例中的客单价按订单数计算。</p><table class="definition-table"><tbody><tr><th scope="row">指标</th><td>客单价，单位：元/单。</td></tr><tr><th scope="row">基础聚合</th><td>实付总金额：订单.实付金额求和。有效订单数：订单.订单 ID 去重计数，并应用有效订单口径。</td></tr><tr><th scope="row">派生公式</th><td>实付总金额 ÷ 有效订单数。分子分母应用相同的业务条件与查询范围。</td></tr><tr><th scope="row">时间角色</th><td>按订单.支付时间统计；具体月份由查询传入，指标不为每个月重复创建。</td></tr><tr><th scope="row">边界规则</th><td>零订单返回空值；货币、退款、有效订单和金额范围均需业务确认。</td></tr></tbody></table><p class="detail-note">“客单价”引入订单侧计算，客户侧数据由问题中的区域与老客户条件引入。不能仅凭指标名称推断客户表。</p></template>
<template id="detail-asset"><p class="dialog-intro">数据资产描述自身的来源、字段映射、键、粒度、时间含义与使用限制。字段映射经过确认、验证后随资产版本发布；跨资产的分析关联由分析模型定义。</p><table class="definition-table"><thead><tr><th scope="col">信息</th><th scope="col">本例</th></tr></thead><tbody><tr><th scope="row">来源与版本</th><td>授权数据源 ID、真实表或视图引用、来源结构版本；展示名为“订单交易数据”“统一客户档案”。</td></tr><tr><th scope="row">订单字段映射</th><td>订单.订单 ID → <code>order_id</code>；订单.统一客户 ID → <code>customer_id</code>；订单.实付金额 → <code>paid_amount</code>；订单.支付时间 → <code>paid_at</code>。</td></tr><tr><th scope="row">客户字段映射</th><td>客户.统一客户 ID → <code>customer_id</code>；客户.当前区域 → <code>region</code>；客户.首次有效支付日期 → <code>first_paid_at</code>，须有全历史加工依据。</td></tr><tr><th scope="row">键与身份</th><td>订单资产保存订单 ID 与客户 ID 的身份含义；客户资产保存统一客户 ID 的身份体系及唯一性证据。源库外键可作为建模依据，不直接等于获准的分析关联。</td></tr><tr><th scope="row">验证与追溯</th><td>字段映射、键与粒度保留来源证据、适用范围及验证状态，纳入资产版本追溯。字段同名不代表同一身份体系，跨资产连接须由模型明确并验证。</td></tr><tr><th scope="row">类型与粒度</th><td>每个字段的数据类型、空值含义和业务解释；订单一行一单，客户一行一客且客户键唯一。</td></tr><tr><th scope="row">限制与证据</th><td>权限、覆盖、刷新、质量限制与真实加工依据。账号表、客户主档、快照表分别调查确认，不能按表名直接认定。</td></tr></tbody></table><p class="detail-note">这些字段是说明性样例，正式使用须绑定真实来源。知识整理不代替仓库清洗，身份合并、去重与全历史首次支付必须有真实加工依据。数据血缘可作为后续接入的补充依据。</p></template>
<template id="detail-model"><p class="dialog-intro">分析模型组织某个分析场景下的数据资产、指标、维度、口径及关联方式。它引用资产自身的数据依据，定义跨资产关联和场景配置，不复制业务明细，也不必为每个问题创建。</p><table class="definition-table"><tbody><tr><th scope="row">场景</th><td>订单分析。支持总客单价、按区域分析、老客户筛选等经过验证的组合。</td></tr><tr><th scope="row">引用</th><td>引用数据资产及其字段映射、键与粒度，同时引用业务对象、指标与口径的稳定 ID 和兼容版本，不重复维护这些定义。</td></tr><tr><th scope="row">关联定义</th><td>订单资产.<code>customer_id</code> 关联客户资产.<code>customer_id</code>，订单到客户为多对一。模型明确连接方式、时间条件、必要过滤及未匹配处理；验证同一身份体系、客户侧唯一、覆盖范围与重复聚合风险，随模型版本发布。同名键或一次 SQL 成功不能证明关联正确。</td></tr><tr><th scope="row">场景选择</th><td>本例选用订单到客户的多对一关联，以“客户当前区域”为维度。“下单时区域”是另一种分析含义，须有历史字段或快照及对应时间关联依据，不能与当前区域混用。</td></tr><tr><th scope="row">固定配置</th><td>基础粒度为订单，默认时间为支付时间；保留业务范围、允许的指标/属性和使用约束。</td></tr><tr><th scope="row">形成方式</th><td>从真实试点、常用报表或 SQL 的复用需求提出草稿，经确认、验证、独立审核后发布。</td></tr><tr><th scope="row">没有模型</th><td>单份已发布数据资产及业务定义足以回答时，可直接规划单资产查询。需要跨资产但缺少适用模型时，先提出模型草稿，经确认、验证、审核和发布后再执行；不能由 AI 猜测 JOIN。</td></tr></tbody></table><p class="detail-note">更换月份、地区或筛选值只改变查询参数，不自动创建模型。模型可覆盖多个问题，但使用前须检查整句需求、适用范围、权限与版本。</p></template>
<template id="detail-query"><p class="dialog-intro">说明性问题：上个月，华东地区老客户的客单价是多少？本例把“上个月”固定为 2026 年 8 月。</p><div class="detail-step"><b>01</b><div><strong>先展开业务需求</strong><p>客单价引入金额、订单 ID 和支付时间；华东引入客户当前区域；老客户引入全历史首次有效支付日期。</p></div></div><div class="detail-step"><b>02</b><div><strong>依据数据资产定位字段</strong><p>读取已发布数据资产的字段映射：订单属性对应订单交易数据，客户属性对应统一客户档案；同时检查各资产的键、粒度与适用范围。不是根据“客单价”名称猜客户表。</p></div></div><div class="detail-step"><b>03</b><div><strong>通过分析模型确定跨资产关联</strong><p>本例同时使用订单和客户两份资产，不能走单资产查询路径。采用已发布的“订单分析”模型：按统一客户 ID 多对一关联，按支付时间统计，使用客户当前区域。缺少适用模型时先提出模型草稿，经确认、验证、审核和发布后再执行；区域含义不明确时先澄清。</p></div></div><div class="detail-step"><b>04</b><div><strong>校验后生成 SQL，在源端只读执行</strong><p>采用有效订单规则、支付时间 [2026-08-01, 2026-09-01)、客户当前区域为华东，以及首次有效支付早于 2026-08-01。执行前核对整个计划的口径、版本、连接粒度、重复聚合风险、权限与预算。</p></div></div><div class="detail-step"><b>05</b><div><strong>返回结果与依据</strong><p>合成案例中纳入 3 笔订单，实付金额 600 元，客单价 200 元/单。返回业务定义、数据资产及所用分析模型的版本、SQL 与参数和执行记录；其他无需模型的单资产查询保留查询计划及其资产依据。</p></div></div><p class="detail-note">这是设计说明，不提供真实取数功能。SQL 按本次查询计划生成；知识保存定义与规则，不为每个问题预存一条 SQL。讲解中的已发布状态是目标条件，不代表当前工作区已完成真实业务验收。</p></template>

<script>
(() => {
  const W = 1800, MIN_ZOOM = .2, MAX_ZOOM = 2;
  const byId = id => document.getElementById(id);
  const viewport = byId('viewport');
  const sheet = byId('sheet');
  const map = byId('map');
  const dialog = byId('detail-dialog');
  const detailTitles = {object:'业务对象：身份、粒度与属性',rule:'业务口径：定义与判定条件',metric:'指标：聚合与计算公式',asset:'数据资产：来源、字段映射与键粒度',model:'分析模型：跨资产关联与场景配置',query:'从一个问题到取数结果'};
  const camera = {x:0, y:0, zoom:1};
  let size = {w:viewport.clientWidth, h:viewport.clientHeight};
  let height = map.offsetHeight;
  let fitMode = 'width';
  let frame = 0;
  let drag = null;
  let gesture = null;
  let toastTimer;
  const clamp = (n, low, high) => Math.max(low, Math.min(high, n));

  function render() {
    frame = 0;
    constrain();
    sheet.style.transform = `translate3d(${camera.x}px,${camera.y}px,0) scale(${camera.zoom})`;
    byId('zoom-value').textContent = `${Math.round(camera.zoom * 100)}%`;
    byId('zoom-value').setAttribute('aria-label', `缩放比例 ${Math.round(camera.zoom * 100)}%，恢复 100%`);
    byId('zoom-out').disabled = camera.zoom <= MIN_ZOOM;
    byId('zoom-in').disabled = camera.zoom >= MAX_ZOOM;
  }
  function schedule() {
    if (!frame) frame = requestAnimationFrame(render);
  }
  function constrain() {
    // Center axes that fit; larger axes stop at the drawing edge with a small gutter.
    const padding = 32;
    const limit = (position, content, available) => content <= available - padding * 2
      ? (available - content) / 2
      : clamp(position, available - content - padding, padding);
    camera.x = limit(camera.x, W * camera.zoom, size.w);
    camera.y = limit(camera.y, height * camera.zoom, size.h);
  }
  function pan(dx, dy) {
    fitMode = null;
    camera.x += dx;
    camera.y += dy;
    constrain();
    schedule();
  }
  function zoomAt(next, x = size.w / 2, y = size.h / 2) {
    fitMode = null;
    const zoom = clamp(next, MIN_ZOOM, MAX_ZOOM);
    const ratio = zoom / camera.zoom;
    camera.x = x - (x - camera.x) * ratio;
    camera.y = y - (y - camera.y) * ratio;
    camera.zoom = zoom;
    constrain();
    schedule();
  }
  function fit(mode = 'width') {
    fitMode = mode;
    const padding = mode === 'all' ? 24 : 32;
    const widthZoom = (size.w - padding * 2) / W;
    camera.zoom = clamp(mode === 'all' ? Math.min(widthZoom, (size.h - padding * 2) / height) : widthZoom, MIN_ZOOM, 1);
    camera.x = (size.w - W * camera.zoom) / 2;
    camera.y = mode === 'all' ? (size.h - height * camera.zoom) / 2 : padding;
    schedule();
  }
  function point(event) {
    const bounds = viewport.getBoundingClientRect();
    return {x:event.clientX - bounds.left, y:event.clientY - bounds.top};
  }

  viewport.addEventListener('wheel', event => {
    event.preventDefault();
    if (gesture) return;
    const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? size.h : 1;
    if (event.ctrlKey || event.metaKey) {
      const p = point(event);
      zoomAt(camera.zoom * Math.exp(-clamp(event.deltaY * unit, -100, 100) * .008), p.x, p.y);
    } else {
      const dx = event.shiftKey && !event.deltaX ? event.deltaY : event.deltaX;
      const dy = event.shiftKey && !event.deltaX ? 0 : event.deltaY;
      pan(-dx * unit, -dy * unit);
    }
  }, {passive:false});

  // WebKit reports trackpad pinches as GestureEvents instead of Ctrl+wheel.
  viewport.addEventListener('gesturestart', event => {
    event.preventDefault();
    const p = point(event);
    gesture = {zoom:camera.zoom, x:(p.x - camera.x) / camera.zoom, y:(p.y - camera.y) / camera.zoom};
  }, {passive:false});
  viewport.addEventListener('gesturechange', event => {
    event.preventDefault();
    if (!gesture) return;
    const p = point(event);
    fitMode = null;
    camera.zoom = clamp(gesture.zoom * event.scale, MIN_ZOOM, MAX_ZOOM);
    camera.x = p.x - gesture.x * camera.zoom;
    camera.y = p.y - gesture.y * camera.zoom;
    constrain();
    schedule();
  }, {passive:false});
  viewport.addEventListener('gestureend', event => {
    event.preventDefault();
    gesture = null;
  }, {passive:false});

  viewport.addEventListener('pointerdown', event => {
    if (event.button !== 0 || !event.isPrimary || event.target.closest('button,a')) return;
    event.preventDefault();
    viewport.focus({preventScroll:true});
    drag = {id:event.pointerId, x:event.clientX, y:event.clientY};
    viewport.setPointerCapture(event.pointerId);
    viewport.classList.add('is-dragging');
  });
  viewport.addEventListener('pointermove', event => {
    if (!drag || event.pointerId !== drag.id) return;
    pan(event.clientX - drag.x, event.clientY - drag.y);
    drag.x = event.clientX;
    drag.y = event.clientY;
  });
  function endDrag() {
    const id = drag?.id;
    drag = null;
    viewport.classList.remove('is-dragging');
    if (id !== undefined && viewport.hasPointerCapture(id)) viewport.releasePointerCapture(id);
  }
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);
  viewport.addEventListener('lostpointercapture', endDrag);
  window.addEventListener('blur', () => { endDrag(); gesture = null; });

  byId('zoom-out').addEventListener('click', () => zoomAt(camera.zoom / 1.2));
  byId('zoom-in').addEventListener('click', () => zoomAt(camera.zoom * 1.2));
  byId('zoom-value').addEventListener('click', () => zoomAt(1));
  byId('fit-width').addEventListener('click', () => fit('width'));
  byId('fit-all').addEventListener('click', () => fit('all'));
  viewport.addEventListener('keydown', event => {
    if (event.target !== viewport || event.ctrlKey || event.metaKey || event.altKey) return;
    const step = event.shiftKey ? 240 : 72;
    const actions = {
      ArrowLeft:() => pan(step, 0), ArrowRight:() => pan(-step, 0),
      ArrowUp:() => pan(0, step), ArrowDown:() => pan(0, -step),
      PageUp:() => pan(0, size.h * .8), PageDown:() => pan(0, -size.h * .8),
      '+':() => zoomAt(camera.zoom * 1.2), '=':() => zoomAt(camera.zoom * 1.2),
      '-':() => zoomAt(camera.zoom / 1.2), '0':() => fit('all'),
      '1':() => zoomAt(1), Home:() => fit('width'),
      End:() => { fitMode = null; camera.y = size.h - height * camera.zoom - 32; schedule(); }
    };
    if (actions[event.key]) { event.preventDefault(); actions[event.key](); }
  });
  viewport.addEventListener('focusin', event => {
    if (!event.target.matches('[data-detail],a[href]')) return;
    const item = event.target.getBoundingClientRect();
    const view = viewport.getBoundingClientRect();
    const dx = item.left < view.left + 24 ? view.left + 24 - item.left : item.right > view.right - 24 ? view.right - 24 - item.right : 0;
    const dy = item.top < view.top + 24 ? view.top + 24 - item.top : item.bottom > view.bottom - 24 ? view.bottom - 24 - item.bottom : 0;
    if (dx || dy) pan(dx, dy);
  });

  document.querySelectorAll('[data-detail]').forEach(button => button.addEventListener('click', () => {
    // Native dialog focus restoration also needs an explicit trigger on Safari.
    button.focus({preventScroll:true});
    byId('detail-title').textContent = detailTitles[button.dataset.detail];
    byId('detail-content').replaceChildren(byId(`detail-${button.dataset.detail}`).content.cloneNode(true));
    dialog.showModal();
    dialog.scrollTop = 0;
    byId('close-detail').focus({preventScroll:true});
  }));
  byId('close-detail').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => {
    if (event.target !== dialog) return;
    const rect = dialog.getBoundingClientRect();
    if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
  });
  byId('fullscreen').addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch {
      byId('status').textContent = '当前浏览器无法切换全屏';
      byId('status').classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => byId('status').classList.remove('visible'), 3500);
    }
  });
  document.addEventListener('fullscreenchange', () => {
    const active = !!document.fullscreenElement;
    byId('fullscreen').setAttribute('aria-pressed', String(active));
    byId('fullscreen').setAttribute('aria-label', active ? '退出全屏' : '全屏');
    byId('fullscreen').title = active ? '退出全屏' : '全屏';
  });

  function box(selector) {
    const node = typeof selector === 'string' ? document.querySelector(selector) : selector;
    let x = 0, y = 0, parent = node;
    while (parent && parent !== map) {
      x += parent.offsetLeft;
      y += parent.offsetTop;
      parent = parent.offsetParent;
    }
    return {x, y, w:node.offsetWidth, h:node.offsetHeight, cx:x + node.offsetWidth / 2, cy:y + node.offsetHeight / 2};
  }
  function drawWires() {
    height = map.offsetHeight;
    const wires = document.querySelector('.wires');
    wires.setAttribute('viewBox', `0 0 ${W} ${height}`);
    wires.querySelectorAll(':scope > path').forEach(path => path.remove());
    function path(d, type = '', arrow = true) {
      const node = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      node.setAttribute('class', `wire ${type}`);
      node.setAttribute('d', d);
      if (!arrow) node.style.markerEnd = 'none';
      wires.append(node);
    }
    const headings = [...document.querySelectorAll('.stage-heading b')].map(box);
    headings.slice(0, -1).forEach((b, i) => path(`M${b.cx} ${b.y + b.h + 12}V${headings[i + 1].y - 12}`, 'spine'));
    const process = [...document.querySelectorAll('.process-node')].map(box);
    process.slice(0, -1).forEach((b, i) => path(`M${b.x + b.w + 7} ${b.cy}H${process[i + 1].x - 7}`));
    const cards = [...document.querySelectorAll('.knowledge')].map(box);
    const published = process.at(-1);
    const busY = cards[0].y - 20;
    path(`M${published.cx} ${published.y + published.h}V${busY}`, 'publish', false);
    path(`M${cards[0].cx} ${busY}H${cards.at(-1).cx}`, 'publish', false);
    cards.forEach(b => path(`M${b.cx} ${busY}V${b.y - 6}`, 'publish'));
    const publishLabel = byId('publish-label');
    publishLabel.style.left = `${published.cx + 12}px`;
    publishLabel.style.top = `${busY - 46}px`;
    const knowledge = box('.stage--knowledge'), plan = box('.plan-node');
    const readX = plan.x + plan.w * .64;
    path(`M${readX} ${knowledge.y + knowledge.h + 8}V${plan.y - 8}`, 'publish');
    const readLabel = byId('read-label');
    readLabel.style.left = `${readX + 12}px`;
    readLabel.style.top = `${(knowledge.y + knowledge.h + plan.y) / 2 - 12}px`;
    const question = box('.question-node'), sql = box('.sql-node'), evidence = box('.evidence');
    path(`M${question.x + question.w + 7} ${question.cy}H${plan.x - 7}`);
    path(`M${plan.x + plan.w + 7} ${sql.cy}H${sql.x - 7}`);
    path(`M${sql.cx} ${sql.y + sql.h + 6}V${evidence.y - 8}`, 'publish');
    const feedback = box('.feedback-chip');
    path(`M${evidence.x + evidence.w + 12} ${evidence.cy}H1764V${feedback.cy}H${feedback.x + feedback.w + 8}`, 'feedback');
  }
  new ResizeObserver(() => {
    const next = {w:viewport.clientWidth, h:viewport.clientHeight};
    if (next.w === size.w && next.h === size.h) return;
    const previous = size;
    size = next;
    if (fitMode) fit(fitMode);
    else {
      camera.x += (next.w - previous.w) / 2;
      camera.y += (next.h - previous.h) / 2;
      constrain();
      schedule();
    }
  }).observe(viewport);
  new ResizeObserver(() => {
    drawWires();
    if (fitMode) fit(fitMode);
    else { constrain(); schedule(); }
  }).observe(map);
  drawWires();
  fit('width');
})();
</script>
</body>
</html>
