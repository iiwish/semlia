forbidden_changes:
  - No timer-generated progress, fabricated logs, or fixture fallback after a real API failure.
  - No active-index writes before complete validation; cancellation and failed generations never activate.
  - No embedding similarity override of release membership, authorization, deterministic matching or refusal.
  - No provider keys, raw provider errors or hidden source secrets in logs, events or responses.
  - No edits to migrations 000001-000018, or migration 000020/000021.
  - No disabling tests, widening quotas, deleting user data, or claiming hosted proof from stubs.
  - Local-UAT capability parity may expose only the workspace.manage action already granted to the development author alias by the server evaluator; production identity and reviewer/publisher separation remain unchanged.

tdd_plan:
  red:
    - Add regressions for immutable corpus/model pinning, mixed dimensions and incomplete activation.
    - Test checkpoint replay, lease loss, cancellation, provider failure and concurrent rebuild intent.
    - Test active retrieval authorization and release filtering, plus explicit lexical fallback.
    - Test real Web API state, hard-reload progress, no configuration, denial and terminal failures.
  green:
    - Add migration, typed repository, provider port, job handler and bounded API contracts.
    - Wire generation into Operations, composition and the existing model settings surface.
  refactor:
    - Regenerate contracts/sqlc and synchronize the embedded Web only after source tests pass.

validation_loop:
  resource_policy: >-
    Use go test -p 1 or GOFLAGS=-p=1 for database-heavy gates on this host. Do not stop other
    projects' containers or weaken test assertions to compensate for resource contention.
  commands:
    - go test -p 1 ./internal/domain/embedding/... ./internal/application/embedding/... ./internal/adapters/embedding/...
    - go test -p 1 ./tests/integration/embedding/... ./tests/integration/db/...
    - pnpm --dir web typecheck
    - pnpm --dir web test
    - pnpm --dir web lint
    - make contracts-check
    - make db-generate-check
    - GOFLAGS=-p=1 make check-source
    - git diff --check
  proof:
    - Populated migration 18-to-19 up/down/up preserves previous domain state.
    - Configured pgvector integration proves vector storage and active retrieval, not a mocked repository.
    - Missing pgvector/provider configuration remains an explicit unavailable capability.
    - Worker restart resumes checkpoints; failed or cancelled work preserves the previous active pointer.
    - Same-content reuse does not mix provider/model/dimension identities.
    - Both 1440x900 and 1024x768 have keyboard/focus, empty/error and real progress evidence.
    - Live provider execution is separate from deterministic transport-stub evidence.

