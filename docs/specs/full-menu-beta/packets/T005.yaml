work_unit:
  title: Persistent embedding-index rebuild and active retrieval
  goal: >-
    Replace browser-only embedding progress with one durable, checkpointed generation pipeline.
    Pin canonical corpus, model and dimension; validate completeness; atomically activate the new
    index while failed or cancelled generations leave the old index serving. A real search or
    resolver candidate path must consume the active index without bypassing released semantics.
  story: FMB-US-005
  requirements: [FR-001, FR-007, NFR-001, NFR-002, NFR-003, NFR-004, NFR-005]
  depends_on: [FMB-T003 evidence, FMB-T004 shared-file handoff]
  blocks: [FMB-T007]
  parallel: false

codebase_context:
  relevant_files:
    - internal/application/governance/modelconfig.go
    - internal/application/governance/llm/client.go
    - internal/application/distribution/service.go
    - internal/adapters/postgres/distribution.go
    - internal/application/jobs/worker.go
    - internal/adapters/postgres/operations.go
    - internal/platform/http/modelconfig.go
    - cmd/semlia/main.go
    - web/src/ModelConfigurationView.tsx
    - web/src/ProductApp.tsx
  existing_patterns:
    - Model providers/settings and default selections already persist through governance APIs.
    - Provider credentials resolve from deployment environment names, never from recovered plaintext.
    - Jobs have leases, heartbeat renewal, retries and terminal owning-domain projections.
    - Operations runtime runs/events are authoritative projections; they must not expose provider payloads.
    - Distribution reads immutable released snapshots; exact matching and authorization remain authoritative.
    - Pgvector-unavailable deployments preserve lexical retrieval and report rebuild as not configured.
  preflight_decisions:
    - Add a small EmbedBatch port; the existing Complete-only LLM client is not an embedding implementation.
    - Pin provider, endpoint, model, dimension, credential/config revision and chunking version in the generation; active query vectors use this snapshot, not mutable defaults.
    - Validate provider result cardinality, item indexes, dimensions and finite numbers without exposing response bodies.
    - Capture immutable corpus membership at enqueue; paginating mutable current assets is not a snapshot.
    - Begin with bounded workspace/generation-filtered exact pgvector recall; complex ANN tuning is not required.
    - Embedding owns cancellation and terminal projections; every checkpoint and activation checks generation state and the current job lease.
    - Incompatible pinned releases use lexical fallback; no similarity score overrides exact revisions, current access checks or deterministic refusal.

