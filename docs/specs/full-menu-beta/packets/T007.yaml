forbidden_changes:
  - No arbitrary SQL, best-effort join approximation or client-controlled identifiers.
  - No bypass of release freshness, authorization or credential revocation for idempotent replay.
  - No query execution using a privileged discovery credential by default.
  - No storage or telemetry of compiled SQL, bound values, returned rows or raw database diagnostics.
  - No edits to migrations 000001-000020; preserve populated upgrade and rollback paths.
  - No production local-UAT identities, disabled security tests or claims that stubs prove hosted operation.

tdd_plan:
  red:
    - Refuse raw SQL, tampered or stale plans, unsupported joins, cross-workspace and revoked access before connection.
    - Exercise real read-only role and transaction behavior, cancellation, timeout, row and byte caps.
    - Prove concurrent identical requests and process loss cannot create duplicate execution.
    - Scan stored records, audit, usage, errors and runtime events for synthetic sensitive result values.
  green:
    - Implement typed aggregate compiler with trusted identifier quoting and bound values.
    - Add migration, durable run metadata, bounded result handling and current authorization checks.
    - Wire REST, MCP, CLI, SDK and Ask/Operations views through the same application service.
  refactor:
    - Regenerate contracts and SQL; synchronize embedded Web after source tests pass.

validation_loop:
  resource_policy: Use go test -p 1 or GOFLAGS=-p=1 and Vitest --maxWorkers=1 on this host; never stop unrelated containers.
  commands:
    - go test -p 1 ./internal/domain/execution/... ./internal/application/execution/... ./internal/adapters/execution/...
    - go test -p 1 ./tests/integration/... ./tests/contracts/...
    - pnpm -r --if-present typecheck
    - pnpm -r --if-present test
    - make contracts-check
    - make db-generate-check
    - GOFLAGS=-p=1 make check-source
    - make smoke
    - make security-check
    - make release
    - git diff --check
  proof:
    - Populated migration 15-to-21 lifecycle preserves previous domains and exposes no raw result store.
    - Actual PostgreSQL read-only, timeout, cancellation, row/byte cap and authorization evidence.
    - Desktop 1440x900 and compact desktop 1024x768 live paths, keyboard and focus evidence.
    - Truthfulness inventory covers all production menu successes, refresh and restart persistence.
    - Real hosted HTTPS, OIDC, Chat, Embedding, external webhook and read-only source results are separate gates.
    - Build version, migration version, release checksums and SBOM match the tested artifact.

evidence_contract:
  summary: docs/evidence/FMB-T007/attempts/a002/summary.md
  test_results: docs/evidence/FMB-T007/attempts/a002/test-results.md
  attempt: docs/evidence/FMB-T007/attempts/sprint-a002.md
  required: [changed files, RED/GREEN results, migration proof, security proof, channel parity, desktop evidence, hosted matrix, residual risks]

review_contract:
  required_passes: [spec_compliance, bug_code_quality, security_privacy, qa_acceptance]
  acceptance_rule: Recommend acceptance only with complete evidence; Accepted remains founder-owned.

stop_conditions:
  - Any dependency lacks passing review evidence or still owns shared implementation files.
  - Required behavior relaxes read-only, privacy, authorization or release-pinning invariants.
  - Missing external configuration blocks hosted proof; continue independent local verification and report the exact gap.
  - No feature expansion during authorized overtime; fix final QA findings and verify exact candidate.
  - Missing hosted inputs remain explicit; do not authorize external deployment implicitly.
