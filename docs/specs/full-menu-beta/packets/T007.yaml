  contracts:
    - Canonical persisted plan ID and digest are the public input; raw SQL is never accepted.
    - Exact release-pinned physical metadata, supported expressions and join contracts enter the digest.
    - semantic.execute and current workspace, credential, consumer, binding and resource scope precede compilation or connection.
    - Current mutable catalog objects cannot substitute for release-pinned physical snapshots.
    - Dedicated source execution credentials remain encrypted or deployment referenced, never response data.
    - Runtime and audit retain only redacted provenance, counts, outcome and result digest, not fact rows or SQL values.

