work_unit:
  title: Bounded read-only PostgreSQL execution and final Beta evidence
  goal: >-
    Execute persisted validated plans through a dedicated read-only PostgreSQL adapter, then
    integrate the complete desktop and machine workflow. Report deterministic and hosted evidence
    separately. Missing external configuration cannot become a fabricated successful release gate.
  story: FMB-US-007
  requirements: [FR-001, FR-011, FR-012, NFR-001, NFR-002, NFR-003, NFR-004, NFR-005]
  depends_on: [FMB-T002 evidence, FMB-T004 evidence, FMB-T005 evidence, FMB-T006 evidence]
  parallel: false

