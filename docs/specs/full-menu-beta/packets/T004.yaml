    - cmd/semlia/main.go
    - web/src/JourneyViews.tsx
    - web/src/JourneyViews.test.tsx
    - web/src/LiveSourcesView.tsx
  existing_patterns:
    - Discovery creates an exact run and leased job before a worker writes snapshots, findings and candidates.
    - Versioned SQL paths are relative to a configured root and reject traversal and symlink escape.
    - dbt adapters validate supported manifest/catalog schemas rather than accepting arbitrary JSON.
    - T003 owns normalized runtime visibility; T004 links owning ingestion records to that projection.
  storage_and_schedule_contract:
    - ArtifactStore keys are workspace-scoped content digests; temporary host paths never become durable references.
    - Local Beta uses a shared mounted volume and hosted Beta uses a shared object-store adapter with identical semantics.
    - Hosted storage is S3-compatible, uses the standard AWS credential chain and accepts only server-generated workspace/digest keys.
    - File type is proven by extension, declared MIME and magic; parser limits are enforced before canonical writes.
    - Schedules store expression, IANA timezone, misfire policy, enabled state, next/last occurrence and optimistic version.
    - UNIQUE schedule plus scheduled_for occurrence and a stable enqueue idempotency key prevent duplicate authoritative runs.
    - Raw uploads are capped at 50 MiB; archive expansion is capped at 200 MiB, 4,096 entries, 50 MiB per entry and 100:1 ratio.
    - A workspace may retain at most 10,000 active artifact objects and 5 GiB of deduplicated artifact bytes; quota reservation and digest deduplication are concurrency-safe.
    - CSV/XLSX limits are 64 sheets, 250,000 rows, 512 columns, 5,000,000 cells and 1 MiB per cell; Markdown is capped at 10 MiB with a bounded AST.
    - Any spreadsheet formula, macro, encryption, OLE/ActiveX object, external relationship or unsafe archive entry rejects the workbook.
    - SQL uses configured-root registration only; dbt uses staged manifest.json plus optional catalog.json upload.
    - Spring-forward gaps skip; fall-back repeated wall minutes run once at the earlier offset using a stored wall-clock key.
    - Overlap produces terminal OVERLAP_ACTIVE_RUN; source or credential unavailability produces stable skipped reasons.
    - Finalize creates an immutable ordered artifact set and enqueue pins that exact set to the discovery run; successful source revisions copy the pins without re-reading a mutable source.
    - Long ingestion handlers renew job leases at most every lease/3 and abort before canonical commit if the lease or context is lost.

