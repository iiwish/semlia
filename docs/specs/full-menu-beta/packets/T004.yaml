    - Globs cover new bounded modules, type-specific parser tests and generated artifacts only.
    - The worker does not edit plan.md, tasks.md, packets or another task's evidence.
    - Existing PostgreSQL source and discovery behavior must remain compatible.
    - An authorized empty workspace still mounts the product shell so Sources can create the first durable input; catalog emptiness is an Assets-view state, not an application gate.
    - The fresh-clone topology assertion includes the one additional shared artifact-data volume required by server and worker, raising the canonical local Compose volume count from two to three without widening service topology.
    - Ingestion run presentation reuses the T003 Operations authority and does not create a browser-only run model.
    - Artifact, artifact-set, schedule and occurrence audit events extend the T003 allowlisted target projector and safe-detail fields so they remain filterable without exposing raw content or storage keys.
    - Enqueue pins the exact finalized artifact identities to the discovery run; workers never resolve mutable current source artifacts after lease acquisition.
    - Long parser work renews its job lease and observes cancellation before canonical commit so a reaped job cannot commit concurrently.

forbidden_changes:
  - Do not accept executable content, macros, encrypted workbooks, Markdown HTML execution or spreadsheet formula evaluation.
  - Do not trust file names, client MIME, ZIP entry paths, artifact paths or dbt schema declarations.
  - Do not store browser/server temporary paths as authoritative artifact locators.
  - Do not read outside configured roots, follow symlinks, permit archive bombs or bypass row/cell/document/byte limits.
  - Do not let schedule replay, DST, restart or concurrent schedulers enqueue duplicate authoritative occurrences.
  - Do not log or audit raw file contents, spreadsheet cells, source DSNs or credentials.
  - Do not modify migrations 000001 through 000017 or any T005/T006 migration.
  - Do not modify shared files concurrently with T005 or T006.

tdd_plan:
  required: true
  exception: null
  red:
    command: >-
      go test ./internal/application/discovery/... ./internal/application/ingestion/...
      ./internal/adapters/discovery/... ./internal/adapters/artifacts/...
      ./tests/integration/discovery/... ./tests/integration/ingestion/... ./tests/integration/worker/... &&
      pnpm --dir web test -- LiveSources JourneyViews ProductApp
    expected_failure: >-
      Tests prove uploads and schedules are not durable and reject missing safeguards for type/magic,
      traversal, symlinks, archive expansion, parser quotas, dbt versions, DST, overlap and restart.
  green:
    command: >-
      go test ./internal/application/discovery/... ./internal/application/ingestion/...
      ./internal/adapters/discovery/... ./internal/adapters/artifacts/...
      ./tests/integration/discovery/... ./tests/integration/ingestion/... ./tests/integration/worker/... &&
      pnpm --dir web test -- LiveSources JourneyViews ProductApp
    expected_signal: >-
      Each supported input reaches one durable source revision/run or a stable terminal finding, and
      manual/scheduled execution shares one idempotent application command.
  refactor:
    command: make contracts-check && make db-generate-check && make check-source && git diff --check
    expected_signal: >-
      Generated artifacts are current, readiness expects migration 18, parser boundaries remain
      isolated and no fixture/session-only success path remains.

validation_loop:
  commands:
    - go test ./internal/application/discovery/... ./internal/application/ingestion/... ./internal/application/jobs/... ./internal/adapters/discovery/... ./internal/adapters/artifacts/...
    - go test ./tests/integration/discovery/... ./tests/integration/ingestion/... ./tests/integration/worker/... ./tests/integration/db/...
    - pnpm --dir web test -- LiveSources JourneyViews ProductApp
    - pnpm --dir web lint
    - pnpm --dir web typecheck
    - make contracts-check
    - make db-generate-check
    - make check-source
    - git diff --check
  migration_proof:
    - Empty database reaches migration 18.
    - Populated migration-17 source/run data upgrades, rolls back 18, and reapplies without loss.
    - Readiness requires version 18 while T004 is the execution head.
  security_proof:
    - Adversarial CSV/XLSX/Markdown corpus covers spoofed MIME, macros, formulas, active HTML, encryption, traversal and quota overflow.
    - ZIP entry count and expanded-size limits reject decompression bombs before durable canonical state.
    - SQL/dbt paths reject absolute path, parent traversal, symlink escape and unsupported schema versions.
    - Artifact logs, audit and API responses contain digest/safe metadata only.
  scenario_proof:
    - Upload-to-preview-to-run-to-candidate journey survives hard reload and worker/database restart.
    - Manual and scheduled runs produce equivalent owning records and Operations links.
    - Cron timezone, DST, pause/resume, skip/run_once misfire, concurrent claim and run-now cases are deterministic.
    - Desktop keyboard/focus and screenshots pass at 1440x900 and 1024x768.
  retry_budget: 2
  failure_policy:
    first_failure: Fix only T004 storage, parser, schedule or discovery integration and rerun the smallest failing layer.
    second_failure: Classify dependency, unsafe-input, migration, shared-storage or shared-file ownership blockers.
    beyond_budget: Stop and emit blocked evidence without relaxing quotas, validators, assertions or allowed files.

