review_contract:
  required_passes: [spec_compliance, bug_code_quality, security_privacy, qa_acceptance]
  blocking_findings:
    - Path/symlink/archive/type validation bypass or executable file content
    - Raw content, source secret or temporary-path disclosure
    - Duplicate schedule occurrence or partial canonical write
    - Non-durable hosted artifact ownership
    - Fixture success or shared-file ownership conflict
  acceptance_rule: The orchestrator may mark Needs_Review after all evidence passes; the worker never marks Accepted.

handoff:
  attempt_owner: delegated worker selected after FMB-T003 evidence passes
  next_ready_candidates:
    - FMB-T005 after the artifact/chunk contract passes
    - FMB-T007 only after T002, T005 and T006 also pass
  finish_options: [integrate_and_mark_needs_review, scoped_fix_attempt, blocked_with_named_condition]

stop_conditions:
  - FMB-T003 evidence is missing or has a blocking finding.
  - Migration 000018 or a shared file is owned by another active attempt.
  - Hosted storage cannot provide shared durable ArtifactStore semantics.
  - Required work leaves allowed files or relaxes an approved security boundary.
  - Validation would require fixture fallback, deleted tests, weaker assertions or fabricated evidence.
