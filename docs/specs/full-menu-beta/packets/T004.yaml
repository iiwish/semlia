work_unit:
  title: File, SQL/dbt artifact ingestion and scheduling
  goal: >-
    Make CSV, XLSX, Markdown, versioned SQL and supported dbt ingestion durable and secure through a
    shared content-addressed ArtifactStore, then run the same discovery command manually or from a
    database-backed five-field-cron schedule with occurrence idempotency.
  epic: FMB-E001
  story: FMB-US-004
  requirements: [FR-001, FR-006, NFR-001, NFR-002, NFR-003, NFR-004]
  priority: P1
  depends_on:
    - FMB-T003 Needs_Review or Accepted
  blocks: [FMB-T005, FMB-T007]
  parallel: false
  conflicts_with:
    - FMB-T005 on OpenAPI, generated contracts, jobs, sqlc, readiness, provider/source composition and ProductApp
    - FMB-T006 on OpenAPI, generated contracts, jobs, sqlc, readiness and composition root

