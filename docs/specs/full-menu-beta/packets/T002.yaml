    - web/src/LiveSourcesView.test.tsx
    - web/src/catalogRuntime.tsx
    - web/src/governanceRuntime.tsx
    - docs/evidence/M1-T008/summary.md
  existing_patterns:
    - Catalog assets and revisions own semantic identity and definition state.
    - Governed proposals, validations, reviews and releases retain their existing write models.
    - Immutable release manifests pin exact asset and governance-object versions.
    - Consumer bindings and resolved plans remain release-scoped distribution records.
    - Public collections use stable TypeIDs, workspace authorization and cursor pagination.
  authority_contract:
    - Every rendered asset-detail section identifies its owning revision, release or API authority.
    - Availability is explicit as available, not_configured, not_released, forbidden or failed.
    - Workbench identity and state come from persisted attention_items, not a browser merge or fixture.
    - Workbench rules are deterministic and explainable; no M4 autonomous scoring or remediation is introduced.
    - Opening an attention item deep-links to the same persisted target after refresh and restart.
    - Public Workbench visibility is limited to the confirmed mine, team and initiated scopes; an unscoped view-all contract is not introduced.

