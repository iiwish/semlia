work_unit:
  title: Real workbench, authoritative asset detail and release detail
  goal: >-
    Replace Workbench and knowledge/release fixture enrichment with authorized, cursor-paged reads
    over persisted attention items, catalog revisions, governance objects, validation evidence,
    consumer bindings and immutable release manifests.
  epic: FMB-E001
  story: FMB-US-002
  requirements:
    - FR-001
    - FR-003
    - FR-004
    - NFR-001
    - NFR-003
    - NFR-005
  priority: P1
  depends_on:
    - FMB-T001 Needs_Review or Accepted
    - FMB-T003 Needs_Review or Accepted for runtime_runs and attention_items schema ownership
  blocks:
    - FMB-T007
  parallel: false
  conflicts_with:
    - FMB-T003 when editing api/openapi/semlia.v1.yaml, generated contracts, internal/platform/http/handler.go, web/src/ProductApp.tsx or web/src/styles.css
    - FMB-T006 when editing api/openapi/semlia.v1.yaml, generated contracts or web/src/ProductApp.tsx

