  ownership_notes:
    - FMB-T002 owns no migration and must not revise migration 000017 created by FMB-T003.
    - Existing records are reconciled through a bounded, explicit application command or owning-write hook; GET handlers remain side-effect free.
    - Startup wiring may invoke a bounded, restart-safe reconcile; runtime and discovery owners may maintain attention projection atomically with their terminal writes.
    - Attention items use a dedicated typed identity and wire prefix; they must not reuse audit-event identity.
    - Review-batch transition ownership is included so attention resolution remains atomic with batch rejection; catalog domain DTOs carry typed authority facts; focused governance regression tests and generated embedded Web assets are task-owned consequences of the stable contract.
    - Workbench list rows and counts share one read-only authorization snapshot; at most one request-level authorization decision is audited, never one write per row.
    - Globs cover focused module tests and generated sqlc output because generator filenames are tool-controlled.
    - The worker does not edit plan.md, tasks.md, packets or unrelated fixtures.

forbidden_changes:
  - Do not synthesize owners, releases, bindings, validation, trust, lineage, deadlines or impact from fixtures or plausible defaults.
  - Do not read mutable current objects where an immutable release-manifest version is required.
  - Do not create a second proposal, review, validation, release or runtime write model.
  - Do not let client-side capability state authorize Workbench actions.
  - Do not expose unauthorized or cross-workspace target existence through counts, filters, links or errors.
  - Do not omit idempotency from Workbench mutations or implement search as a browser-only filter.
  - Do not copy authorization policy into Workbench SQL or perform audited authorization evaluation once per returned row.
  - Do not add M4 autonomous priority scoring, proposal generation, publish, rollback or remediation.
  - Do not edit migrations or implement FMB-T003/FMB-T006 behavior.
  - Do not modify shared conflict files while FMB-T003 or FMB-T006 owns them.

tdd_plan:
  required: true
  exception: null
  red:
    command: >-
      go test ./internal/application/catalog/... ./internal/application/governance/...
      ./internal/application/projection/... ./internal/platform/http/...
      ./tests/integration/catalog/... ./tests/integration/governance/... ./tests/integration/projection/... &&
      pnpm --dir web test -- ProductApp Catalog KnowledgeViews
    expected_failure: >-
      Tests expose fixture Workbench rows, synthetic asset-detail fields, mutable release leakage,
      missing cursor/authorization behavior and deep links that do not survive reload.
  green:
    command: >-
      go test ./internal/application/catalog/... ./internal/application/governance/...
      ./internal/application/projection/... ./internal/application/workbench/...
      ./internal/platform/http/... ./tests/integration/catalog/... ./tests/integration/governance/...
      ./tests/integration/projection/... && pnpm --dir web test -- ProductApp Catalog KnowledgeViews
    expected_signal: >-
      Workbench and detail tests pass using persisted, workspace-authorized records with explicit
      authority/availability states and immutable release identities.
  refactor:
    command: make contracts-check && make db-generate-check && make check-source && git diff --check
    expected_signal: >-
      Generated artifacts are current, bounded projections remain green and fixture authority has
      not returned through shared Web adapters.

validation_loop:
  commands:
    - go test ./internal/application/catalog/... ./internal/application/governance/... ./internal/application/projection/... ./internal/application/workbench/... ./internal/platform/http/...
    - go test ./tests/integration/catalog/... ./tests/integration/governance/... ./tests/integration/projection/... ./tests/integration/db/...
    - pnpm --dir web test -- ProductApp Catalog KnowledgeViews
    - pnpm --dir web lint
    - pnpm --dir web typecheck
    - make contracts-check
    - make db-generate-check
    - make check-source
    - git diff --check
  scenario_proof:
    - Cursor pagination and server totals on a 10,000-asset reference dataset.
    - Mine/team/initiated filters with separate authorized principals and SoD-sensitive actions.
    - Asset sections in available, not_configured, not_released, forbidden and failed states.
    - Release manifest detail remains pinned across publish and rollback.
    - Attention-item assignment, dismissal and owning-condition resolution survive restart and are idempotent.
    - Keyboard, focus, reduced motion and screenshots at 1440x900 and 1024x768.
  retry_budget: 2
  failure_policy:
    first_failure: Fix only the failing projection, contract or Web binding owned by FMB-T002, then rerun the smallest layer.
    second_failure: Classify a dependency, schema, authority or shared-file ownership blocker and return it to the orchestrator.
    beyond_budget: Stop and produce blocked evidence without weakening assertions, restoring fixtures or widening scope.

evidence_contract:
  summary: docs/evidence/FMB-T002/summary.md
  diff: docs/evidence/FMB-T002/diff.patch
  test_results: docs/evidence/FMB-T002/test-results.md
  required:
    - Dependency and shared-file ownership preflight
    - Exact changed-files inventory
    - RED/GREEN/REFACTOR results
    - Projection source-to-rendered-field authority map
    - Cursor, authorization, cross-workspace and immutable-release results
    - Restart/deep-link and 10,000-asset query evidence
    - Desktop accessibility screenshots at both supported viewports
    - Diff summary and residual risks

review_contract:
  required_passes:
    - spec_compliance
    - bug_code_quality
    - authorization_privacy
    - qa_acceptance
  blocking_findings:
    - Any fixture or synthesized canonical fact
    - Any mutable record substituted for a release-pinned version
    - Any cross-workspace existence leak or client-authorized action
    - Any unbounded collection or unstable deep link
    - Any shared-file edit concurrent with FMB-T003 ownership
  acceptance_rule: >-
    The orchestrator may advance FMB-T002 to Needs_Review only after all evidence and review passes;
    the worker never marks it Accepted.

handoff:
  attempt_owner: delegated worker selected after dependencies pass
  external_issue: null
  pull_request: null
  next_ready_candidates:
    - FMB-T007 only after FMB-T004, FMB-T005 and FMB-T006 also reach Needs_Review or Accepted
  finish_options:
    - integrate reviewed evidence and mark Needs_Review
    - create FMB-T002-A002 for scoped fixes
    - mark Blocked with the named dependency or ownership condition

stop_conditions:
  - FMB-T001 or FMB-T003 dependency evidence is missing or has a blocking review finding.
  - Another active task owns a shared OpenAPI, generated, HTTP, ProductApp or styles file.
  - Migration 000017 does not provide the confirmed attention/runtime storage contract.
  - Relevant existing changes cannot be preserved safely.
  - Required work leaves the allowed files or changes a confirmed authority boundary.
  - Validation requires fixture fallback, deleted tests, weakened assertions or fabricated evidence.
