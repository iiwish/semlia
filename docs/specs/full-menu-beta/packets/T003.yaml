    - internal/application/usage/service.go
    - internal/adapters/postgres/store.go
    - internal/adapters/postgres/usage.go
    - internal/platform/http/handler.go
    - cmd/semlia/main.go
    - cmd/semlia/readiness.go
    - web/src/AuditRuntimeView.tsx
    - web/src/ProductApp.tsx
  existing_patterns:
    - Audit events are immutable attributable facts; usage and OpenTelemetry have separate responsibilities.
    - Jobs use leases, attempts, idempotency keys and terminal state; outbox delivery is a separate queue.
    - Domain-specific discovery, validation, Agent and semantic records remain payload authority.
    - HTTP lists use workspace authorization, stable TypeIDs and bounded pagination.
    - Deployment-owned trust settings are read from configuration and are not mutable workspace data.
  runtime_projection_contract:
    - Runtime kind includes semantic_resolution for the persisted semantic_queries owner; query validation may project as a validation subtype.
    - runtime_runs normalizes source type/id, nullable job and trace links, idempotency, requester, attempts, state, phase, progress, timestamps and redacted error metadata with a source-version digest.
    - runtime_run_events is append-only, monotonically sequence ordered and bounded; it stores only safe redacted fields and never copies raw job payloads or provider bodies.
    - Runtime write ownership remains in the originating domain; projection updates are idempotent.
    - Retry and cancellation are advertised only when the owning handler implements safe semantics.
    - runtime_settings contains only retry ceiling, statement/webhook timeout, query row/byte limits and run-metadata retention as bounded future-run defaults.
    - Worker concurrency, OTel endpoints, OIDC, encryption roots and audit retention remain deployment-owned and read-only in Web.
    - audit_exports stores bounded export metadata and artifact identity; export content is generated from the same authorized redacted filter as Audit list.
    - Migration 000017 also creates the confirmed attention_items storage contract, including initiator_principal_id and rule_version; FMB-T002 owns its rules, API and UI behavior.

