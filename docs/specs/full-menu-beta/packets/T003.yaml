work_unit:
  title: Audit and Runtime common foundation
  goal: >-
    Add a redacted, cursor-paged Audit contract plus normalized durable Runtime runs/events and
    bounded workspace runtime settings so later ingestion, embedding, webhook and execution work is
    observable without exposing internal job/outbox payloads or replacing domain write models.
  epic: FMB-E001
  story: FMB-US-003
  requirements:
    - FR-001
    - FR-004
    - FR-005
    - NFR-001
    - NFR-002
    - NFR-003
    - NFR-004
  priority: P0
  depends_on:
    - FMB-T001 Needs_Review or Accepted
  blocks:
    - FMB-T002
    - FMB-T004
    - FMB-T005
    - FMB-T006
  parallel: false
  conflicts_with:
    - FMB-T002 when editing api/openapi/semlia.v1.yaml, generated contracts, internal/platform/http/handler.go, web/src/ProductApp.tsx or web/src/styles.css
    - FMB-T004 through FMB-T006 when editing jobs, worker routing, sqlc output, readiness or shared Operations contracts

codebase_context:
  local_instructions:
    - AGENTS.md
  relevant_files:
    - api/openapi/semlia.v1.yaml
    - migrations/000001_m0_foundation.up.sql
    - migrations/000004_usage_events.up.sql
    - db/queries/audit.sql
    - db/queries/discovery.sql
    - db/queries/distribution.sql
    - db/queries/governance.sql
