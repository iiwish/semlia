    - Audit paging/export/authorization and redaction results
    - Run projection idempotency, retry/cancel and restart results
    - Runtime-settings version and deployment-owned boundary results
    - Desktop accessibility screenshots at both supported viewports
    - Diff summary and residual risks

review_contract:
  required_passes:
    - spec_compliance
    - bug_code_quality
    - security_privacy
    - qa_acceptance
  blocking_findings:
    - Any secret, prompt, fact row or raw job/outbox payload disclosure
    - Any mutable application audit path
    - Any invented run fact or unsupported retry/cancel success
    - Any deployment trust setting writable by a workspace command
    - Any duplicate or non-recoverable runtime projection
    - Any shared-file edit concurrent with FMB-T002 ownership
  acceptance_rule: >-
    The orchestrator may advance FMB-T003 to Needs_Review only after all evidence and review passes;
    the worker never marks it Accepted.

handoff:
  attempt_owner: delegated worker selected after FMB-T001 evidence passes
  external_issue: null
  pull_request: null
  next_ready_candidates:
    - FMB-T002 after the attention/runtime storage contract passes
    - FMB-T004 and FMB-T005 after operations evidence passes and their packets exist
    - FMB-T006 after FMB-T001 and FMB-T003 evidence pass and its packet exists
  finish_options:
    - integrate reviewed evidence and mark Needs_Review
    - create FMB-T003-A002 for scoped fixes
    - mark Blocked with the named dependency or ownership condition

stop_conditions:
  - FMB-T001 dependency evidence is missing or has a blocking review finding.
  - Another active task owns a shared OpenAPI, generated, HTTP, ProductApp, styles, jobs, sqlc or readiness file.
  - Migration 000017 is already owned by another attempt or contains incompatible unreviewed content.
  - Relevant existing changes cannot be preserved safely.
  - Required work leaves the allowed files or moves domain write ownership into Operations.
  - Validation requires raw-payload exposure, fixture fallback, deleted tests, weakened assertions or fabricated evidence.
