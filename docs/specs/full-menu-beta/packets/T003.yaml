    - Globs cover new focused modules/tests and generated sqlc output; they do not authorize unrelated refactors.
    - Existing discovery, governance and distribution adapter/query files may change only to publish the operations projection in the owning transaction; Operations must not absorb their write models.
    - The worker does not edit plan.md, tasks.md, packets or another task's evidence.

forbidden_changes:
  - Do not expose raw jobs.payload, outbox payloads, provider responses, prompts, DSNs, credentials or fact rows.
  - Do not treat audit, usage and OpenTelemetry as interchangeable stores.
  - Do not make immutable audit rows editable or deletable by application users.
  - Do not let workspace settings redirect OTel, outbound traffic, secret roots, OIDC or database configuration.
  - Do not invent progress percentages, phases, timestamps, logs, actors or outcomes absent from persisted records.
  - Do not advertise retry or cancel for a run kind without an owning-domain safety contract.
  - Do not implement Workbench rules/UI, ingestion, embedding, webhook or execution behavior.
  - Do not modify shared conflict files while FMB-T002 or a later task owns them.
  - Do not edit historical migrations 000001 through 000016.

tdd_plan:
  required: true
  exception: null
  red:
    command: >-
      go test ./internal/application/jobs/... ./internal/application/usage/...
      ./internal/platform/http/... ./tests/integration/worker/... ./tests/integration/db/... &&
      pnpm --dir web test -- AuditRuntime ProductApp
    expected_failure: >-
      Tests expose static Audit/Runtime rows, missing read/export/settings contracts, raw payload
      leakage, absent normalized restart-safe run state and unsupported controls reporting success.
  green:
    command: >-
      go test ./internal/domain/operations/... ./internal/application/operations/...
      ./internal/application/jobs/... ./internal/platform/http/...
      ./tests/integration/operations/... ./tests/integration/worker/... ./tests/integration/db/... &&
      pnpm --dir web test -- AuditRuntime ProductApp
    expected_signal: >-
      Persisted audit/runtime/settings tests and the real Web surface pass with stable pagination,
      redacted diagnostics, domain-owned retry/cancel capability and restart recovery.
  refactor:
    command: make contracts-check && make db-generate-check && make check-source && git diff --check
    expected_signal: >-
      Generated artifacts are current, migration/readiness state agrees at version 17 and the shared
      operational projection does not absorb domain write behavior.

validation_loop:
  commands:
    - go test ./internal/domain/operations/... ./internal/application/operations/... ./internal/application/jobs/... ./internal/platform/http/...
    - go test ./tests/integration/operations/... ./tests/integration/worker/... ./tests/integration/db/...
    - pnpm --dir web test -- AuditRuntime ProductApp
    - pnpm --dir web lint
    - pnpm --dir web typecheck
    - make contracts-check
    - make db-generate-check
    - make check-source
    - git diff --check
  migration_proof:
    - Apply migrations 000001 through 000017 to an empty PostgreSQL database.
    - Upgrade a populated version-16 fixture to 000017.
    - Revert 000017 with populated operations state, reapply it, and verify source domain records remain intact.
    - Verify readiness requires schema version 17 for this execution head.
  scenario_proof:
    - Audit filters and cursor pagination by time, actor, event, object and trace with cross-workspace denial.
    - Authorized bounded export uses the same filter, is redacted and records its own audit fact.
    - Discovery, validation, Agent and semantic runs project idempotently and survive process/database restart.
    - Retry/cancel capability is absent for unsupported run kinds and enforced server-side for supported kinds.
    - Stale runtime-setting versions fail; deployment-owned settings remain read-only.
    - Redaction corpus covers DSNs, cookies, bearer/provider/signing secrets, prompt content and job/outbox payloads.
    - Keyboard, focus, reduced motion and screenshots at 1440x900 and 1024x768.
  retry_budget: 2
  failure_policy:
    first_failure: Fix only the operations projection, migration, contract or Web binding owned by FMB-T003 and rerun the smallest failing layer.
    second_failure: Classify a dependency, schema, redaction, domain-ownership or shared-file blocker and return it to the orchestrator.
    beyond_budget: Stop and produce blocked evidence without exposing raw payloads, weakening tests or widening allowed files.

