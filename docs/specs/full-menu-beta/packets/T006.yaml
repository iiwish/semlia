forbidden_changes:
  - No plaintext credential storage, logging, recoverable list response or persistent browser storage.
  - No transport-specific resolver, policy bypass, draft release disclosure or arbitrary SQL tool.
  - No simulated client credential, copy success, webhook delivery, MCP connection or SDK capability.
  - No outbound request before destination/IP policy validation; redirects and DNS changes must remain safe.
  - No forwarding internal outbox payloads or secret-bearing metadata as external event bodies.
  - No mutations to migrations 000001-000019 or 000021.

tdd_plan:
  red:
    - Credential entropy/digest/one-time display, revoke/rotate/expiry and principal suspension.
    - Mixed auth, forged workspace/consumer context, narrowed actions/scopes and known-ID replay restrictions.
    - REST/MCP/CLI/SDK golden parity for describe, search, resolve and plan/refusal inspection.
    - Webhook HMAC timestamp, stable event identity, retry/dead-letter and independent fanout receipts.
    - SSRF tests for private/loopback/link-local, IPv4/IPv6, redirect and DNS rebinding.
    - UI permission, pending, persisted success, refresh failure, empty, stale and clipboard failure states.
  green:
    - Add typed domain/repository/services, generated contracts and thin channel adapters.
    - Use the official MCP Go SDK after checking its upstream current API.
    - Connect real integration settings and authoritative Operations delivery visibility.

validation_loop:
  resource_policy: Use go test -p 1 for database suites and one Vitest worker on this host.
  commands:
    - go test -p 1 ./internal/application/distribution/... ./internal/application/authorization/... ./internal/platform/http/... ./cmd/semlia/...
    - go test -p 1 ./tests/integration/... ./tests/contracts/...
    - pnpm --dir sdk/typescript test
    - pnpm --dir web typecheck
    - pnpm --dir web exec vitest run --maxWorkers=1
    - pnpm --dir web lint
    - make contracts-check
    - make db-generate-check
    - GOFLAGS=-p=1 make check-source
    - git diff --check
  proof:
    - Migration 19-to-20 populated up/down/up preserves prior state.
    - Real PostgreSQL credential lifecycle and next-request revocation, not a mocked repository.
    - Equivalent golden plan digests/refusals through actual channel entry points.
    - A receiver verifies real signed delivery and duplicate/retry semantics under explicit test network policy.
    - An unavailable external receiver or hosted environment is reported separately from local transport proof.
    - 1440x900 and 1024x768 keyboard, focus, secret dismissal and refresh behavior.

