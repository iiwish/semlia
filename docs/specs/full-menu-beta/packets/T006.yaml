work_unit:
  title: Machine credentials and semantic distribution channels
  goal: >-
    Deliver accountable machine principals and verifier-only credentials, canonical REST/MCP/CLI/SDK
    semantics, and signed durable webhook delivery. Replace integration fixtures with server-owned
    lists and commands. Reuse the existing resolver, authorization evaluator and immutable releases.
  story: FMB-US-006
  requirements: [FR-001, FR-008, FR-009, FR-010, NFR-001, NFR-002, NFR-004, NFR-005]
  depends_on: [FMB-T001 evidence, FMB-T003 evidence, existing M3 resolver evidence, preceding shared-file handoff]
  blocks: [FMB-T007]
  parallel: false

codebase_context:
  relevant_files:
    - internal/application/distribution/service.go
    - internal/adapters/postgres/distribution.go
    - internal/application/authorization/service.go
    - internal/platform/http/identity.go
    - internal/platform/http/distribution.go
    - internal/application/jobs/router.go
    - internal/application/jobs/dispatcher.go
    - internal/application/projection/publisher.go
    - cmd/semlia/main.go
    - sdk/typescript/src/client.ts
    - web/src/IntegrationSettingsView.tsx
  invariants:
    - Credential actions and scopes narrow current principal authority; they never grant extra authority.
    - Current consumer/principal/grant/revocation/expiry state is checked on every request.
    - Cookie plus bearer is rejected; machine workspace and consumer context are server-derived.
    - Known-ID query/plan reads and idempotent replay must not bypass current credential or asset restrictions.
    - Browser CSRF/Origin behavior remains unchanged and production rejects development identities.
    - Canonical resolver controls matching, release selection, plan digests and refusal codes across channels.
    - Existing outbox completion cannot be reused as an individual webhook delivery receipt.
    - Git projection and webhook delivery have independent idempotent outcomes and retries.

