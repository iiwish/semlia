forbidden_changes:
  - Do not trust client-side capability calculations or inspection results as authorization.
  - Do not authorize by display name, role name or email address; actions and scoped bindings are authoritative.
  - Do not make system roles editable or deletable.
  - Do not mutate a custom-role version in place.
  - Do not permit a grantor to assign actions outside the grantor's effective authorization ceiling.
  - Do not weaken human-only actions, separation of duties, final-administrator protection, CSRF or Origin checks.
  - Do not expose cross-workspace principal, role, binding, scope or decision existence.
  - Do not place session tokens, provider credentials or authorization-sensitive payloads in API responses, logs or audit.
  - Do not modify historical migrations 000001 through 000015.
  - Do not implement FMB-T002 through FMB-T007 behavior in this attempt.
  - Do not mark FMB-T001 Accepted or change another task status.

tdd_plan:
  required: true
  exception: null
  red:
    command: >-
      go test ./internal/domain/authorization/... ./internal/application/authorization/... ./internal/platform/http/...
      ./tests/integration/authorization/... ./tests/integration/db/... &&
      pnpm --dir web test -- AccessControlView authorization sessionRuntime
    expected_failure: >-
      Tests demonstrate that fixture-only custom-role and assignment writes are not durable, that the
      API lacks the management/inspection contract, and that expiry, revocation, version conflict,
      authorization-ceiling, separation-of-duty and cross-workspace cases are not yet satisfied.
  green:
    command: >-
      go test ./internal/domain/authorization/... ./internal/application/authorization/... ./internal/platform/http/...
      ./tests/integration/authorization/... ./tests/integration/db/... &&
      pnpm --dir web test -- AccessControlView authorization sessionRuntime
    expected_signal: >-
      Focused domain, application, HTTP, PostgreSQL and Web tests pass against real persisted roles,
      versions, assignments and server inspection with no production fixture fallback.
  refactor:
    command: make contracts-check && make db-generate-check && make check-source && git diff --check
    expected_signal: >-
      Generated artifacts are current, the complete source gate stays green, formatting is clean and
      authorization continues to have one server-authoritative evaluation path.

validation_loop:
  commands:
    - go test ./internal/domain/authorization/... ./internal/application/authorization/... ./internal/platform/http/...
    - go test ./tests/integration/authorization/... ./tests/integration/db/... ./tests/integration/identity/...
    - pnpm --dir web test -- AccessControlView authorization sessionRuntime ProductApp
    - pnpm --dir web lint
    - pnpm --dir web typecheck
    - make contracts-check
    - make db-generate-check
    - make check-source
    - git diff --check
  migration_proof:
    - Apply migrations 000001 through 000016 to an empty PostgreSQL database.
    - Upgrade a populated migration-15 fixture to 000016.
    - Revert 000016 on populated data, reapply it, and verify system roles/bindings and authorization decisions remain valid.
    - Verify readiness requires schema version 16 for this execution head.
  security_proof:
    - Allow and deny decisions for each new endpoint.
    - Cross-workspace non-disclosure for roles, principals, bindings and inspect.
    - Grantor authorization ceiling and human-only action denial.
    - Separation-of-duty conflict and final active administrator denial.
    - Expiry and revocation effective on the next protected request.
    - Logs, audit and API payload scanned for session, token and provider-secret leakage.
  retry_budget: 2
  failure_policy:
    first_failure: Fix only behavior directly owned by FMB-T001 and rerun the smallest failing layer before broadening.
    second_failure: Determine whether the failure is a scope, existing-baseline, migration, contract or environment blocker and report it to the orchestrator.
    beyond_budget: Stop the attempt and produce blocked evidence without deleting tests, weakening assertions or widening allowed files.

acceptance:
  - OpenAPI is 0.9.0/contract 9 and remains additive under /api/v1.
  - Role catalogue, custom-role create/edit, assignment lifecycle and effective-access inspection survive refresh and process/database restart.
  - System roles remain immutable and custom-role edits create immutable versions with optimistic concurrency.
  - Authorization-ceiling, human-only action, separation-of-duty and final-admin rules fail closed and are audited.
  - Assignment expiration/revocation bumps authorization version and denies the next protected request.
  - Access Control contains no production fixture authority or session-only success disclosure.
  - Empty and populated migration lifecycle, generated drift and focused Web accessibility checks pass.

