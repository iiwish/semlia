work_unit:
  title: Technical boundary and real authorization baseline
  goal: >-
    Publish the additive OpenAPI 0.9.0/contract-9 boundary and replace Access Control fixture state
    and client-side authority with persisted, audited, server-evaluated system/custom roles, immutable
    custom-role versions, scoped assignment lifecycle and effective-access inspection.
  epic: FMB-E001
  story: FMB-US-001
  requirements:
    - FR-001
    - FR-002
    - FMB-NFR-001
    - FMB-NFR-002
    - FMB-NFR-005
  priority: P0
  depends_on:
    - Full-Menu Beta 0.2.0 plan and work graph Confirmed
    - Alpha identity/session foundation present
    - M2 server-side authorization foundation present
    - Existing Alpha/M3 working-tree changes preserved as the implementation baseline
  blocks:
    - FMB-T002
    - FMB-T003
    - FMB-T006
  parallel: false
  conflicts_with:
    - Any active attempt editing api/openapi/semlia.v1.yaml
    - Any active attempt regenerating API or sqlc artifacts
    - Any active attempt editing authorization repositories, HTTP routing, readiness or AccessControlView

codebase_context:
  local_instructions:
    - AGENTS.md
  relevant_files:
    - api/openapi/semlia.v1.yaml
    - api/gen/go/types.gen.go
    - migrations/000005_m2_authorization_foundation.up.sql
    - migrations/000013_alpha_identity_sessions.up.sql
    - db/queries/authorization.sql
    - internal/domain/authorization/model.go
    - internal/application/authorization/service.go
    - internal/adapters/postgres/authorization.go
    - internal/platform/http/handler.go
    - internal/platform/http/authorization_test.go
    - internal/platform/http/identity.go
    - internal/platform/http/identity_test.go
    - cmd/semlia/readiness.go
    - sdk/typescript/src/client.ts
    - sdk/typescript/src/schema.gen.ts
    - web/src/AccessControlView.tsx
    - web/src/authorization.tsx
    - web/src/sessionRuntime.tsx
    - web/src/ProductApp.tsx
    - docs/evidence/ALPHA-T006/route-disclosure-inventory.md
  existing_patterns:
    - Actions, not role names, authorize protected commands.
    - Authorization evaluation is server-side and produces immutable decision audit facts.
    - Workspace authorization_version is monotonic and is checked on each protected request.
    - System roles are seeded and immutable; TypeIDs and UUIDv7 storage identities follow repository conventions.
    - PostgreSQL commands use sqlc/pgx transactions and preserve domain plus audit/outbox atomicity.
    - OpenAPI generates committed Go and TypeScript contract artifacts.
    - Cookie-authenticated Web writes use the shared session-aware client and CSRF/Origin enforcement.
  interfaces_or_contracts:
    - OpenAPI info.version becomes 0.9.0 and x-semlia-contract-version becomes 9.
    - All endpoints remain additive under /api/v1.
    - System-role reads require role.read; custom-role writes require role.manage.
    - Assignment writes require role.assign; inspection requires authorization.inspect.
    - Effective-access inspection calls the same evaluator as protected commands and has no mutation side effect.
    - Assignment state includes active, expired and revoked; expiration and revocation deny the next request.
  schema_contract:
    migration: migrations/000016_fmb_authorization_admin.up.sql
    rollback: migrations/000016_fmb_authorization_admin.down.sql
    responsibilities:
      - Workspace-scoped custom roles and immutable custom-role versions
      - Active version pointer and optimistic version constraint
      - Role-binding expiry and revocation metadata
      - Workspace/principal/scope query indexes and database invariants
    invariants:
      - Historical migrations remain unchanged.
      - System role IDs and action vocabulary remain compatible.
      - Custom role/action changes and authorization_version bump commit atomically.
      - Role-binding lifecycle and authorization_version bump commit atomically.
      - Cross-workspace role, version, principal and scope references are rejected.

