    - Exact changed files inside allowed scope
    - RED failure command and expected failure explanation
    - GREEN and REFACTOR command results
    - Empty and populated migration up/down/up results
    - OpenAPI and sqlc generation drift results
    - Authorization allow/deny, SoD, ceiling, expiry, revocation and cross-workspace results
    - Web refresh, keyboard/focus and no-fixture evidence
    - Diff summary and residual risks

review_contract:
  required_passes:
    - spec_compliance
    - bug_code_quality
    - security_privacy
    - qa_acceptance
  blocking_findings:
    - Any client-authoritative permission decision
    - Any plaintext secret or cross-workspace disclosure
    - Any editable system role or in-place custom-role version mutation
    - Any privilege grant outside the grantor ceiling or bypass of human/SoD/final-admin policy
    - Any fake persisted-success path in Access Control
    - Any missing migration rollback or generated-contract drift
  acceptance_rule: >-
    The worker returns evidence to the orchestrator. The orchestrator may mark FMB-T001 Needs_Review
    after all required passes; only explicit release acceptance can make it Accepted.

handoff:
  attempt_owner: delegated worker selected by the delivery orchestrator
  external_issue: null
  pull_request: null
  next_ready_candidates:
    - FMB-T002 after FMB-T001 evidence passes and T002 packet exists
    - FMB-T003 after FMB-T001 evidence passes and T003 packet exists
    - FMB-T006 also requires FMB-T003 evidence before it becomes Ready
  finish_options:
    - integrate reviewed evidence and mark Needs_Review
    - create FMB-T001-A002 for scoped fixes
    - mark Blocked with a named technical or ownership condition

stop_conditions:
  - The confirmed plan or work graph is missing or no longer Confirmed.
  - Migration 000016 is already owned by a different active attempt or has incompatible unreviewed content.
  - Another active attempt owns an allowed shared file.
  - Relevant dirty changes cannot be attributed or preserved safely.
  - The implementation requires editing outside allowed files.
  - A required validation command is unavailable and no equivalent approved command exists.
  - Tests reveal a required change to the action vocabulary, OIDC/session contract or separation-of-duty policy outside this approved scope.
  - Validation would need deleted tests, weakened assertions, skipped security checks or fabricated evidence to pass.
