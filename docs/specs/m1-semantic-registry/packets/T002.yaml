forbidden_changes:
  - Do not edit 000001_m0_foundation or weaken M0 lease, audit or outbox behavior.
  - Do not add HTTP routes, source parsers, Git writes, Cube, Temporal, graph or vector infrastructure.
  - Do not expose pgtype.UUID outside the PostgreSQL adapter.
  - Do not store credentials, raw search text or customer fact rows.
  - Do not make JSONB replace normalized relationships.

tdd:
  red:
    - Add populated-M0 UUIDv7 conversion, down preservation and PostgreSQL 17/18 migration tests.
    - Add schema invariant, workspace isolation, immutability, idempotency, relation policy and ontology publication tests.
    - Add typed repository round-trip and error mapping tests.
  green:
    - Implement migration 000002 and update typed foundation repository boundaries.
    - Implement migration 000003, sqlc queries and semantic registry repository.
  refactor:
    - Centralize UUID conversion and repository errors without leaking adapter types.

validation:
  - make contracts-check
  - make db-generate-check
  - go test ./tests/integration/db/... ./tests/integration/worker/...
  - go test -race ./internal/domain/semantic/... ./pkg/identity/...
  - make check-source
  - git diff --check

acceptance:
  - Empty and populated M0 upgrades preserve counts, relationships and UUIDv7 invariants.
  - Down/up is lossless for identity and M0 job/outbox behavior.
  - Source, physical, semantic, evidence and ontology schemas enforce their documented invariants.
  - Repositories use Semlia identity/domain types and real PostgreSQL transactions.
  - PostgreSQL 17 and canonical PostgreSQL 18 both pass the migration contract.

