  - SQLC generation check, relevant uncached Go packages and independent review before one focused unchanged performance test. Preserve every result, including failures.
  - A subsequent frozen-source final gate attempt must run the complete existing gates; neither the diagnostic comparison nor a focused performance pass replaces final candidate verification.
