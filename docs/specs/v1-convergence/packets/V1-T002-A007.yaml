constraints:
  - Phase 1 is a single bounded isolated diagnostic, not a benchmark retry. Phase 2 product edits require root approval of the concrete finding and minimal implementation.
  - Use a fresh exactly owned local PostgreSQL test fixture with the benchmark's 10000 synthetic assets, migration schema and data distribution. No original database, V1 application/source data, model, credentials, runtime or publication may change.
  - Record exact original ListCatalogAssets and CountCatalogAssets EXPLAIN ANALYZE BUFFERS plans, index definitions and supported prepared-plan state. Session-only custom/generic-plan diagnostics are permitted solely in this owned fixture; do not change cluster settings or production query modes.
  - A bounded comparison may test an alternative index-matching search predicate or candidate query in the same fixture, with identical results. It is diagnostic evidence, not a passed release benchmark or proof of broad semantics.
  - Private scripts, plans and logs use 0700/0600. Never print DSNs, credentials, raw environment or unrelated process command arguments. Capture failures, do not retry until a favorable sample.
  - Clean up only the exact owned fixture after independently checking its labels and identity. Verify original environment and V1 runtime/knowledge evidence preservation.
  - Preserve all search semantics including workspace isolation, type and lifecycle filters, current revision selection, address substring/SQL wildcard behavior, full-text results, rank ordering, cursor pagination, totals and assets without revisions. An exact-address hit must not suppress other matching results.
  - Do not change benchmark thresholds, fixture size, warmup, sample count, golden search, concurrency flags or skip conditions to obtain a pass. No special fixture/address fast path, hardcoded names or search-result cache.
  - Prefer query-only optimization using existing indexes and SQLC generation. A schema/index migration or wider API/service change requires a new concrete decision before implementation.
  - Query owner and integration-test owner have disjoint files; the test owner maintains evidence. Independent review is read-only; no further delegation. Only one owner runs heavy tests at a time.
