schema_version: 1
packet_id: V1-T002-A005
task_id: V1-T002
mode: Delegated Execute
context:
  spec: docs/specs/v1-convergence/spec.md
  plan: docs/specs/v1-convergence/plan.md
  approval: The approved scope includes synthetic business knowledge, ordinary governance, bounded model repairs and local acceptance. This packet uses existing definition fields, not a new member-mapping product capability.
  failure: RC.3 fixed cohort passes 3/4 positives and 2/2 negatives with five provider calls. Average shape/window/pins are correct but an ungrounded category literal returns null. Published knowledge contains no canonical category values or aliases. RC.2 and RC.3 failures remain immutable evidence.
