  prompt:
    - internal/application/governance/ask.go
    - internal/application/governance/ask_idempotency_test.go
  knowledge_driver:
    - scripts/acceptance/v1/value-knowledge.mjs
    - scripts/acceptance/v1-value-knowledge.test.mjs
    - scripts/acceptance/v1-model.mjs
