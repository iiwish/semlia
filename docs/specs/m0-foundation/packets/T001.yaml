schema_version: 1
packet_id: M0-T001-A001
task_id: T001
feature_id: m0-foundation
mode: execute_one_task
adapter: codex

governance_inputs:
  product_contract: docs/SSOT.md
  requirements_checklist: docs/specs/m0-foundation/checklists/requirements.md
  technical_decisions: docs/adr/0001-m0-technical-foundation.md
  feature_plan: docs/specs/m0-foundation/plan.md
  work_graph: docs/specs/m0-foundation/tasks.md
  analysis: docs/specs/m0-foundation/analysis.md
  approval_gates:
    product_contract: Confirmed by founder on 2026-08-08
    requirements_checklist: Completed with no unresolved Critical or High findings
    technical_plan_and_work_graph: Confirmed by founder on 2026-08-08
    analysis: Clear for T001 packetization

work_unit:
  title: 建立仓库与工具链基线
  goal: >-
    建立受版本约束的 Python 与 TypeScript workspace、统一根命令和完整开源仓库治理，
    使后续任务不再自行发明工具入口。
  epic: E001
  story: M0-US-001
  requirements:
    - M0-FR-001
    - M0-FR-008
    - M0-NFR-003
    - M0-NFR-005
    - M0-NFR-007
  priority: P0
  depends_on: []
  blocks:
    - T002
    - T003
    - T004
    - T005
    - T006
    - T007
    - T008
  parallel: false
  conflicts_with: []

codebase_context:
  repository_state:
    branch: main
    latest_confirmed_plan_commit: b28114c
    implementation_state: Documentation-only repository with no application scaffold
  local_instructions:
    - Follow the session-level AGENTS.md guidance.
    - Use pnpm rather than npm for the JavaScript workspace.
    - Use apply_patch for manual file edits.
    - Preserve confirmed documents except for orchestrator-owned status and evidence updates.
  relevant_files:
    - docs/SSOT.md
    - docs/adr/0001-m0-technical-foundation.md
    - docs/specs/m0-foundation/plan.md
    - docs/specs/m0-foundation/tasks.md
    - docs/specs/m0-foundation/checklists/requirements.md
    - docs/specs/m0-foundation/analysis.md
  existing_patterns:
    - There is no existing code pattern; T001 defines only repository and toolchain conventions.
    - Root commands must be thin, readable wrappers over uv and pnpm.
    - Version declarations must be mutually consistent and covered by a repository contract test.
  interfaces_or_contracts:
    - make bootstrap installs locked Python and JavaScript dependencies.
    - make doctor reports supported tool versions and actionable failures.
    - make clean removes generated local state without deleting user source or documentation.
    - Repeating bootstrap must not change lockfiles or tracked configuration.
  forbidden_changes:
    - Do not create API, Web, worker, database, schema, connector or Agent implementation.
    - Do not modify product scope, TDR decisions or tasks T002 through T008.
    - Do not add a production credential, personal absolute path or customer data.
    - Do not silently change Python 3.14, Node.js 24 LTS, uv or pnpm choices.

execution_constraints:
  branch_or_worktree: current main branch
  allowed_files:
    - README.md
    - LICENSE
    - NOTICE
    - .gitignore
    - .editorconfig
    - .tool-versions
    - .python-version
    - pyproject.toml
    - uv.lock
    - package.json
    - pnpm-workspace.yaml
    - pnpm-lock.yaml
    - Makefile
    - CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - SECURITY.md
    - scripts/doctor.sh
    - tests/repository/test_repository_contract.py
  test_targets:
    - tests/repository/test_repository_contract.py
  ownership_notes:
    - Governance status and evidence files are updated by the orchestrator, not by the implementation work unit.
    - Stop if any allowed file already contains user changes that are not part of this task.
  environment_observed:
    python: 3.14.6
    node: 24.15.0
    pnpm: 11.1.3
    make: GNU Make 3.81
    docker: 29.4.0
    uv: Not installed before execution

tdd_plan:
  required: true
  exception: null
  red:
    preparation:
      - Install the official uv tool outside the repository if it is absent.
      - Create only tests/repository/test_repository_contract.py before production scaffold files.
    command: uv run --with pytest pytest tests/repository/test_repository_contract.py -q
    expected_failure: Repository contract fails because required root files, version declarations and commands do not exist.
  green:
    command: uv run pytest tests/repository/test_repository_contract.py -q
    expected_signal: Repository contract passes with pinned, consistent tools and required root commands.
  refactor:
    command: make doctor && make bootstrap && uv run pytest tests/repository/test_repository_contract.py -q
    expected_signal: Commands pass and a second bootstrap leaves lockfile hashes unchanged.

validation_loop:
  commands:
    - make doctor
    - make bootstrap
    - uv run pytest tests/repository/test_repository_contract.py -q
    - pnpm install --frozen-lockfile
    - git diff --check
  deterministic_check:
    - Record SHA-256 hashes for uv.lock and pnpm-lock.yaml.
    - Run make bootstrap a second time.
    - Confirm both hashes are unchanged.
  retry_budget: 2
  failure_policy:
    first_failure: Fix only an issue directly caused by T001 files or declared tool compatibility.
    second_failure: Determine whether the failure is a scope, confirmed-decision or environment blocker.
    beyond_budget: Stop and create blocked evidence without weakening tests or version constraints.

evidence_contract:
  summary: docs/evidence/T001/summary.md
  diff: docs/evidence/T001/diff.patch
  test_results: docs/evidence/T001/test-results.md
  required:
    - changed files
    - observed and pinned tool versions
    - RED, GREEN and REFACTOR results
    - deterministic bootstrap hash results
    - validation results
    - diff summary
    - residual risks

review_contract:
  required_passes:
    - spec_compliance
    - bug_code_quality
    - qa_acceptance
  focus:
    - No scope beyond repository and toolchain baseline
    - Correct Apache 2.0 legal files and community policies
    - Safe and portable shell and Make behavior
    - Lockfile determinism and no personal environment leakage
  acceptance_rule: T001 can move to Needs_Review after implementation evidence and to Accepted only after explicit user acceptance.

handoff:
  external_issue: null
  pull_request: null
  finish_options:
    - keep changes on main for user review
    - commit after review
    - push and create PR after explicit request
    - discard only with explicit confirmation

stop_conditions:
  - An allowed file has unrelated user changes.
  - The official uv installation cannot complete or uv cannot run with Python 3.14.
  - A required direct dependency does not support Python 3.14.
  - Implementing the task requires changing a confirmed TDR or expanding allowed files.
  - A validation command is unavailable after bootstrap.
  - The repository contract can pass only by weakening a confirmed requirement.
  - An unresolved Critical or High finding appears during implementation.
