tdd_plan:
  required: true
  exception: null
  red:
    preparation:
      - Add repository assertions that doctor versions equal .tool-versions and the module path equals the controlled GitHub repository.
      - Add acceptance contracts for the quickstart, operations, troubleshooting, private-incubation wording and opt-in fresh-clone journey.
      - Add a repository assertion that rejects a literal Compose project label in smoke resource lookup.
    command: >-
      go test ./tests/repository ./tests/acceptance/...
      -run 'TestDoctorVersionMatchesPinnedToolchain|TestModuleNamespaceMatchesControlledRepository|TestM0DocumentationContract' -count=1
    expected_failure: >-
      The contract reports Go 1.26.3 in doctor, github.com/semlia/semlia in go.mod and missing quickstart/operations documents.
    corrective_command: >-
      go test ./tests/repository
      -run 'TestSmokeJourneyUsesActiveComposeProject' -count=1
    corrective_expected_failure: >-
      The contract rejects the literal semlia-local resource label before smoke lookup is changed to the active Compose project.
    packaging_command: >-
      go test ./tests/repository -run '^TestDockerfileNormalizesMigrationModesBeforeNonrootPackaging$' -count=1
    packaging_expected_failure: >-
      A checkout created under the launcher umask leaves migration directories at 0700 and SQL files at 0600, while the
      final image runs as nonroot and the Dockerfile does not normalize those modes before packaging.
  green:
    command: go test ./tests/repository ./tests/acceptance/... -count=1
    expected_signal: Toolchain, module identity, documentation and non-expensive acceptance contracts pass.
    packaging_signal: >-
      The Dockerfile normalizes the copied migration tree after the source COPY, a restrictive-mode image audit finds
      traversable directories and readable SQL files, and the final image remains configured as nonroot:nonroot.
  refactor:
    command: make doctor && go list -m && go mod tidy -diff && make check-source
    expected_signal: Pinned tools and controlled module identity remain consistent with all source, contract and build gates green.

validation_loop:
  commands:
    - make clean
    - make doctor
    - make bootstrap
    - go list -m
    - go mod tidy -diff
    - go test ./tests/repository ./tests/acceptance/... -count=1
    - make dev
    - make smoke
    - make check
    - make release
    - make dev-down
    - git diff --check
    - Build a uniquely tagged image from a restrictive-umask checkout, assert final migration directory/file modes and nonroot runtime identity, then remove only that exact image and temporary root.
  isolated_checkout_command: >-
    SEMLIA_ACCEPTANCE_SOURCE="$(git rev-parse --show-toplevel)" SEMLIA_ACCEPTANCE_REF=source-revision-redacted
    ./scripts/acceptance/m0-fresh-clone.sh
  runtime_checks:
    - make doctor succeeds with exactly the versions in .tool-versions.
    - go list -m prints github.com/iiwish/semlia and no live source imports github.com/semlia/semlia.
    - Cold bootstrap, warm bootstrap, development readiness and first successful request durations are recorded.
    - After five warm-up requests, 100 sequential system-info requests have zero errors; p50, p95 and maximum are recorded with p95 at or below 250 ms and maximum below one second on the acceptance host.
    - PostgreSQL failure keeps liveness healthy, makes readiness fail with DEPENDENCY_UNAVAILABLE and a trace ID, and recovers after restart.
    - Migration upgrade/downgrade/upgrade, concurrent worker lease/retry/dead-letter, contract drift and production fail-closed scenarios pass.
    - Complete source, smoke, security, release, SBOM and checksum gates pass and task-owned resources are removed.
  retry_budget: 2
  failure_policy:
    first_failure: Fix only documentation, acceptance automation, module imports or the doctor version when the failure maps directly to T008.
    second_failure: Classify the failure as a pre-existing M0 defect, acceptance-isolation defect, host constraint or external registry/GitHub limitation and record exact evidence.
    beyond_budget: Stop with Blocked evidence; never weaken a security, reliability, performance or clean-tree assertion.
  authorized_exception:
    authority: Founder explicit continuation on 2026-08-13
    reason: >-
      Independent review found additional false-green, process-isolation and task-owned cleanup defects after the original retry budget was exhausted.
      The founder explicitly instructed the orchestrator to continue rather than accept or suppress those defects.
    scope: >-
      Additional attempts are limited to independently reviewed T008 acceptance-harness, diagnostic, cleanup, build-packaging permission
      and evidence corrections inside allowed_files. The build-packaging permission exception covers only the restrictive-umask
      fresh-clone failure proven by the fe174ac image audit; it does not authorize migration or runtime behavior changes.
      Every failed attempt remains evidence; security, reliability, performance and clean-tree thresholds cannot be weakened.
    exit: >-
      No further launcher attempt may start until spec-compliance, bug/code-quality and QA pre-run reviews pass for its exact commit.

