codebase_context:
  repository_state:
    branch: codex/core-product-loop
    baseline_commit: 9d3608e
    remote: https://github.com/iiwish/semlia
    visibility: Private incubation
    implementation_state: >-
      M0 runtime, PostgreSQL lifecycle, job/outbox behavior, generated contracts, local Compose, CI, security scans,
      SBOM and cross-platform release builds exist and have prior local and hosted green evidence. T008 begins with no quickstart,
      operations documents, acceptance package or release report.
  verified_preflight_findings:
    - scripts/doctor.sh requires Go 1.26.3 while every canonical toolchain source requires Go 1.26.5, so make doctor fails.
    - go.mod declares github.com/semlia/semlia while the controlled repository is github.com/iiwish/semlia.
    - The repository is currently private; hosted T007 evidence was produced while it was public and must be described historically.
    - Private-repository security features and tagged provenance remain public-release gates, not claims of current availability.
  architecture_boundaries:
    - T008 does not implement Cube, semantic assets, Agent behavior, authentication, MCP or any M1 product feature.
    - The module migration is a literal replacement to the controlled repository path; package names, APIs and runtime behavior remain unchanged.
    - Fresh-clone automation is opt-in so make check and ordinary go test do not recursively clone or invoke themselves.
    - Isolation uses task-owned temporary caches and a unique Compose project; cleanup never prunes global Docker state. The complete host acceptance is serialized because existing release/security image tags are shared.
    - Documentation describes the current private-incubation state and does not present Semlia as production-ready or as an active public community.

