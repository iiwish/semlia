    - Do not edit runtime behavior, migrations, generated API artifacts, Web UI, prototype, Compose topology or release workflow behavior.
    - The local Dockerfile edit is limited to normalizing packaged migration directory and SQL-file read/traverse modes for the existing nonroot runtime user; image stages, dependencies, commands and topology remain unchanged.
    - Security and SBOM script edits are limited to an optional, validated acceptance ownership label on task-started Docker containers; ordinary local and hosted behavior remains unchanged.
    - The Web end-to-end edit is limited to replacing a timing race with an explicit request barrier; product behavior and assertions remain unchanged.
    - Makefile and smoke-test edits are limited to an explicit 10-minute smoke-test process timeout, an ordered runtime journey, task-owned Compose project resolution, and bounded PostgreSQL/worker failure recovery; product runtime behavior is unchanged.
    - Do not add a new framework, service, SaaS dependency, telemetry exporter or package dependency.
    - Do not rewrite historical evidence patches when migrating the module namespace.
    - Do not claim public vulnerability reporting, branch protection, code scanning, secret scanning or private tag attestation is enabled.
    - Do not weaken existing source, smoke, security, SBOM, release or repository checks.
    - Do not use global Docker prune, shared project names or destructive cleanup outside the acceptance run.
    - Do not mark T008 or M0 Accepted; only founder acceptance after review can do that.
  ownership_notes:
