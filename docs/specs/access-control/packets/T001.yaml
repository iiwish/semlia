schema_version: 1
packet_id: ACCESS-CONTROL-T001-A001
task_id: T001
feature_id: access-control
mode: execute_one_task
adapter: codex

governance_inputs:
  product_contract: docs/specs/access-control/product-design.md
  requirements_checklist: docs/specs/access-control/checklists/requirements.md
  technical_decisions: docs/specs/access-control/technology-decision-record.md
  feature_plan: docs/specs/access-control/plan.md
  work_graph: docs/specs/access-control/tasks.md
  analysis: docs/specs/access-control/analysis.md
  approval_gates:
    product_or_spec: Confirmed by user on 2026-09-01
    requirements_checklist: Completed
    technical_plan_and_work_graph: Confirmed by user on 2026-09-01
    analysis: No unresolved Critical/High findings

work_unit:
  title: Add typed authorization model and capability projection
  goal: Establish a stable action-based frontend authorization contract without visible navigation changes.
  epic: E001
  story: S001
  requirements: [US-004, FR-003, FR-011, FR-012, NFR-001, NFR-002]
  priority: P0
  depends_on: []
  blocks: [T002, T003, T004]
  parallel: false
  conflicts_with: []

codebase_context:
  local_instructions: [AGENTS.md]
  relevant_files:
    - prototypes/product/src/types.ts
    - prototypes/product/src/data.ts
  existing_patterns:
    - React 19 function components with TypeScript and Vitest Testing Library tests
    - Static prototype fixtures exported from data.ts
  interfaces_or_contracts:
    - docs/specs/access-control/product-design.md
    - docs/specs/access-control/technology-decision-record.md
  forbidden_changes:
    - Do not modify files outside allowed_files.
    - Do not add browser storage, remote requests, or a backend dependency.

execution_constraints:
  branch_or_worktree: current
  allowed_files:
    - prototypes/product/src/types.ts
    - prototypes/product/src/data.ts
    - prototypes/product/src/authorization.tsx
    - prototypes/product/src/authorization.test.tsx
  test_targets:
    - prototypes/product/src/authorization.test.tsx
  ownership_notes:
    - Preserve unrelated user changes and stop if an allowed file changes concurrently.

tdd_plan:
  required: true
  exception: null
  red:
    command: pnpm --filter @semlia/product-prototype test -- src/authorization.test.tsx
    expected_failure: New authorization module is not yet implemented.
  green:
    command: pnpm --filter @semlia/product-prototype test -- src/authorization.test.tsx
    expected_signal: Focused authorization tests pass.
  refactor:
    command: pnpm --filter @semlia/product-prototype typecheck && pnpm --filter @semlia/product-prototype lint
    expected_signal: Types and lint remain clean.

validation_loop:
  commands:
    - pnpm --filter @semlia/product-prototype test -- src/authorization.test.tsx
    - pnpm --filter @semlia/product-prototype typecheck
    - pnpm --filter @semlia/product-prototype lint
  retry_budget: 2
  failure_policy:
    first_failure: Fix issues directly related to T001.
    second_failure: Classify scope, specification, or environment blocker.
    beyond_budget: Stop and record blocked evidence.

evidence_contract:
  summary: docs/evidence/access-control-prototype/T001/summary.md
  diff: docs/evidence/access-control-prototype/T001/diff.patch
  test_results: docs/evidence/access-control-prototype/T001/test-results.md
  required:
    - changed files
    - RED/GREEN/REFACTOR results
    - validation results
    - diff summary
    - residual risks

review_contract:
  required_passes: [spec_compliance, bug_code_quality, qa_acceptance]
  acceptance_rule: User acceptance is required before marking Accepted.

handoff:
  external_issue: null
  pull_request: null
  finish_options: [keep current worktree, push and create PR, discard with explicit confirmation]

stop_conditions:
  - missing dependency
  - dirty worktree touching allowed files
  - unclear allowed files
  - missing approval gate
  - missing or stale packet
  - unresolved Critical/High analysis finding
  - validation command unavailable
