    command: pnpm --filter @semlia/product-prototype exec vitest run src/App.test.tsx -t "scopes machine clients|blocks protected publish conflicts"
    expected_failure: Client scope and protected-release identity controls do not exist.
  green:
    command: pnpm --filter @semlia/product-prototype exec vitest run src/App.test.tsx -t "scopes machine clients|blocks protected publish conflicts"
    expected_signal: Focused T004 tests pass.
  refactor:
    command: pnpm --filter @semlia/product-prototype typecheck && pnpm --filter @semlia/product-prototype lint
    expected_signal: Types and lint remain clean.
validation_loop:
