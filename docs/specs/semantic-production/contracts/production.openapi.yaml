        - $ref: '#/components/schemas/TargetKindContent'
      properties:
        intent: { type: string, enum: [update] }
        kind: { $ref: '#/components/schemas/ObjectKind' }
        localKey: { $ref: '#/components/schemas/LocalKey' }
        targetId: { $ref: '#/components/schemas/ResourceId' }
        baseObjectVersion: { $ref: '#/components/schemas/Version' }
        title: { type: string, minLength: 1, maxLength: 256 }
        content: { type: object }
        changes: { $ref: '#/components/schemas/ChangeList' }
        evidenceIds: { type: array, maxItems: 256, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceId' } }
    CreateProductionRequest:
      type: object
      additionalProperties: false
      required: [input, targets]
      properties:
        input: { $ref: '#/components/schemas/ProductionInput' }
        targets: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/ProductionTarget' } }
        supersedesOperationId: { $ref: '#/components/schemas/ResourceId' }
      x-semlia-max-total-changes: 256
    ReplaceProductionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, input, targets]
      properties:
        expectedVersion: { $ref: '#/components/schemas/Version' }
        input: { $ref: '#/components/schemas/ProductionInput' }
        targets: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/ProductionTarget' } }
        suggestionRunId: { $ref: '#/components/schemas/ResourceId' }
      x-semlia-max-total-changes: 256
    SubmitProductionRequest:
      type: object
      additionalProperties: false
