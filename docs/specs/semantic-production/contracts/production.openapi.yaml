        asset: { $ref: '#/components/schemas/SemanticReference' }
        expression: { type: string, minLength: 1, maxLength: 4096 }
        fields: { $ref: '#/components/schemas/FieldReferences' }
    EntityKeyContent:
      type: object
      additionalProperties: false
      required: [asset, fields, uniqueness]
      properties:
        asset: { $ref: '#/components/schemas/SemanticReference' }
        fields: { $ref: '#/components/schemas/FieldReferences' }
        uniqueness: { type: string, enum: [exact, deduplicated] }
    FieldReferences:
      type: array
      minItems: 1
      maxItems: 64
      uniqueItems: true
      items: { $ref: '#/components/schemas/PhysicalReference' }
    JoinContent:
      type: object
      additionalProperties: false
      required: [leftDataset, rightDataset, pairs, joinType, cardinality, expression]
      properties:
        leftDataset: { $ref: '#/components/schemas/PhysicalReference' }
        rightDataset: { $ref: '#/components/schemas/PhysicalReference' }
        pairs:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [left, right]
            properties:
              left: { $ref: '#/components/schemas/PhysicalReference' }
              right: { $ref: '#/components/schemas/PhysicalReference' }
        joinType: { type: string, enum: [inner, left, right, full] }
        cardinality: { type: string, enum: [one_to_one, one_to_many, many_to_one, many_to_many] }
        expression: { type: string, minLength: 1, maxLength: 4096 }
        notes: { type: string, maxLength: 4096 }
    TargetKindContent:
      oneOf:
        - properties:
            kind: { type: string, enum: [semantic_asset] }
            content: { $ref: '#/components/schemas/AssetContent' }
        - properties:
            kind: { type: string, enum: [physical_binding] }
            content: { $ref: '#/components/schemas/BindingContent' }
        - properties:
            kind: { type: string, enum: [model_grain] }
