      additionalProperties: false
      required: [expectedVersion, setDigest, expectedHead, reason]
      properties:
        expectedVersion: { $ref: '#/components/schemas/Version' }
        setDigest: { $ref: '#/components/schemas/Digest' }
        expectedHead: { $ref: '#/components/schemas/HeadReference' }
        reason: { type: string, minLength: 1, maxLength: 4096 }
    ProductionBusinessRuleRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [expectedVersion, setDigest, targetKey, action, evidenceId]
          properties:
            expectedVersion: { $ref: '#/components/schemas/Version' }
            setDigest: { $ref: '#/components/schemas/Digest' }
            targetKey: { type: string, minLength: 1, maxLength: 128 }
            action: { type: string, enum: [confirm] }
            evidenceId: { $ref: '#/components/schemas/ResourceId' }
        - type: object
          additionalProperties: false
          required: [expectedVersion, setDigest, targetKey, action, declaration]
          properties:
            expectedVersion: { $ref: '#/components/schemas/Version' }
            setDigest: { $ref: '#/components/schemas/Digest' }
            targetKey: { type: string, minLength: 1, maxLength: 128 }
            action: { type: string, enum: [confirm] }
            declaration: { type: string, minLength: 1, maxLength: 8192 }
        - type: object
          additionalProperties: false
          required: [expectedVersion, setDigest, targetKey, action]
          properties:
            expectedVersion: { $ref: '#/components/schemas/Version' }
            setDigest: { $ref: '#/components/schemas/Digest' }
            targetKey: { type: string, minLength: 1, maxLength: 128 }
            action: { type: string, enum: [revoke] }
    ProductionBusinessRuleEvent:
      type: object
      additionalProperties: false
      required: [sequence, workspaceId, operationId, productionVersion, targetKey, action, setDigest, contentDigest, evidenceOrigin, principalId, authorizationVersion, createdAt, replayed]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        workspaceId: { $ref: '#/components/schemas/ResourceId' }
        operationId: { $ref: '#/components/schemas/ResourceId' }
        productionVersion: { $ref: '#/components/schemas/Version' }
        targetKey: { type: string, minLength: 1, maxLength: 128 }
        action: { type: string, enum: [confirm, revoke] }
        setDigest: { $ref: '#/components/schemas/Digest' }
        contentDigest: { $ref: '#/components/schemas/Digest' }
        evidenceId: { $ref: '#/components/schemas/ResourceId' }
        evidenceDigest: { $ref: '#/components/schemas/Digest' }
        evidenceOrigin: { type: string, enum: [selected_evidence, human_declaration, none] }
        principalId: { $ref: '#/components/schemas/ResourceId' }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        replayed: { type: boolean }
    ProductionBusinessRuleWitness:
      type: object
      additionalProperties: false
      required: [event, valid]
      properties:
        event: { $ref: '#/components/schemas/ProductionBusinessRuleEvent' }
        valid: { type: boolean }
        declaration: { type: string, minLength: 1, maxLength: 8192 }
    GenerateProductionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, inputDigest, modelSettingId, modelConfigRevision, instruction, maxOutputTokens, maxCostMicros]
      properties:
        expectedVersion: { $ref: '#/components/schemas/Version' }
        inputDigest: { $ref: '#/components/schemas/Digest' }
        modelSettingId: { $ref: '#/components/schemas/ResourceId' }
        modelConfigRevision: { type: string, minLength: 1, maxLength: 128 }
        instruction: { type: string, maxLength: 8192 }
        maxOutputTokens: { type: integer, minimum: 1, maximum: 16384 }
        maxCostMicros: { type: integer, format: int64, minimum: 0, maximum: 1000000000 }
      description: Limits are ceilings subject to smaller server grants/config; request cannot authorize spend or elevate a model/tool. A run never publishes or automatically overwrites drafts.
    ProposalState: { type: string, enum: [draft, proposed, validating, in_review, released, rejected] }
    TargetResult:
      type: object
      additionalProperties: false
      required: [localKey, targetId, declaration, outcome, contentDigest, proposalId, proposalState, validationRunIds, reviewIds]
      properties:
        localKey: { $ref: '#/components/schemas/LocalKey' }
        targetId: { $ref: '#/components/schemas/ResourceId' }
        declaration: { $ref: '#/components/schemas/ProductionTarget' }
        outcome: { type: string, enum: [proposal, no_change] }
        contentDigest: { $ref: '#/components/schemas/Digest' }
        proposalId: { type: string, nullable: true, maxLength: 59 }
        proposalState: { type: string, nullable: true, enum: [draft, proposed, validating, in_review, released, rejected, null] }
        validationRunIds: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/ResourceId' } }
        reviewIds: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/ResourceId' } }
      description: Lists expose current effective attempts only; complete history remains on existing proposal validation/review pages. no_change requires null proposal fields and empty governance lists.
    OperationSummary:
      type: object
      additionalProperties: false
      required: [id, currentVersion, createdBy, createdAt, updatedAt, frozen, progress, targetCount, releaseId]
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        currentVersion: { $ref: '#/components/schemas/Version' }
        createdBy: { $ref: '#/components/schemas/ResourceId' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        frozen: { type: boolean }
        progress: { type: string, enum: [draft, no_change, validating, needs_correction, in_review, ready_to_publish, released, rejected] }
        targetCount: { type: integer, minimum: 1, maximum: 32 }
        releaseId: { type: string, nullable: true, maxLength: 59 }
      description: progress is a read-only derivation from existing Proposal/Validation/Review/Release, never a second approval state.
    ProductionOperationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/OperationSummary' } }
        nextCursor: { type: string, maxLength: 2048, nullable: true }
    ProductionOperation:
      type: object
      additionalProperties: false
      required: [summary, version, input, inputDigest, setDigest, baselineHead, targets, activeValidation, generationRunIds, generationApplications, unresolvedCodes]
      properties:
        summary: { $ref: '#/components/schemas/OperationSummary' }
        version: { $ref: '#/components/schemas/Version' }
        input: { $ref: '#/components/schemas/ProductionInput' }
        inputDigest: { $ref: '#/components/schemas/Digest' }
        setDigest: { $ref: '#/components/schemas/Digest' }
        baselineHead: { $ref: '#/components/schemas/HeadReference' }
        targets: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/TargetResult' } }
        activeValidation: { $ref: '#/components/schemas/ValidationStatus' }
        generationRunIds: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/ResourceId' } }
        generationApplications: { type: array, maxItems: 1, items: { $ref: '#/components/schemas/GenerationApplication' } }
        unresolvedCodes: { type: array, maxItems: 256, uniqueItems: true, items: { type: string, maxLength: 64 } }
      description: Exact requested version; frozen versions immutable even if summary reports newer currentVersion. Generation references are bounded by per-operation 256 run ceiling.
    ProductionCommandResult:
      type: object
      additionalProperties: false
      required: [operationId, version, setDigest, replayed, outcome, proposalIds, validationAttemptNo, validationRunIds, reviewIds]
      properties:
        operationId: { $ref: '#/components/schemas/ResourceId' }
        version: { $ref: '#/components/schemas/Version' }
        setDigest: { $ref: '#/components/schemas/Digest' }
        replayed: { type: boolean }
        outcome: { type: string, enum: [created, updated, no_change, submitted, validation_queued, reviewed] }
        proposalIds: { type: array, maxItems: 32, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceId' } }
        validationAttemptNo: { type: integer, minimum: 1, maximum: 256, nullable: true }
        validationRunIds: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/ResourceId' } }
        reviewIds: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/ResourceId' } }
    StructuredGenerationOutput:
      type: object
      additionalProperties: false
      required: [schemaVersion, targets]
      properties:
        schemaVersion: { type: string, enum: [semlia.production-suggestions/v1] }
        targets: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/ProductionTarget' } }
      x-semlia-max-total-changes: 256
      x-semlia-max-canonical-bytes: 1048576
      description: This schema-gated canonical body is persisted immutably with its digest. No original prompt, raw provider envelope, failed output or hidden reasoning is stored.
    GenerationApplication:
      type: object
      additionalProperties: false
      required: [runId, sourceVersion, sourceOutputDigest, appliedVersion, appliedContentDigest, actorPrincipalId, deltaDigest, delta]
      properties:
        runId: { $ref: '#/components/schemas/ResourceId' }
        sourceVersion: { $ref: '#/components/schemas/Version' }
        sourceOutputDigest: { $ref: '#/components/schemas/Digest' }
        appliedVersion: { $ref: '#/components/schemas/Version' }
        appliedContentDigest: { $ref: '#/components/schemas/Digest' }
        actorPrincipalId: { $ref: '#/components/schemas/ResourceId' }
        deltaDigest: { $ref: '#/components/schemas/Digest' }
        delta:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [localKey, change]
            properties:
              localKey: { $ref: '#/components/schemas/LocalKey' }
              change: { $ref: '#/components/schemas/Change' }
      description: Immutable human application provenance. Delta is server-computed against stored structured output; both full versions remain retrievable. No client-authored actor or digest is trusted.
    GenerationResult:
      type: object
      additionalProperties: false
      required: [runId, operationId, inputVersion, inputDigest, status, providerMode, model, modelConfigRevision, replayed, outputDigest, output, errorCode, costMicros, durationMs]
      allOf:
        - oneOf:
            - properties:
                status: { type: string, enum: [succeeded] }
                output: { $ref: '#/components/schemas/StructuredGenerationOutput' }
                outputDigest: { $ref: '#/components/schemas/Digest' }
                errorCode: { nullable: true, enum: [null] }
            - properties:
                status: { type: string, enum: [queued, running, failed, cancelled, outcome_unknown] }
                output: { nullable: true, enum: [null] }
                outputDigest: { nullable: true, enum: [null] }
      properties:
        runId: { $ref: '#/components/schemas/ResourceId' }
        operationId: { $ref: '#/components/schemas/ResourceId' }
        inputVersion: { $ref: '#/components/schemas/Version' }
        inputDigest: { $ref: '#/components/schemas/Digest' }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, outcome_unknown] }
        providerMode: { type: string, enum: [protocol_stub, actual_model] }
        model: { type: string, maxLength: 128 }
        modelConfigRevision: { type: string, maxLength: 128 }
        replayed: { type: boolean }
        outputDigest: { type: string, nullable: true, maxLength: 71 }
        output: { nullable: true }
        errorCode: { type: string, nullable: true, maxLength: 64 }
        costMicros: { type: integer, format: int64, minimum: 0, nullable: true }
        durationMs: { type: integer, format: int64, minimum: 0, nullable: true }
      description: Only succeeded has a stored immutable schema-valid output body and matching digest; absent vendor cost is null. Original output survives restarts before human application. Explicit draft PUT records a GenerationApplication with suggestionRunId and CAS.
    BeforePin:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, targetId, presence]
          properties:
            kind: { $ref: '#/components/schemas/TargetKind' }
            targetId: { $ref: '#/components/schemas/ResourceId' }
            presence: { type: string, enum: [absent] }
        - type: object
          additionalProperties: false
          required: [kind, targetId, presence, revisionId]
          properties:
            kind: { type: string, enum: [semantic_asset] }
            targetId: { $ref: '#/components/schemas/ResourceId' }
            presence: { type: string, enum: [present] }
            revisionId: { $ref: '#/components/schemas/ResourceId' }
        - type: object
          additionalProperties: false
          required: [kind, targetId, presence, objectVersion, contentDigest]
          properties:
            kind: { $ref: '#/components/schemas/ObjectKind' }
            targetId: { $ref: '#/components/schemas/ResourceId' }
            presence: { type: string, enum: [present] }
            objectVersion: { $ref: '#/components/schemas/Version' }
            contentDigest: { $ref: '#/components/schemas/Digest' }
    Manifest:
      type: object
      additionalProperties: false
      required: [assets, objects, digest]
      properties:
        assets:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [assetId, revisionId, position, compatibility]
            properties:
              assetId: { $ref: '#/components/schemas/ResourceId' }
              revisionId: { $ref: '#/components/schemas/ResourceId' }
              position: { type: integer, minimum: 1, maximum: 1000 }
              compatibility: { type: object, maxProperties: 64, additionalProperties: { $ref: '#/components/schemas/JSONValue' } }
        objects:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [kind, targetId, objectVersion, contentDigest, position]
            properties:
              kind: { $ref: '#/components/schemas/ObjectKind' }
              targetId: { $ref: '#/components/schemas/ResourceId' }
              objectVersion: { $ref: '#/components/schemas/Version' }
              contentDigest: { $ref: '#/components/schemas/Digest' }
              position: { type: integer, minimum: 1, maximum: 1000 }
        digest: { $ref: '#/components/schemas/Digest' }
      description: Full immutable manifest; digest uses the unchanged existing release algorithm, not a hash of this wire view (wire IDs and contentDigest fields differ).
    ReleaseAttribution:
      type: object
      additionalProperties: false
      required: [operationId, version, setDigest, validation, reviewIds, proposalIds, contributors, role]
      properties:
        operationId: { $ref: '#/components/schemas/ResourceId' }
        version: { $ref: '#/components/schemas/Version' }
        setDigest: { $ref: '#/components/schemas/Digest' }
        validation: { $ref: '#/components/schemas/ValidationReference' }
        reviewIds: { type: array, minItems: 1, maxItems: 256, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceId' } }
        proposalIds: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceId' } }
        contributors: { type: array, minItems: 1, maxItems: 256, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceId' } }
        role: { type: string, enum: [applied, reverted] }
    ProductionReleaseProtection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [rootReleaseId, rollbackDepth]
          properties:
            rootReleaseId: { $ref: '#/components/schemas/ResourceId' }
            rollbackDepth: { type: integer, enum: [0] }
        - type: object
          additionalProperties: false
          required: [rootReleaseId, rollbackDepth, rollbackParentReleaseId]
          properties:
            rootReleaseId: { $ref: '#/components/schemas/ResourceId' }
            rollbackDepth: { type: integer, minimum: 1, maximum: 2147483647 }
            rollbackParentReleaseId: { $ref: '#/components/schemas/ResourceId' }
      description: Root marks every production release; each rollback descendant inherits root and increments depth. Legacy rollback rejects every marked target regardless of singular originProposalId or current pin count.
    ProductionRelease:
      type: object
      additionalProperties: false
      required: [id, sequence, publishedBy, publishedAt, attribution, protection, beforeHead, beforeManifest, afterManifest, beforePins, originProposalId, originProposalIds, rolledBackReleaseId, projectionStatus]
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        sequence: { type: integer, format: int64, minimum: 1 }
        publishedBy: { $ref: '#/components/schemas/ResourceId' }
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
        attribution: { $ref: '#/components/schemas/ReleaseAttribution' }
        protection: { $ref: '#/components/schemas/ProductionReleaseProtection' }
        beforeHead: { $ref: '#/components/schemas/HeadReference' }
        beforeManifest: { $ref: '#/components/schemas/Manifest' }
        afterManifest: { $ref: '#/components/schemas/Manifest' }
        beforePins: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/BeforePin' } }
        originProposalId: { type: string, nullable: true, maxLength: 59 }
        originProposalIds: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceId' } }
        rolledBackReleaseId: { type: string, nullable: true, maxLength: 59 }
        projectionStatus: { type: string, enum: [pending, ready, failed] }
      description: Single provenance remains populated only for one applied proposal. Multi-proposal/rollback detail uses complete attribution; immutable history is not rewritten by projection status.
    ReleaseCommandResult:
      type: object
      additionalProperties: false
      required: [releaseId, operationId, replayed, manifestDigest]
      properties:
        releaseId: { $ref: '#/components/schemas/ResourceId' }
        operationId: { $ref: '#/components/schemas/ResourceId' }
        replayed: { type: boolean }
        manifestDigest: { $ref: '#/components/schemas/Digest' }
    ProductionError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, retryable]
      properties:
        code:
          type: string
          enum: [INVALID_ARGUMENT, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, INVALID_CURSOR, IDEMPOTENCY_CONFLICT, ALREADY_PRODUCED, IDENTITY_CONFLICT, VERSION_CONFLICT, BASELINE_CONFLICT, HEAD_CONFLICT, INPUT_STALE, INPUT_INCOMPLETE, HISTORY_UNVERIFIABLE, EVIDENCE_MISSING, DEPENDENCY_INVALID, CONTENT_MISMATCH, NO_SUBSTANTIVE_CHANGE, PRODUCTION_SET_REQUIRED, VALIDATION_REQUIRED, REVIEW_REQUIRED, SOD_CONFLICT, PRIOR_STATE_UNKNOWN, PAYLOAD_TOO_LARGE, LIMIT_EXCEEDED, MODEL_NOT_CONFIGURED, MODEL_BUDGET_REQUIRED, MODEL_OUTCOME_UNKNOWN, MODEL_OUTPUT_INVALID, FEATURE_UNAVAILABLE, INTERNAL_ERROR]
        message: { type: string, maxLength: 2048 }
        traceId: { type: string, maxLength: 128 }
        retryable: { type: boolean }
        operationId: { $ref: '#/components/schemas/ResourceId' }
        currentVersion: { $ref: '#/components/schemas/Version' }
        fieldPath: { type: string, maxLength: 512 }
      description: Optional context only after authorization; no raw source, secret, provider diagnostic, foreign-workspace ID or hidden reasoning.
