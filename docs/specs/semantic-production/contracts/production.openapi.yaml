openapi: 3.0.3
info:
  title: Semlia Semantic Production Planned Contract
  version: 0.1.0
  description: >-
    Planned SP-T001 design, not a deployed API or the canonical public bundle.
    production.md and ../data-model.md specify transactional and migration rules
    that OpenAPI cannot enforce. Existing REST/MCP/CLI/SDK consumption is unchanged.
x-semlia-status: planned
x-semlia-invariants:
  maxTargets: 32
  maxChangesPerTarget: 100
  maxTotalChanges: 256
  maxBodyBytes: 1048576
  maxModelOutputBytes: 1048576
  snapshotMembership: immutable_exact
  unchangedRevision: reuse
  partialCoverage: explicit_no_deletion_inference
  legacyHistory: unverifiable
  createBaseline: absent
  updateBaseline: exact_published_pin
  idempotencyScope: [workspace, principal, command, key]
  replayAuthorization: current
  recoveryAuthority: server
  approvalAuthority: proposal_validation_review
  publishAtomicity: all_members_one_transaction
  publishRecheck: [authorization, sod, set_digest, input_freshness, baseline, dependency_closure, validations, reviews]
  legacyMemberPublish: reject
  rollback: exact_before_manifest_including_absence
  releaseAttribution: all_proposals
  legacyDigest: unchanged
  migration: expand_first
  lossyDown: reject
  oldBinaryAfterActivation: unsupported_fenced
  modelNetwork: outside_transaction
  modelRetry: explicit_no_automatic_paid_replay
  machineAllowlistAdditions: []
  desktopViewports: [1440x900, 1024x768]
  legacyProductionRollback: reject_including_descendants
  validationAttemptSelection: one_complete_latest_attempt
  reviewValidationBinding: exact_attempt_digest_reapprove_after_revalidation
  modelOutputPersistence: immutable_schema_gated_body
  identityReintroduction: create_with_trusted_absence
security:
  - SessionCookie: []
paths:
  /api/v1/workspaces/{workspaceId}/sources/{sourceId}/snapshots:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SourceId'
    get:
      operationId: listProductionSourceSnapshots
      summary: List immutable projections, newest first
      x-semlia-actions: [source.read]
      x-semlia-reauthorize: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Authorized snapshot page including partial and unverifiable records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/sources/{sourceId}/snapshots/{snapshotId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/SnapshotId'
    get:
      operationId: getProductionSourceSnapshot
      summary: Read immutable scope, coverage and digest without joining current names
      x-semlia-actions: [source.read]
      x-semlia-reauthorize: true
      responses:
        '200':
          description: Exact snapshot metadata; members and diagnostics have separate pages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceSnapshot' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/sources/{sourceId}/snapshots/{snapshotId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/SnapshotId'
    get:
      operationId: listProductionSnapshotMembers
      summary: Read exact observed members including unchanged revisions
      x-semlia-actions: [source.read]
      x-semlia-reauthorize: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/MemberKind' }
      responses:
        '200':
          description: Page fixed to snapshot ID and history quality
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotMemberPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/sources/{sourceId}/snapshots/{snapshotId}/diagnostics:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/SnapshotId'
    get:
      operationId: listProductionSnapshotDiagnostics
      summary: Read bounded sanitized coverage diagnostics
      x-semlia-actions: [source.read]
      x-semlia-reauthorize: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Diagnostics page ordered by ordinal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/production-operations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listProductionOperations
      summary: Recover authorized operations without browser state
      x-semlia-actions: [asset.read, source.read, evidence.read, binding.read]
      x-semlia-reauthorize: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: sourceId
          in: query
          schema: { $ref: '#/components/schemas/ResourceId' }
        - name: candidateId
          in: query
          schema: { $ref: '#/components/schemas/ResourceId' }
        - name: createdBy
          in: query
          schema: { $ref: '#/components/schemas/ResourceId' }
      responses:
        '200':
          description: Scope-filtered summaries, not all-workspace counts or full target content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionOperationPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createProductionOperation
      summary: Atomically reserve identities and create linked draft proposals
      x-semlia-actions: [asset.propose, source.read, evidence.read, binding.read]
      x-semlia-conditional-actions: [binding.manage]
      x-semlia-reauthorize: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductionRequest' }
      responses: &operationWriteResponses
        '200':
          description: Committed result, including replay or a no_change operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionCommandResult' }
        '201':
          description: Newly committed operation; Location points to the operation GET
          headers:
            Location:
              schema: { type: string, maxLength: 2048 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionCommandResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OperationId'
    get:
      operationId: getProductionOperation
      summary: Read server-authoritative input, targets, links and derived progress
      x-semlia-actions: [asset.read, source.read, evidence.read, binding.read]
      x-semlia-reauthorize: true
      parameters:
        - name: version
          in: query
          description: Exact immutable version; omitted selects current, never rewrites history
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        '200':
          description: Authorized operation version with exact governance references
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionOperation' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: replaceProductionDraft
      summary: Replace the entire draft with a CAS-protected new immutable version
      x-semlia-actions: [asset.propose, source.read, evidence.read, binding.read]
      x-semlia-conditional-actions: [binding.manage]
      x-semlia-reauthorize: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceProductionRequest' }
      responses: *operationWriteResponses
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/submit:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OperationId'
    post:
      operationId: submitProductionOperation
      summary: Freeze all members, submit existing proposals and enqueue initial validation atomically
      x-semlia-actions: [asset.propose, validation.run, source.read, evidence.read, binding.read]
      x-semlia-reauthorize: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitProductionRequest' }
      responses: &asyncResponses
        '200':
          description: Replayed committed command or completed result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionCommandResult' }
        '202':
          description: Durable validation job references committed; poll the operation
          headers:
            Location:
              schema: { type: string, maxLength: 2048 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionCommandResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/validations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OperationId'
    get:
      operationId: listProductionValidationAttempts
      summary: Read complete immutable validation attempt groups without mixing their runs
      x-semlia-actions: [asset.read, source.read, evidence.read, binding.read]
      x-semlia-reauthorize: true
      parameters:
        - name: version
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Version' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Attempt-number descending page fixed to one operation version; no implicit active-attempt fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationAttemptPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: validateProductionOperation
      summary: Queue a fresh validation attempt for the identical frozen set
      x-semlia-actions: [validation.run, source.read, evidence.read, asset.read, binding.read]
      x-semlia-reauthorize: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateProductionRequest' }
      responses: *asyncResponses
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/reviews:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OperationId'
    post:
      operationId: reviewProductionOperation
      summary: Add existing Review facts to selected members of one exact frozen set
      x-semlia-actions: [proposal.review, asset.read, source.read, evidence.read, binding.read]
      x-semlia-reauthorize: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewProductionRequest' }
      responses: *operationWriteResponses
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/publish:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OperationId'
    post:
      operationId: publishProductionOperation
      summary: Publish all proposals and complete manifest in one transaction
      x-semlia-actions: [release.publish, asset.read, source.read, evidence.read, binding.read]
      x-semlia-reauthorize: true
      x-semlia-human-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishProductionRequest' }
      responses: &releaseWriteResponses
        '200':
          description: Authorized replay of the committed release
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseCommandResult' }
        '201':
          description: All members committed as one immutable release
          headers:
            Location:
              schema: { type: string, maxLength: 2048 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseCommandResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/business-rule-confirmations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OperationId'
    post:
      operationId: recordProductionBusinessRule
      summary: Confirm or revoke exact business definitions as a human contributor
      x-semlia-actions: [asset.read, asset.propose, evidence.read, source.read]
      x-semlia-reauthorize: true
      x-semlia-human-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionBusinessRuleRequest' }
      responses:
        '201':
          description: Immutable event committed; old validation requires rerun
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionBusinessRuleEvent' }
        '200':
          description: Original event replay, not a renewed confirmation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionBusinessRuleEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: listProductionBusinessRules
      summary: Latest event per target and current validity for an exact version
      x-semlia-actions: [asset.read, evidence.read, source.read]
      x-semlia-reauthorize: true
      parameters:
        - name: version
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Version' }
      responses:
        '200':
          description: Latest events ordered by target key
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 32
                    items: { $ref: '#/components/schemas/ProductionBusinessRuleWitness' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/generation:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OperationId'
    post:
      operationId: generateProductionSuggestions
      summary: Queue an explicitly authorized model run against a draft input version
      x-semlia-actions: [asset.propose, source.read, evidence.read, binding.read]
      x-semlia-reauthorize: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateProductionRequest' }
      responses:
        '200':
          description: Replayed run; never triggers another model call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationResult' }
        '202':
          description: Existing AgentRun/job persisted; Location is the run recovery URL
          headers:
            Location:
              schema: { type: string, maxLength: 2048 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/production-operations/{operationId}/generation/{runId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/OperationId'
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getProductionGeneration
      summary: Recover exact model provenance and structured suggestions without resending
      x-semlia-actions: [asset.read, source.read, evidence.read, binding.read]
      x-semlia-reauthorize: true
      responses:
        '200':
          description: Existing AgentRun-derived status, sanitized error and bounded output
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationResult' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/production-releases/{releaseId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ReleaseId'
    get:
      operationId: getProductionRelease
      summary: Read complete production attribution and exact before/after pins
      x-semlia-actions: [asset.read, source.read, evidence.read, binding.read]
      x-semlia-reauthorize: true
      responses:
        '200':
          description: Complete production detail, not a second release authority
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionRelease' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces/{workspaceId}/production-releases/{releaseId}/rollback:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ReleaseId'
    post:
      operationId: rollbackProductionRelease
      summary: Create a latest-only release restoring the exact before manifest including absence
      x-semlia-actions: [release.rollback, asset.read, source.read, evidence.read, binding.read]
      x-semlia-reauthorize: true
      x-semlia-human-required: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RollbackProductionRequest' }
      responses: *releaseWriteResponses
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-semlia_session
      description: Existing authenticated management session; development cookie remains semlia_session_dev. Existing CSRF/origin checks apply. No machine bearer expansion.
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceId' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Workspace/principal/command scoped, no automatic expiry while authoritative records remain
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque authenticated keyset token bound to workspace, resource, filter and upper watermark; not an offset
      schema: { type: string, maxLength: 2048 }
  responses:
    Error:
      description: Stable sanitized error; status/code/recovery semantics are defined in production.md
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductionError' }
  schemas:
    ResourceId:
      type: string
      pattern: '^[a-z][a-z0-9_]{1,31}_[0-7][0-9a-hjkmnp-tv-z]{25}$'
      maxLength: 59
      description: TypeID shape only; server must enforce each domain prefix, UUIDv7, existence, ownership and workspace. ssnp and prodop are planned prefixes.
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      minLength: 71
      maxLength: 71
    Timestamp: { type: string, format: date-time }
    Version: { type: integer, minimum: 1, maximum: 2147483647 }
    LocalKey: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', maxLength: 64 }
    TargetKind:
      type: string
      enum: [semantic_asset, physical_binding, model_grain, entity_key, join_contract]
    ObjectKind:
      type: string
      enum: [physical_binding, model_grain, entity_key, join_contract]
    MemberKind: { type: string, enum: [dataset, field, code, lineage] }
    HistoryQuality: { type: string, enum: [verified, unverifiable] }
    SourceSnapshot:
      type: object
      additionalProperties: false
      required: [id, sourceId, sourceRevisionId, adapterVersion, scopeDigest, contentDigest, historyQuality, coverageStatus, coverage, memberCount, diagnosticCount, createdAt]
      properties:
        id: { $ref: '#/components/schemas/ResourceId' }
        sourceId: { $ref: '#/components/schemas/ResourceId' }
        sourceRevisionId: { $ref: '#/components/schemas/ResourceId' }
        adapterVersion: { type: string, minLength: 1, maxLength: 128 }
        scopeDigest: { $ref: '#/components/schemas/Digest' }
        contentDigest: { $ref: '#/components/schemas/Digest' }
        historyQuality: { $ref: '#/components/schemas/HistoryQuality' }
        coverageStatus: { type: string, enum: [complete, partial, failed] }
        coverage:
          type: array
          minItems: 1
          maxItems: 256
