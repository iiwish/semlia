        - properties:
            kind: { type: string, enum: [entity_key] }
            content: { $ref: '#/components/schemas/EntityKeyContent' }
        - properties:
            kind: { type: string, enum: [join_contract] }
            content: { $ref: '#/components/schemas/JoinContent' }
    JSONValue:
      nullable: true
      description: Structured JSON value bounded by 1 MiB request and depth 32; null remains a real value, not absence. Unknown target content fields are separately forbidden.
    ChangeList:
      type: array
      maxItems: 100
      items: { $ref: '#/components/schemas/Change' }
    Change:
      oneOf:
        - type: object
          additionalProperties: false
          required: [fieldPath, op, afterValue]
          properties:
            fieldPath: { type: string, minLength: 1, maxLength: 512 }
            op: { type: string, enum: [add] }
            afterValue: { $ref: '#/components/schemas/JSONValue' }
        - type: object
          additionalProperties: false
          required: [fieldPath, op, beforeValue, afterValue]
          properties:
            fieldPath: { type: string, minLength: 1, maxLength: 512 }
            op: { type: string, enum: [update] }
            beforeValue: { $ref: '#/components/schemas/JSONValue' }
            afterValue: { $ref: '#/components/schemas/JSONValue' }
        - type: object
          additionalProperties: false
          required: [fieldPath, op, beforeValue]
          properties:
            fieldPath: { type: string, minLength: 1, maxLength: 512 }
            op: { type: string, enum: [remove] }
            beforeValue: { $ref: '#/components/schemas/JSONValue' }
    ProductionTarget:
      oneOf:
        - $ref: '#/components/schemas/CreateTarget'
        - $ref: '#/components/schemas/UpdateAssetTarget'
        - $ref: '#/components/schemas/UpdateObjectTarget'
      description: Update branch is further discriminated by target kind. Create has no baseline fields; no fake base revision is accepted.
    CreateTarget:
      type: object
      additionalProperties: false
      required: [intent, kind, localKey, identityKey, title, content, changes, evidenceIds]
      allOf:
        - $ref: '#/components/schemas/TargetKindContent'
      properties:
        intent: { type: string, enum: [create] }
        kind: { $ref: '#/components/schemas/TargetKind' }
        localKey: { $ref: '#/components/schemas/LocalKey' }
        identityKey: { type: string, minLength: 1, maxLength: 512 }
        reuseIdentity: { $ref: '#/components/schemas/ReintroductionIdentity' }
        title: { type: string, minLength: 1, maxLength: 256 }
        content: { type: object }
        changes: { type: array, maxItems: 0, items: { $ref: '#/components/schemas/Change' } }
        evidenceIds: { type: array, maxItems: 256, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceId' } }
      description: Omit reuseIdentity for a new identity. Supply it only to reintroduce a trusted production-created identity absent from the exact current published head; intent remains create and no baseline fields are allowed.
    ReintroductionIdentity:
      type: object
      additionalProperties: false
      required: [targetId, creationOperationId, creationReleaseId, absenceReleaseId, expectedHead]
      properties:
        targetId: { $ref: '#/components/schemas/ResourceId' }
        creationOperationId: { $ref: '#/components/schemas/ResourceId' }
        creationReleaseId: { $ref: '#/components/schemas/ResourceId' }
        absenceReleaseId: { $ref: '#/components/schemas/ResourceId' }
        expectedHead: { $ref: '#/components/schemas/PresentHeadReference' }
      description: Server proves original reservation kind/identityKey/ownership, the protected rollback absence event and continued absence at current head. This is not a client assertion of a published base.
    UpdateAssetTarget:
      type: object
      additionalProperties: false
      required: [intent, kind, localKey, targetId, baseRevisionId, title, content, changes, evidenceIds]
      properties:
        intent: { type: string, enum: [update] }
        kind: { type: string, enum: [semantic_asset] }
        localKey: { $ref: '#/components/schemas/LocalKey' }
        targetId: { $ref: '#/components/schemas/ResourceId' }
        baseRevisionId: { $ref: '#/components/schemas/ResourceId' }
        title: { type: string, minLength: 1, maxLength: 256 }
        content: { $ref: '#/components/schemas/AssetContent' }
        changes: { $ref: '#/components/schemas/ChangeList' }
        evidenceIds: { type: array, maxItems: 256, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceId' } }
    UpdateObjectTarget:
