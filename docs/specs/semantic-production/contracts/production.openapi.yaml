            localKey: { $ref: '#/components/schemas/LocalKey' }
        - $ref: '#/components/schemas/PublishedReference'
    PublishedReference:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, targetId, releaseId, revisionId]
          properties:
            kind: { type: string, enum: [semantic_asset] }
            targetId: { $ref: '#/components/schemas/ResourceId' }
            releaseId: { $ref: '#/components/schemas/ResourceId' }
            revisionId: { $ref: '#/components/schemas/ResourceId' }
        - type: object
          additionalProperties: false
          required: [kind, targetId, releaseId, objectVersion, contentDigest]
          properties:
            kind: { $ref: '#/components/schemas/ObjectKind' }
            targetId: { $ref: '#/components/schemas/ResourceId' }
            releaseId: { $ref: '#/components/schemas/ResourceId' }
            objectVersion: { $ref: '#/components/schemas/Version' }
            contentDigest: { $ref: '#/components/schemas/Digest' }
    AssetContent:
      type: object
      additionalProperties: false
      required: [address, assetType, displayName, definition, scope, ownerPrincipalId]
      properties:
        address: { type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$', maxLength: 512 }
        assetType: { type: string, enum: [business_object, business_term, metric, data_asset, analysis_model] }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        definition: { type: string, minLength: 1, maxLength: 16384, nullable: true }
        scope: { type: string, minLength: 1, maxLength: 4096, nullable: true }
        ownerPrincipalId: { $ref: '#/components/schemas/ResourceId' }
      description: Null definition/scope explicitly means unresolved draft, blocked at validation; physical bindings are separate governed targets, not embedded copies.
    BindingContent:
      type: object
      additionalProperties: false
      required: [asset, dataset]
      properties:
        asset: { $ref: '#/components/schemas/SemanticReference' }
        dataset: { $ref: '#/components/schemas/PhysicalReference' }
        field: { $ref: '#/components/schemas/PhysicalReference' }
        transform: { type: string, minLength: 1, maxLength: 4096 }
    GrainContent:
      type: object
      additionalProperties: false
      required: [asset, expression, fields]
