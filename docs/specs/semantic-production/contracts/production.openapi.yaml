        expectedVersion: { $ref: '#/components/schemas/Version' }
        setDigest: { $ref: '#/components/schemas/Digest' }
        previousAttemptNo: { type: integer, minimum: 1, maximum: 256 }
        reason: { type: string, minLength: 1, maxLength: 4096 }
    ReviewProductionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, setDigest, validation, proposalIds, decision, note]
      properties:
        expectedVersion: { $ref: '#/components/schemas/Version' }
        setDigest: { $ref: '#/components/schemas/Digest' }
        validation: { $ref: '#/components/schemas/ValidationReference' }
        proposalIds: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceId' } }
        decision: { type: string, enum: [approve, reject] }
        note: { type: string, maxLength: 4096 }
    HeadReference:
      oneOf:
        - type: object
          additionalProperties: false
          required: [presence]
          properties:
            presence: { type: string, enum: [absent] }
        - $ref: '#/components/schemas/PresentHeadReference'
    PresentHeadReference:
      type: object
      additionalProperties: false
      required: [presence, releaseId, manifestDigest]
      properties:
        presence: { type: string, enum: [present] }
        releaseId: { $ref: '#/components/schemas/ResourceId' }
        manifestDigest: { $ref: '#/components/schemas/Digest' }
    ValidationReference:
      type: object
      additionalProperties: false
      required: [attemptNo, validationDigest]
      properties:
        attemptNo: { type: integer, minimum: 1, maximum: 256 }
        validationDigest: { $ref: '#/components/schemas/Digest' }
      description: One complete active attempt for this operation/version/set. Clients cannot choose individual run IDs or combine results from different attempts.
    ValidationAttemptResult:
      type: object
      additionalProperties: false
      required: [attemptNo, status, setDigest, freshnessDigest, requiredChecksDigest, validationDigest, runIds, checks, completedAt]
      allOf:
        - oneOf:
            - properties:
                status: { type: string, enum: [succeeded] }
                validationDigest: { $ref: '#/components/schemas/Digest' }
                runIds: { type: array, minItems: 1, maxItems: 256, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceId' } }
                completedAt: { $ref: '#/components/schemas/Timestamp' }
            - properties:
                status: { type: string, enum: [queued, running] }
                validationDigest: { nullable: true, enum: [null] }
                completedAt: { nullable: true, enum: [null] }
            - properties:
                status: { type: string, enum: [failed] }
                validationDigest: { nullable: true, enum: [null] }
                completedAt: { $ref: '#/components/schemas/Timestamp' }
      properties:
        attemptNo: { type: integer, minimum: 1, maximum: 256 }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        setDigest: { $ref: '#/components/schemas/Digest' }
        freshnessDigest: { $ref: '#/components/schemas/Digest' }
        requiredChecksDigest: { $ref: '#/components/schemas/Digest' }
        validationDigest: { type: string, nullable: true, maxLength: 71 }
        runIds: { type: array, maxItems: 256, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceId' } }
        checks: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/ValidationCheckResult' } }
        completedAt: { type: string, format: date-time, nullable: true }
      x-semlia-max-canonical-result-bytes: 1048576
      description: Entire latest requested attempt; succeeded requires every declared proposal/validator/version check, current freshness, and no blocker. A failed/running latest attempt never falls back to an older success.
    ValidationCheckResult:
      type: object
      additionalProperties: false
      required: [runId, proposalId, validatorId, validatorVersion, status, results]
      properties:
        runId: { $ref: '#/components/schemas/ResourceId' }
        proposalId: { $ref: '#/components/schemas/ResourceId' }
        validatorId: { type: string, pattern: '^[a-z][a-z0-9_.]{1,63}$', maxLength: 64 }
        validatorVersion: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [running, succeeded, failed, cancelled] }
        results:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [severity, code, message, inputDigest, details]
            properties:
              severity: { type: string, enum: [blocker, warning, info, not_applicable] }
              code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$', maxLength: 64 }
              message: { type: string, maxLength: 2048 }
              inputDigest: { $ref: '#/components/schemas/Digest' }
              details: { type: object, maxProperties: 32, additionalProperties: { $ref: '#/components/schemas/JSONValue' } }
      description: Projection of existing ValidationRun/Result facts for this exact attempt; no extra result authority. All checks together have a 1 MiB canonical-result budget and never truncate into a successful attempt.
    ValidationStatus:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, enum: [not_requested] }
        - $ref: '#/components/schemas/ValidationAttemptResult'
    ValidationAttemptPage:
      type: object
      additionalProperties: false
      required: [operationId, version, items, nextCursor]
