scope_rules:
  - Allowed list is a maximum. Preserve the entire dirty checkout.
  - Generate Go/sqlc/SDK only with existing generators.
  - Add submit, validations, reviews, publish, and rollback endpoints for production operations.
  - Intercept legacy endpoints for production members and protected releases with 409 PRODUCTION_SET_REQUIRED.
  - Migrations 23–25 remain byte-identical. Migration 26 is atomic, expand-first, preserves unverifiable existing history and refuses unsafe downgrade; no existing database migrations.
  - Preserve T003 authoring invariants and accepted tests. Shared production helpers may add trusted release proof integration, never fabricate history or implement T005 model jobs.
implementation_obligations:
  - Replace synthetic succeeded validation records with atomic queued attempt/job intent, real deterministic registry checks outside the write transaction, and a fenced complete result commit. New manual attempts rerun every required check; job retries remain on the same attempt.
  - Bind exact version/set/input/freshness/validator-policy/check results in attempt, review and publish. Reauthorize full input and target scopes at mutation commit and every replay/read; active attempt CAS, current reviewer grants and whole-set SoD are mandatory.
  - Preserve complete prior release manifest and unchanged pins. Publish exact canonical target business content for all five kinds, include real governed registry snapshots, adopted review IDs, attribution, binding inputs, outbox and audit atomically. No empty-content fallback, ignored SQL failure, synthetic success or missing object-row shortcut.
  - Rollback restores exact trusted before manifest, verifies dependency closure and current head under lock, retains absent identities/history, and carries protection plus original attribution through repeated rollback. Integrate legitimate reintroduction proof without accepting unknown legacy history.
  - Review original API, service, repository and DB bypass paths. Validation history uses complete bounded attempts with version-bound keyset cursors rather than mixed/latest runs.
  - Validate and strengthen existing migration-24 tables via migration 26: production_validation_attempts, production_validation_bindings, production_review_bindings, release_proposals, release protection extensions, production_release_manifests, production_release_before_pins, production_release_binding_inputs.
  - Implement Submit: freezes version, sets state to proposed -> validating, enqueues validation job with attempt=1.
  - Implement Validations: CAS attempt increment, full deterministic check set, validation digest calculation.
  - Implement Reviews: bind to active validation attempt & setDigest, enforce SoD (author, editors, AI actors cannot review), approve keeps in_review, reject moves to rejected.
  - Implement Atomic Publish: verify active completed attempt, all required reviews, expectedHead CAS, write all new revisions/rows, manifest, before pins, release protection, catalog pointers, outbox, audit in one transaction. Any failure rolls back entire transaction.
  - Implement Protected Rollback: latest release only, expectedHead CAS, restore before manifest, increment rollback depth, maintain audit.
  - Implement Legacy Guard: legacy submit/publish/review/rollback reject production members and protected releases with PRODUCTION_SET_REQUIRED.
tdd:
  red: Test multi-object submit, validation job enqueue, review binding, SoD rejection, atomic publish failure rollback, absent pin rollback, and legacy bypass rejection.
  green: Minimal transactional implementation adhering to SSOT state machines and constraints.
  refactor: Clean helper boundaries without introducing new dependencies or altering public behavior.
