scope_rules:
  - Allowed list is a maximum. Preserve the entire dirty checkout; compare against the task snapshot, not HEAD.
  - Generate Go/sqlc/SDK only with existing generators. Preserve all existing public Go/SDK names and constants; avoid new generic-schema naming collisions using supported x-go-name when needed.
  - Add only POST/GET collection and GET/PUT operation routes plus compatible optional Proposal fields. No submit, validate, review, publish, generation or rollback endpoints in this task.
  - Config/main/readiness/env edits only supply an explicit default-off production feature fence and exact migration-23 readiness. Old-writer draining is a deployment prerequisite, not a claim that old binaries understand the flag.
  - HTTP catalog.go is the existing shared route registry; governance.go is allowed only for production-member read/write guards and additive field projection. Machine bearer allowlist stays unchanged.
  - Readiness and migration-inventory tests retain true old-stage checks. Do not weaken assertions or rewrite existing migrations.
implementation_obligations:
  - Implement the eleven production tables in data-model section 3, exact workspace FKs, immutable historical versions/targets/commands/claims/contributors, reservations and Proposal expand-first shape constraints. Provision generation link/output/application storage for T005; do not implement model jobs or invent successful runs.
  - Creation starts with zero assets/releases and creates real draft identities with current_revision_id NULL, real draft Proposals with intent=create and NULL base, complete candidate links and command/audit/outbox records in one transaction. Other four governed-object create targets do not get incomplete formal registry rows.
  - Support all five target kinds and create/update, finite local references, exact published dependency pins and physical snapshot members. Enforce role-specific dataset/field reference kinds and field parent revisions. Never treat mutable registry/current pointers as published or historical evidence.
  - Validate actual input snapshot/digest/coverage selection and current per-unit head, candidate contents/evidence relation, evidence digest/readability, baseline head and target domain uniqueness. Failed/partial latest necessary units fail closed. An input cannot carry competing versions for the same source unit/object.
  - Enforce full read scopes plus propose/manage scopes for all inputs/targets/dependencies. Derive actor from authenticated principal, require the authorizer, fence workspace authorization version inside every transaction and reauthorize replay/recovery. Cross-workspace unknown IDs are 404; known denied scopes 403; never leak existing operation identity before complete read authorization.
  - Strict production-only JSON validation rejects unknown and duplicate keys, invalid UTF-8, trailing values, excessive depth/numbers and all aggregate limits. Keep numeric lexemes and business text intact. Do not change the global legacy CanonicalJSON/digest algorithm.
  - Canonical input plus targets is at most 768 KiB, body at most the existing stricter cap up to 1 MiB, depth 32, targets 32, changes at most 100 per target and 256 total. Unordered sets sort deterministically and reject duplicates; change order is meaningful. Persist byte-precise canonical authority, not a jsonb reserialization that changes number literals.
  - For update, require real current published asset/object baseline, replay legal dot-path changes against that content, compute server digests and match the complete desired result. Do not allow identity/address/type edits or fake client before values. Preserve ordinary legacy draft-base update behavior.
  - Enforce explicit candidate primaryTargetKey mapped to an actual create/changed Proposal, immutable original decisions and complete per-target links. A no_change primary in a mixed request is CONTENT_MISMATCH; all no_change operations remain queryable without any Proposal or convert decision.
  - Idempotency is workspace plus authenticated principal plus command kind plus key; request digest includes URI/resource/version/full business content. Commit the command result with all writes. Replays reauthorize, same-key changed body conflicts. A separate business claim prevents different-key/caller no-candidate duplicates without changing original authorship.
  - Identity collisions serialize on natural domain identities and reservations. Authorized identical inputs return ALREADY_PRODUCED with existing operation; different content returns IDENTITY_CONFLICT. Never silently adopt an unrelated existing asset or overwrite a reservation target ID.
  - PUT is full-set expectedVersion CAS while all members are draft, retains immutable earlier input/target content, rejects removed members through existing legal state transitions, preserves stable identities and records contributors. Supersede preserves original decisions/versions, transfers only authorized reservation ownership and does not reset terminal Proposals or inherit approval.
  - reuseIdentity requires actual trusted creation/absence proof. Before T004 provides production release proof, unknown/unverifiable history must return PRIOR_STATE_UNKNOWN rather than manufacturing a baseline or releasing content. Keep the contract-compatible storage for later proof handling.
  - suggestionRunId must reference a real same-operation successful persisted output for the exact source version, never a stub created to satisfy the request. Validate available output and record immutable server-computed application/delta if applied; absent generation capability does not authorize inventing data.
  - GET latest or specified version is authoritative server recovery. Immutable old target content must not be rebuilt from current mutable Proposal changes. List summaries use created_at/id and fixed watermark, source/candidate/createdBy filters, signed resource/filter-bound cursor, limit 1..200 and full-item scope filtering; all responses stay within 4 MiB without truncating an object.
  - Before T004, legacy changes/submit/review/publish/convert and catalog revision/status paths cannot advance or bypass a production reservation/member. Add storage/constraint defenses as well as HTTP/application guards, preserving ordinary legacy objects and existing release-only consumption.
  - Migrations 23 and 24 remain unchanged. Migration 25 adds draft integrity and canonical history, preserving old rows as unverifiable rather than fabricating evidence; exact readiness and safe down cover the new version. No production or default-development database migrations during this repair.
tdd:
  red: Add discriminating runtime failures before implementing cold-start, transaction rollback/response-loss recovery, exact-input history, same/different-key and concurrent identity races, authorization revocation/cross-workspace reads, draft-version conflicts, strict parsing and old-write guards.
  green: Use existing domain/service/store patterns and real isolated PostgreSQL. No nested self-committing repository methods inside production transaction ownership.
  refactor: Only simplify touched production helpers when needed; no unrelated architecture or frontend rewrite.
