  concurrency: Host storage is constrained. All DB/CLI readiness tests run serially with -p=1; do not start an extra DB test lane or prune shared Docker resources. Clean only test-owned exact resources if verified orphaned.
  prohibited: No make check/dev/default Compose, deployment, existing DB migration, paid/live models, Git commit/push/reset, dependency changes, frontend build or live customer data.
evidence:
  output: Exact changed files and hash delta versus T003 checkout, actual RED/GREEN commands stdout/stderr/exit status and UTC times, zero-business-object starting counts, atomic commit/failure counts, authorization/concurrency and legacy compatibility results, unverified cases and residual risk.
  file_policy: Use apply_patch for manual source/Markdown edits; structured file APIs may save generated raw logs/diffs/hashes without overwriting old evidence. SDK test is tsc --noEmit, not a runtime assertion.
stop_conditions:
  - Do not start while status is Draft, delegate further, mark Accepted, or implement T004/T005 behavior.
  - If a required file is outside allowlist, request the exact ownership extension before writing. If contract meaning/security changes are needed, stop and report rather than silently reducing scope.
  - Never revert user or other-agent work. Unexpected unrelated changes remain untouched; report only blocking conflicts.
  - Failed/skipped safety checks and missing runtime proof are not passes. Do not lower limits/permissions/FKs/CAS checks or replace genuine PostgreSQL evidence with mocks.
