forbidden:
  - 不改任何应用代码、原有测试、迁移、依赖、正式 OpenAPI、生成物或其他历史证据。
  - 不删除或恢复用户及其他 agent 的工作；新文件冲突或范围不足时报告 PM。
  - 不调用付费或实际模型、不部署、不操作默认数据库或 Compose 栈、不提交或推送。
  - 不因测试失败放松断言，不将静态契约通过报告为 API/数据库实现通过。
design_obligations:
  - 来源快照须精确成员、名称、revision、范围及覆盖；复用未变化 revision；历史不足不可伪造。
  - create/update 明确区分，create 无 base revision；精确说明旧 proposals NOT NULL/check 的 expand-first 迁移和身份预留。
  - 32 targets / 100 changes per target / 256 total，规范化摘要、有界输入及输出、服务端幂等和重放重新鉴权。
  - 固定生产集合、输入和依赖闭合；复用 Proposal/Validation/Review，不创建第二审批状态机。
  - 所有成员原子发布，事务内授权/SoD/版本复查；禁止 group member 用旧单项发布绕过。
  - 多提案 release 归因完整；旧 digest/消费兼容；回滚恢复完整 before manifest，包括新建对象缺席。
  - 明确新旧 API/旧数据库/旧二进制兼容矩阵；不可无损表达时拒绝 down migration，不空表装成功。
  - 模型网络在事务外，结果重验，实际模型与 stub 分开；桌面限定 1440x900 和 1024x768。
  - HTTP 方法/路径/权限/错误/分页/请求响应 schema 必须足够实现；详细文档是 planned contract 非已上线接口。
  - 不扩张机器 allowlist，不暴露密钥；来源文本不构成模型或执行权限。
tdd:
  red: 先新增 TestSemanticProductionContract 并对缺失契约运行，保存真实失败日志与退出码。
  green: 用现有 kin-openapi 验证详细 YAML 及关键 schema 不变量，补完整契约后运行至通过。
  refactor: 仅受限整理新增校验辅助代码，使用现有依赖和结构化解析，不只匹配关键词。
