schema_version: 1
packet_id: SP-T007-A001
task_id: SP-T007
status: Accepted
mode: direct_execute
approval: 用户授权验收 T006 后完成 T007，并授权实际模型最多 30 次调用、不设费用限额。
dependencies: [SP-T006 Accepted]
objective: 按 SP-AC-001 至 SP-AC-012 完整回归，区分确定性协议能力、实际模型质量及兼容性失败。
inputs:
  - docs/specs/semantic-production/product-design.md
  - docs/specs/semantic-production/tasks.md
  - docs/specs/semantic-production/contracts/production.md
allowed_files:
  - go.mod
  - go.sum
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - internal/platform/http/handler.go
  - internal/application/governance/production_history.go
  - internal/domain/governance/release.go
  - internal/domain/governance/proposal.go
  - internal/domain/governance/production.go
  - docs/evidence/SP-T005/acceptance-review/re-review.md
  - docs/evidence/SP-T006/A001/test-results.md
  - tests/integration/governance/production_acceptance_test.go
  - tests/integration/governance/production_generation_test.go
  - tests/integration/db/semantic_production_migrations_test.go
  - tests/integration/db/database_test.go
  - tests/integration/db/execution_test.go
  - tests/integration/db/governed_objects_test.go
  - tests/integration/db/webhook_interfaces_test.go
  - tests/integration/db/machine_interfaces_test.go
  - tests/integration/operations/operations_test.go
  - tests/integration/projection/production_test.go
  - tests/fixtures/semantic-production/**
  - web/e2e-production/production.spec.ts
  - web/e2e-production/fixtures.ts
