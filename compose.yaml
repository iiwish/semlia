name: semlia-local

x-semlia-app: &semlia-app
  image: ${SEMLIA_IMAGE:-semlia:local}
  build:
    context: .
    dockerfile: deploy/local/Dockerfile
  environment: &semlia-environment
    SEMLIA_ENV: development
    SEMLIA_AUTH_MODE: ${SEMLIA_AUTH_MODE:-password}
    SEMLIA_ALLOWED_ORIGINS: ${SEMLIA_ALLOWED_ORIGINS:-http://127.0.0.1:8080}
    SEMLIA_DATABASE_URL: postgresql://semlia:${SEMLIA_POSTGRES_PASSWORD:?SEMLIA_POSTGRES_PASSWORD is required}@postgres:5432/semlia?sslmode=disable
    SEMLIA_SECRET_KEY: ${SEMLIA_SECRET_KEY:?SEMLIA_SECRET_KEY is required}
    SEMLIA_BUILD_VERSION: ${SEMLIA_BUILD_VERSION:-local}
    SEMLIA_LOG_FORMAT: json
    SEMLIA_ARTIFACT_STORE: local
    SEMLIA_ARTIFACT_ROOT: /var/lib/semlia/artifacts
    SEMLIA_ARTIFACT_RETENTION: 720h
    SEMLIA_EXECUTION_SOURCES: ${SEMLIA_EXECUTION_SOURCES:-}
    SEMLIA_EXECUTION_ALLOW_PLAINTEXT: ${SEMLIA_EXECUTION_ALLOW_PLAINTEXT:-false}
  networks:
    - backend
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: semlia
      POSTGRES_USER: semlia
      POSTGRES_PASSWORD: ${SEMLIA_POSTGRES_PASSWORD:?SEMLIA_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semlia -d semlia"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - backend
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    <<: *semlia-app
    command: ["migrate", "up"]
    environment:
      <<: *semlia-environment
      SEMLIA_MIGRATIONS_PATH: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *semlia-app
    command: ["server"]
    environment:
      <<: *semlia-environment
      SEMLIA_HTTP_ADDR: 0.0.0.0:8080
      SEMLIA_WORKER_CONFIGURED: "true"
      SEMLIA_SOURCE_ARTIFACT_ROOT: /var/lib/semlia/content
      SEMLIA_UAT_LLM_KEY: ${SEMLIA_UAT_LLM_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/semlia", "healthcheck", "ready"]
      interval: 3s
      timeout: 4s
      retries: 30
      start_period: 3s
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - artifact-data:/var/lib/semlia/artifacts
      - git-content:/var/lib/semlia/content:ro

  worker:
    <<: *semlia-app
    command: ["worker"]
    environment:
      <<: *semlia-environment
      SEMLIA_GIT_REPOSITORY: /var/lib/semlia/content
      SEMLIA_SOURCE_ARTIFACT_ROOT: /var/lib/semlia/content
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - git-content:/var/lib/semlia/content
      - artifact-data:/var/lib/semlia/artifacts

networks:
  backend:

volumes:
  postgres-data:
  git-content:
  artifact-data:
